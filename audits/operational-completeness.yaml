classification_vocabulary:
  SUBSTANTIVELY_RECONSTRUCTED:
    meaning: >
      The object contains a developed governing contract or registry, explicit scope,
      identity, provenance, limits, valid operations, termination, and behavioral validation.
      This classification does not constitute doctrinal certification.
  PARTIALLY_RECONSTRUCTED:
    meaning: >
      A substantial contract or implementation exists, but important execution,
      evidence domains, source-specific applications, or authoritative composition remain incomplete.
  MAPPED_TO_RICHER_RECORDS:
    meaning: >
      The object is principally an index or compact interface to richer records.
  STRUCTURAL_PLACEHOLDER:
    meaning: >
      The object is loadable but insufficient to govern reliable inquiry by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: No material implementation exists.

summary:
  structural_validation: REQUIRED_FOR_CURRENT_REVISION
  semantic_completion: INCOMPLETE
  doctrinal_certification: NOT_CERTIFIED
  runtime_readiness: LIMITED
  completed_operational_units:
    - speech mechanism contract
    - speech request validation and candidate report structure
    - six hermeneutic contracts
    - four inquiry method contracts
    - seven read-only foundational problem bundles
    - typed corpus registry exhaustive for current committed source and study state
    - corpus identity, path, coverage, predecessor, witness, and gap validation
  remaining_major_deficiencies:
    - findings index remains a reference-only mapping rather than an exhaustive typed registry
    - source-specific applications of method and hermeneutics remain incomplete
    - most of the nineteen Theologico-Political writings lack item-level source-status records and independent studies
    - Socrates and Aristophanes lacks a separately registered reviewed edition and fingerprint
    - direct Aristophanes, Xenophon, biblical, medieval, and most Platonic witness studies remain incomplete
    - authoritative natural-language ministerial judgment remains a reasoning operation
    - doctrinal certification and successor activation remain separately unauthorized
  central_finding: >
    The corpus seam is now operationally honest: every source identity and studies-tree
    record presently committed is typed and accounted for, while every known absence is
    preserved as a positive gap. Current-state exhaustiveness and corpus completeness are
    explicitly distinct.

