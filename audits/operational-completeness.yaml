classification_vocabulary:
  SUBSTANTIVELY_RECONSTRUCTED:
    meaning: A developed record exists with explicit identity, provenance, limits, operations, and termination; this is not doctrinal certification.
  PARTIALLY_RECONSTRUCTED:
    meaning: A substantial implementation exists, but important evidence or source-specific applications remain incomplete.
  MAPPED_TO_RICHER_RECORDS:
    meaning: The object principally indexes or references richer repository records.
  STRUCTURAL_PLACEHOLDER:
    meaning: The object is loadable but insufficient to govern reliable inquiry by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: No material implementation exists.

