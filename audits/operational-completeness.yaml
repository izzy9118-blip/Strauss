schema_version: 1.0
record_type: operational_completeness_audit

identity:
  id: STRAUSS-OPERATIONAL-AUDIT-001
  title: Strauss Operational Interface Completeness Audit
  version: 1.0.0

status:
  lifecycle: ACTIVE_PRODUCTION_AUDIT
  certification: NOT_CERTIFIED
  audit_scope_complete: true
  repository_completion: INCOMPLETE

basis:
  repository: izzy9118-blip/Strauss
  audited_interface_commit: 711ddf2c47483f319742574dfba843af2248a202
  manifest: manifest.yaml
  mapping_record: migrations/lean-operational-interface.yaml
  governing_rule: >
    Structural validity, path resolution, and successful loading do not establish
    substantive reconstruction, behavioral adequacy, doctrinal truth, or ministerial
    readiness. Every operational object must state its own level of completion.

classification_vocabulary:
  SUBSTANTIVELY_RECONSTRUCTED:
    meaning: >
      The object contains a developed governing question, evidence requirements,
      operations, limits, valid outputs, failure conditions, and termination rule.
      This classification does not constitute doctrinal certification.
  PARTIALLY_RECONSTRUCTED:
    meaning: >
      A substantial contract or implementation exists, but important operations,
      evidence domains, behavioral tests, or source-specific applications remain incomplete.
  MAPPED_TO_RICHER_RECORDS:
    meaning: >
      The object is principally a compact interface to richer governing records and
      must not be mistaken for a self-sufficient reconstruction.
  STRUCTURAL_PLACEHOLDER:
    meaning: >
      The object supplies headings, brief rules, or loadable structure but is not yet
      sufficient to govern reliable inquiry or expression by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: >
      The promised operation has no material implementation or usable governing record.

summary:
  structural_validation: PASSED_FOR_AUDITED_INTERFACE_COMMIT
  semantic_completion: INCOMPLETE
  doctrinal_certification: NOT_CERTIFIED
  runtime_readiness: LIMITED
  central_finding: >
    The lean interface is a useful and validated discovery and loading layer over a
    substantial but uneven repository. It must not be described as a completed Strauss
    reasoner. The largest immediate deficiency is the speech mechanism, followed by the
    compressed hermeneutic and method interfaces and the reference-only corpus and
    findings indexes.

records:
  - path: manifest.yaml
    classification: PARTIALLY_RECONSTRUCTED
    present_function:
      - canonical load order
      - seven-problem registration
      - source hierarchy and proposition-kind declaration
      - non-destructive migration and Sanctum boundary
    missing_or_incomplete:
      - explicit distinction between structural validation and semantic completion
      - per-component completion state
      - behavioral readiness threshold
      - audit reference and repinning rule
    priority: IMMEDIATE

  - path: adapter.py
    classification: PARTIALLY_RECONSTRUCTED
    present_function:
      - path-safe YAML loading
      - manifest and canonical-order validation
      - read-only context assembly
    missing_or_incomplete:
      - substantive speech-request validation
      - typed candidate ministerial-report construction
      - evidence-field enforcement
      - irony, comedy, concealment, audience, and uncertainty controls
      - contract-version compatibility checks
    priority: IMMEDIATE

  - path: speech/speech-mechanism.yaml
    classification: STRUCTURAL_PLACEHOLDER
    present_function:
      - output headings
      - proposition-kind definitions
      - basic voice and outside-my-ground rules
    missing_or_incomplete:
      - input contract
      - ordered reasoning-to-expression pipeline
      - audience and rhetorical assessment
      - speech-and-deed relation assignment
      - positive-evidence threshold for concealment
      - operational irony and comedy controls
      - typed output contract and provenance
      - failure, stopping, and termination conditions
      - behavioral test requirements
    priority: FIRST_PRODUCTION_UNIT

  - path: hermeneutics/literary-concealment.yaml
    classification: MAPPED_TO_RICHER_RECORDS
    richer_records:
      - protocols/irony.yaml
      - protocols/audience-and-rhetoric.yaml
      - protocols/speech-and-deed.yaml
    limit: >
      The compact file preserves major prohibitions but does not reproduce the required
      comparisons, evidence threshold, valid outputs, or termination rules of its sources.
    priority: AFTER_SPEECH

  - path: hermeneutics/whole-and-part.yaml
    classification: STRUCTURAL_PLACEHOLDER
    richer_records:
      - protocols/speech-and-deed.yaml
      - protocols/inference-discipline.yaml
    limit: >
      It identifies sequence and compositional whole but lacks a full application
      contract for passage, work, corpus, and problem-level comparison.
    priority: AFTER_SPEECH

  - path: hermeneutics/speaker-and-author.yaml
    classification: STRUCTURAL_PLACEHOLDER
    richer_records:
      - protocols/speech-and-deed.yaml
      - protocols/audience-and-rhetoric.yaml
    limit: >
      Attribution distinctions are stated but documentary-layer tests, authorial-deed
      criteria, and valid attribution outputs remain undeveloped.
    priority: AFTER_SPEECH

  - path: hermeneutics/audience.yaml
    classification: MAPPED_TO_RICHER_RECORDS
    richer_records:
      - protocols/audience-and-rhetoric.yaml
      - protocols/claimant-to-wisdom.yaml
    limit: >
      The compact file omits most audience dimensions, communication forms,
      responsibility tests, capture risks, and completion conditions.
    priority: AFTER_SPEECH

  - path: hermeneutics/contradiction.yaml
    classification: PARTIALLY_RECONSTRUCTED
    richer_records:
      - protocols/inference-discipline.yaml
      - protocols/uncertainty-preservation.yaml
      - protocols/speech-and-deed.yaml
    limit: >
      It has a governing question, tests, and valid outputs but lacks evidence fields,
      burden rules, and an operational termination contract.
    priority: SECONDARY

  - path: hermeneutics/historical-and-philosophical-understanding.yaml
    classification: STRUCTURAL_PLACEHOLDER
    richer_records:
      - protocols/source-status.yaml
      - protocols/inference-discipline.yaml
      - protocols/uncertainty-preservation.yaml
    limit: >
      It states the distinction but does not yet govern historical reconstruction,
      causal claims, transhistorical testing, or source-specific evidentiary burdens.
    priority: SECONDARY

  - path: method/recover-question.yaml
    classification: PARTIALLY_RECONSTRUCTED
    limit: >
      The sequence is sound but lacks required inputs, typed outputs, failure recovery,
      source-location requirements, and tests against false topic substitution.
    priority: AFTER_HERMENEUTICS

  - path: method/reconstruct-alternatives.yaml
    classification: PARTIALLY_RECONSTRUCTED
    limit: >
      Independent reconstruction and burden preservation are present, but claimant
      records, comparison gates, asymmetry handling, and termination criteria remain partial.
    priority: AFTER_HERMENEUTICS

  - path: method/textual-order.yaml
    classification: PARTIALLY_RECONSTRUCTED
    limit: >
      Sequential reading and transition tracking are stated, but there is no typed
      sequence record, completeness test, or enforcement against thematic rearrangement.
    priority: AFTER_HERMENEUTICS

  - path: method/preserve-problem.yaml
    classification: PARTIALLY_RECONSTRUCTED
    limit: >
      The non-closure principle is explicit, but burdens, rival alternatives,
      jurisdictional seams, and valid non-resolution outputs require fuller contracts.
    priority: AFTER_HERMENEUTICS

  - path: corpus/index.yaml
    classification: MAPPED_TO_RICHER_RECORDS
    limit: >
      It is a discovery index, not a complete corpus manifest. It lacks exhaustive work,
      edition, witness, hash, location, and source-status registrations.
    priority: LATER_FOUNDATIONAL_PRODUCTION

  - path: findings/index.yaml
    classification: MAPPED_TO_RICHER_RECORDS
    limit: >
      It indexes selected completed or provisional studies but is not a complete typed
      findings store and does not enumerate every finding, evidence reference, revision,
      dissent, or supersession relation.
    priority: LATER_FOUNDATIONAL_PRODUCTION

  - path: migrations/lean-operational-interface.yaml
    classification: SUBSTANTIVELY_RECONSTRUCTED
    limit: >
      The mapping accurately preserves non-destructive provenance, but it governs
      architecture only and does not establish semantic completeness of mapped objects.
    priority: MAINTAIN

  - path: tests/test_adapter.py
    classification: STRUCTURAL_PLACEHOLDER
    limit: >
      Tests cover path loading, canonical order, brother-problem presence, and basic
      safeguards but not behavioral speech, evidence, audience, irony, comedy,
      concealment, uncertainty, or outside-my-ground contracts.
    priority: IMMEDIATE

  - path: .github/workflows/validate-lean-interface.yml
    classification: PARTIALLY_RECONSTRUCTED
    limit: >
      The workflow executes validation and tests, but its value depends on the semantic
      depth of adapter validation and behavioral test coverage.
    priority: IMMEDIATE

production_order:
  - reconstruct speech/speech-mechanism.yaml as a substantive operational contract
  - extend adapter.py with semantic request validation and candidate report construction
  - add behavioral speech-mechanism tests
  - revise manifest.yaml to expose honest completion states and audit reference
  - reconstruct the six hermeneutic objects
  - reconstruct the four method objects
  - complete problem-specific operational profiles and source relations
  - replace reference-only corpus and findings indexes with typed exhaustive registries
  - repin Sanctum only after each validated Strauss interface revision

non_effects:
  - This audit does not certify any doctrine, claimant, successor problem, or migration.
  - This audit does not alter active predecessors or accepted migration sources.
  - An incomplete classification is a production finding, not a reason to delete the record.
  - Later completion must proceed through forward revision with preserved provenance.
