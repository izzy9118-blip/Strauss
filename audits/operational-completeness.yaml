classification_vocabulary:
  SUBSTANTIVELY_RECONSTRUCTED:
    meaning: >
      The object contains a developed governing contract or complete declared bundle with
      identity, evidence or source relations, limits, valid operations, termination, and
      behavioral validation. This does not constitute doctrinal certification.
  PARTIALLY_RECONSTRUCTED:
    meaning: >
      A substantial contract or implementation exists, but important execution,
      evidence domains, source-specific applications, or authoritative composition remain incomplete.
  MAPPED_TO_RICHER_RECORDS:
    meaning: >
      The object is principally an index or compact interface to richer records.
  STRUCTURAL_PLACEHOLDER:
    meaning: >
      The object is loadable but insufficient to govern reliable inquiry by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: No material implementation exists.

summary:
  structural_validation: PASSED_FOR_CURRENT_REVISION
  semantic_completion: INCOMPLETE
  doctrinal_certification: NOT_CERTIFIED
  runtime_readiness: LIMITED
  completed_operational_units:
    - speech mechanism contract
    - speech request validation and candidate report structure
    - six hermeneutic contracts
    - four inquiry method contracts
    - seven read-only foundational problem bundles
    - problem-bundle identity, relation, non-certification, and path validation
  remaining_major_deficiencies:
    - source-specific applications of method and hermeneutics remain incomplete
    - independent witness reconstruction remains materially incomplete
    - proposition-level migration and certification remain incomplete where recorded
    - corpus index is not an exhaustive typed corpus registry
    - findings index is not an exhaustive typed findings registry
    - authoritative natural-language ministerial judgment remains a reasoning operation
    - doctrinal certification and successor activation remain separately unauthorized
  central_finding: >
    The repository can now load each permanent problem together with its governing
    constitution, inquiry operations, witnesses, relations, and syntheses. This completes
    the operational bundle seam, not the documentary work that the bundle records as pending.

records:
  - path: manifest.yaml
    classification: PARTIALLY_RECONSTRUCTED
    present_function:
      - canonical load order and seven-problem registration
      - honest structural, semantic, runtime, and certification states
      - complete problem-bundle path declarations
      - speech, hermeneutic, and method contract registration
      - audit and Sanctum repinning rules
    remaining:
      - completion states must advance with corpus, findings, witnesses, and source applications
      - manifest does not itself perform reasoning

  - path: adapter.py
    classification: PARTIALLY_RECONSTRUCTED
    present_function:
      - path-safe YAML loading and manifest validation
      - speech-contract and typed request validation
      - candidate ministerial-report construction
      - evidence, irony, comedy, concealment, uncertainty, and pinning controls
      - loading of method and hermeneutic contracts
    remaining:
      - no automatic execution of method contracts over source records
      - no exhaustive corpus or findings resolution
      - no authoritative natural-language ministerial judgment

  - path: problem_bundles.py
    classification: SUBSTANTIVELY_RECONSTRUCTED
    present_function:
      - canonical selection of one or all seven foundational problems
      - read-only loading of constitution, inquiry profile, witness registry, relations, and syntheses
      - identity and canonical-order validation
      - controlled relation coverage and jurisdictional-boundary validation
      - acceptance of documented witness-registry layout variants without rewriting source files
      - explicit non-certification, non-activation, and predecessor-preservation effects
    remaining:
      - does not execute source interpretation
      - does not complete missing witnesses or syntheses
      - does not certify migrations or doctrine
      - does not confer Assembly authority

  - path: speech/speech-mechanism.yaml
    classification: PARTIALLY_RECONSTRUCTED
    contract_version: STRAUSS-SPEECH-CONTRACT-1
    present_function:
      - typed input and output contracts
      - reasoning-to-expression pipeline
      - evidence, audience, speech-and-deed, concealment, irony, comedy, and uncertainty controls
      - failure, termination, and Sanctum interoperability
    remaining:
      - source-grounded reasoning and final composition are not automatic
      - real report applications remain to be tested

  - path: hermeneutics/
    classification: SUBSTANTIVELY_RECONSTRUCTED
    contracts:
      - STRAUSS-HERMENEUTIC-LC-1
      - STRAUSS-HERMENEUTIC-WP-1
      - STRAUSS-HERMENEUTIC-SA-1
      - STRAUSS-HERMENEUTIC-AUD-1
      - STRAUSS-HERMENEUTIC-CON-1
      - STRAUSS-HERMENEUTIC-HPU-1
    present_function:
      - positive-evidence concealment threshold and opacity preservation
      - whole-part, sequence, corpus, and ending discipline
      - speaker, author, editor, translator, and documentary-layer attribution
      - audience, responsibility, partial enlightenment, and capture controls
      - contradiction burdens and affirmative nonresolution
      - historical reconstruction without causal reduction of philosophy
    remaining:
      - source-specific applications and certification

  - path: method/
    classification: SUBSTANTIVELY_RECONSTRUCTED
    contracts:
      - STRAUSS-METHOD-RQ-1
      - STRAUSS-METHOD-RA-1
      - STRAUSS-METHOD-TO-1
      - STRAUSS-METHOD-PP-1
    present_function:
      - recovery and separation of user, source, governing, topical, doctrinal, and routing questions
      - independent reconstruction, evidence asymmetry, comparison gates, and reciprocal burdens
      - ordered units, transitions, correction links, endings, and reproducibility controls
      - jurisdiction, dissent, seams, settlements, predecessor preservation, and affirmative nonresolution
    remaining:
      - source-specific applications and certification

  - path: problems/
    classification: SUBSTANTIVELY_RECONSTRUCTED_AS_READ_ONLY_OPERATIONAL_BUNDLES
    present_function:
      - seven successor constitutions and complete subordinate bundle paths
      - inquiry profiles, witness registries, reciprocal controlled relations, and synthesis records
      - active predecessor and accepted migration-source preservation where applicable
      - reciprocal brother-problem designation with non-absorption
    remaining:
      - source-specific witness and work reconstruction is uneven and often pending
      - bundle completeness does not establish proposition-level migration completion
      - successor certification and activation remain unauthorized
      - no bundle may promote provisional synthesis to doctrine

  - path: corpus/index.yaml
    classification: MAPPED_TO_RICHER_RECORDS
    remaining:
      - exhaustive work, edition, witness, hash, location, and source-status registrations
      - corpus completeness and gap records

  - path: findings/index.yaml
    classification: MAPPED_TO_RICHER_RECORDS
    remaining:
      - exhaustive typed findings, evidence, revisions, dissent, and supersession relations
      - queryable problem and witness bindings

  - path: migrations/lean-operational-interface.yaml
    classification: SUBSTANTIVELY_RECONSTRUCTED
    remaining: maintain completion states and preserved mappings through later revisions

  - path: tests/test_problem_bundles.py
    classification: SUBSTANTIVELY_RECONSTRUCTED
    present_function:
      - validates all seven complete bundle declarations and read-only loads
      - validates controlled six-neighbor relation coverage for each problem
      - validates reciprocal brother-problem designation and non-absorption
      - validates Theologico-Political predecessor and Wise-vs-Vulgar migration-source preservation
    remaining:
