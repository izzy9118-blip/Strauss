classification_vocabulary:
  SUBSTANTIVELY_RECONSTRUCTED:
    meaning: >
      The object contains a developed governing question, evidence requirements,
      operations, limits, valid outputs, failure conditions, termination rule, and
      behavioral contract. This classification does not constitute doctrinal certification.
  PARTIALLY_RECONSTRUCTED:
    meaning: >
      A substantial contract or implementation exists, but important operations,
      evidence domains, behavioral execution, or source-specific applications remain incomplete.
  MAPPED_TO_RICHER_RECORDS:
    meaning: >
      The object is principally a compact interface to richer governing records and
      must not be mistaken for a self-sufficient reconstruction.
  STRUCTURAL_PLACEHOLDER:
    meaning: >
      The object supplies headings, brief rules, or loadable structure but is not yet
      sufficient to govern reliable inquiry or expression by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: >
      The promised operation has no material implementation or usable governing record.

summary:
  structural_validation: REQUIRED_FOR_CURRENT_REVISION
  semantic_completion: INCOMPLETE
  doctrinal_certification: NOT_CERTIFIED
  runtime_readiness: LIMITED
