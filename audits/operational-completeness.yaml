non_effects:
  - This audit does not certify any doctrine, claimant, successor problem, or migration.
  - This audit does not alter active predecessors or accepted migration sources.
  - Bundle loading does not complete source-specific application or witness reconstruction.
  - Bundle loading does not authorize successor activation.
  - An incomplete classification is a production finding, not a reason to delete the record.
  - Later completion must proceed through forward revision with preserved provenance.
