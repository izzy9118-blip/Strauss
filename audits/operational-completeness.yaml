classification_vocabulary:
  SUBSTANTIVELY_RECONSTRUCTED:
    meaning: >
      A developed governing contract, registry, or source-status record exists with explicit
      identity, provenance, limits, valid operations, termination, and behavioral validation.
      This does not constitute doctrinal certification.
  PARTIALLY_RECONSTRUCTED:
    meaning: >
      A substantial contract or implementation exists, but important execution, evidence
      domains, source-specific applications, or authoritative composition remain incomplete.
  MAPPED_TO_RICHER_RECORDS:
    meaning: The object is principally an index or compact interface to richer records.
  STRUCTURAL_PLACEHOLDER:
    meaning: The object is loadable but insufficient to govern reliable inquiry by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: No material implementation exists.

