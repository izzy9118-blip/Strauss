classification_vocabulary:
  SUBSTANTIVELY_RECONSTRUCTED:
    meaning: >
      The object contains a governing question, typed inputs and outputs, evidence
      requirements, application sequence, limits, failure recovery, termination, and
      behavioral contract. This does not constitute doctrinal certification.
  PARTIALLY_RECONSTRUCTED:
    meaning: >
      A substantial contract or implementation exists, but important execution,
      evidence domains, or source-specific applications remain incomplete.
  MAPPED_TO_RICHER_RECORDS:
    meaning: >
      The object is principally an index or compact interface to richer records.
  STRUCTURAL_PLACEHOLDER:
    meaning: >
      The object is loadable but insufficient to govern reliable inquiry by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: No material implementation exists.

summary:
  structural_validation: REQUIRED_FOR_CURRENT_REVISION
  semantic_completion: INCOMPLETE
  doctrinal_certification: NOT_CERTIFIED
  runtime_readiness: LIMITED
  completed_operational_units:
    - speech mechanism contract
    - speech request validation and candidate report structure
    - six hermeneutic contracts
    - four inquiry method contracts
  remaining_major_deficiencies:
    - problem-specific operational profiles and source relations remain uneven
    - corpus index is not an exhaustive typed corpus registry
    - findings index is not an exhaustive typed findings registry
    - source-specific applications of method and hermeneutics remain incomplete
    - independent witness reconstruction remains materially incomplete
    - doctrinal and migration certification remain separate and incomplete
  central_finding: >
    The repository now has substantive speech, hermeneutic, and method contracts. It is
    still not a completed Strauss reasoner because the contracts have not been applied
    exhaustively to the problem objects, corpus, findings, and independent witnesses.

records:
  - path: manifest.yaml
    classification: PARTIALLY_RECONSTRUCTED
    present_function:
      - canonical load order and seven-problem registration
      - honest structural, semantic, runtime, and certification states
      - speech, hermeneutic, and method contract registration
      - audit and Sanctum repinning rules
    remaining:
      - completion states must advance with problem, corpus, findings, and source application work
      - manifest does not itself perform reasoning

  - path: adapter.py
    classification: PARTIALLY_RECONSTRUCTED
    present_function:
      - path-safe YAML loading and manifest validation
      - speech-contract and typed request validation
      - candidate ministerial-report construction
      - evidence, irony, comedy, concealment, uncertainty, and pinning controls
      - loading of method and hermeneutic contracts
    remaining:
      - no automatic execution of method contracts over source records
      - no exhaustive corpus or findings resolution
      - no authoritative natural-language ministerial judgment

  - path: speech/speech-mechanism.yaml
    classification: PARTIALLY_RECONSTRUCTED
    contract_version: STRAUSS-SPEECH-CONTRACT-1
    present_function:
      - typed input and output contracts
      - reasoning-to-expression pipeline
      - evidence, audience, speech-and-deed, concealment, irony, comedy, and uncertainty controls
      - failure, termination, and Sanctum interoperability
    remaining:
      - source-grounded reasoning and final composition are not automatic
      - real report applications remain to be tested

  - path: hermeneutics/
    classification: SUBSTANTIVELY_RECONSTRUCTED
    contracts:
