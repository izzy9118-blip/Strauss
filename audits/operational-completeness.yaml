non_effects:
  - This audit does not certify any doctrine, claimant, source, finding, successor problem, or migration.
  - This audit does not admit or distribute source texts.
  - This audit does not alter active predecessors or accepted migration sources.
  - Current-state exhaustive indexing does not close or complete the corpus or findings store.
  - Registry inclusion does not promote a provisional study, synthesis, or proposition.
  - Multiple records derived from one source do not constitute independent corroboration.
  - Registry loading does not authorize successor activation.
  - Later completion must proceed through forward revision with preserved provenance.
