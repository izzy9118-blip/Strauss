      - comparison gate, burden, evidence asymmetry, and incommensurability controls
      - victor withheld when reciprocal burdens remain
    remaining: source-specific applications and certification

  - path: method/textual-order.yaml
    classification: SUBSTANTIVELY_RECONSTRUCTED
    contract_version: STRAUSS-METHOD-TO-1
    present_function:
      - typed ordered units, transitions, formulation statuses, correction links, and endings
