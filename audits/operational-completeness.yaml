    meaning: 'A substantial implementation exists, but important evidence domains, source-specific applications, independent
      witnesses, or authoritative composition remain incomplete.

      '
  MAPPED_TO_RICHER_RECORDS:
    meaning: The object principally indexes or references richer repository records.
  STRUCTURAL_PLACEHOLDER:
    meaning: The object is loadable but insufficient to govern reliable inquiry by itself.
  EMPTY_OR_UNIMPLEMENTED:
    meaning: No material implementation exists.
