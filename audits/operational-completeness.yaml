revision_history:
  predecessor_version: 1.2.0
  predecessor_blob_sha: fc6e3557ba366d175d8152409fdcb0608dfa441e
  reason: >
    Record the validated read-only loading of complete foundational-problem bundles:
    constitution, inquiry profile, witness registry, relations, and synthesis records.
    Preserve source-specific application, incomplete witness reconstruction, migration
    certification, doctrine, activation, corpus exhaustiveness, and findings exhaustiveness.

basis:
  repository: izzy9118-blip/Strauss
  prior_validated_interface_commit: a50d9924722a4eeb99e5cd249444f3319dc4117e
  current_revision_scope: production/load-complete-problem-bundles
  manifest: manifest.yaml
  problem_bundle_loader: problem_bundles.py
  mapping_record: migrations/lean-operational-interface.yaml
  governing_rule: >
    Structural validity, complete path registration, bundle loading, and passing tests do
