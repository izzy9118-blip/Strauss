  - witness_id: TP-IND-007
    name: Alexandre Kojeve
    role: Historicist claimant concerning tyranny, universal state, historical completion, and truth.
    independence_rule: Reconstruct the historicist alternative in its strongest form.
    study_status: PENDING

secondary_and_editorial_context:
  - witness_id: TP-CXT-001
    name: Thomas L. Pangle
    source_relation: Introduction to Studies in Platonic Political Philosophy
    source_class: SECONDARY_EDITORIAL_AND_INTERPRETIVE_CONTEXT
    permitted_role: >
      Provisional orientation and bibliographic guidance concerning the
      theological-political problem, Socrates, poetry, and Platonic philosophy.
    prohibited_role: >
      Substituting for Strauss's primary texts or deciding the truth of revelation,
      philosophy, or the nineteen-source predecessor synthesis.

witness_relation_rules:
  independent_reconstruction_rule: >
    Biblical texts, Plato, Maimonides, Spinoza, Hobbes, Cohen, Freud, Kojeve, and
    each Strauss source must be reconstructed on their own terms before final
    comparison or corpus synthesis.
  non_confirmation_rule: >
    No independent witness may be forced to confirm the active predecessor or the
    Socrates and Aristophanes brother-problem synthesis. Dissent, correction,
    incompatibility, and source-specific limitation must remain visible.
  no_majority_rule: >
    Agreement among witnesses does not mechanically establish truth; source status,
    argument, occasion, textual deed, and evidence remain controlling.
  no_self_interpreting_history_rule: >
    Historical events and political outcomes require interpretation and cannot
    choose among philosophic, theological, psychological, political, or historicist accounts by themselves.
  brother_problem_rule: >
    Evidence concerning poetic theology and human recognition of gods must
    cross-reference Philosophy vs. Poetry; evidence concerning genuine revelation,
    command, prophecy, sacred law, and ultimate authority remains here.

