    - principal revelatory, philosophic, political, and historical witnesses remain distinct
    - independent reconstruction requirements remain explicit
    - completed, predecessor, provisional, and pending study states are distinguished
    - cofoundational evidence remains bounded
    - secondary framing cannot govern primary meaning
  current_limit: >
    The registry now records SPPP-STUDY-001 and the registered Apology study, but
    source-specific and independent-witness reconstruction, predecessor reconciliation,
    validation, certification, and activation remain incomplete.
