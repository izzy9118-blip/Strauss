  - witness_id: TP-IND-001
    name: Plato
    role: Classical witness to philosophy, gods, law, piety, poetry, and the city.
    independence_rule: Reconstruct Plato independently before Straussian synthesis.
    study_status: PENDING
  - witness_id: TP-IND-002
    name: Maimonides
    role: Medieval witness to philosophy, prophecy, divine law, jurisprudence, and guarded writing.
    independence_rule: Reconstruct Maimonides from relevant primary works before using Strauss's interpretation as final.
    study_status: PENDING
  - witness_id: TP-IND-003
    name: Spinoza
    role: Modern critic and reorganizer of Scripture, prophecy, interpretation, sovereignty, and freedom to philosophize.
    independence_rule: Reconstruct the Theologico-Political Treatise independently before final comparison.
    study_status: PENDING
  - witness_id: TP-IND-004
    name: Hobbes
    role: Witness to sovereign neutralization, public doctrine, peace, and political jurisdiction.
    independence_rule: Reconstruct Hobbes independently before accepting the settlement's rank or neutrality.
    study_status: PENDING
  - witness_id: TP-IND-005
    name: Hermann Cohen
    role: Major rational reconciliation of Judaism, morality, revelation, and progress.
    independence_rule: Reconstruct Cohen's own argument before Straussian critique governs.
    study_status: PENDING
  - witness_id: TP-IND-006
    name: Sigmund Freud
    role: Psychological and historical explanatory claimant concerning Moses, monotheism, memory, and identity.
    independence_rule: Distinguish explanatory achievement from claimed refutation.
