witness_relation_rules:
  independent_reconstruction_rule: >
    Biblical texts, Plato, Maimonides, Spinoza, Hobbes, Cohen, Freud, Kojeve, and
    each Strauss source must be reconstructed on their own terms before final synthesis.
  non_confirmation_rule: >
    No witness may be forced to confirm the active predecessor, PVP-STUDY-001, or
    SPPP-STUDY-001. Dissent, correction, incompatibility, and source limits remain visible.
  no_majority_rule: >
    Agreement does not mechanically establish truth; source status, argument,
    occasion, textual deed, and evidence remain controlling.
  no_self_interpreting_history_rule: >
    Historical and political outcomes cannot choose among philosophic, theological,
    psychological, political, or historicist accounts by themselves.
  brother_problem_rule: >
    Poetic theology and human recognition of gods cross-reference Philosophy vs.
    Poetry; genuine revelation, command, prophecy, sacred law, and ultimate authority
    remain under The Theologico-Political Problem.

