  exact_historical_copy: history/foundational-problems/theologico-political/STR-PROBLEM-002-v1.1-active-predecessor.yaml
  rule: >
    This revised subordinate successor registry does not revise or replace the active
    predecessor, convert provisional studies into certified evidence, merge
    independent witnesses, or authorize activation.
