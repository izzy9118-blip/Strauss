source_local_findings:
  - {classification: documented_finding, proposition: "Strauss states that his study of Hobbes began within an investigation of Spinoza's Theologico-Political Treatise and the origins of biblical criticism."}
  - {classification: documented_finding, proposition: "The revival of theology led Strauss to investigate whether the critique of orthodox Jewish and Christian theology deserved its apparent victory."}
  - {classification: documented_finding, proposition: "Strauss explicitly says that since then the theologico-political problem has remained the theme of his investigations."}
  - {classification: documented_finding, proposition: "Strauss says that the contrast between Hobbes and Spinoza seemed more important and illuminating to him than their agreement in the political dimension."}
  - {classification: documented_finding, proposition: "The preface links philosophic interest in theology to Strauss's turn toward true politics."}
  - {classification: unresolved_uncertainty, proposition: "The reviewed 1997 body omits the final three paragraphs of the 1965 preface, so the predecessor's sovereign-peace formulation cannot be independently retested from this witness alone."}
