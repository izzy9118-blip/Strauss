safeguards:
  - no poetic theology treated as revelation
  - no political utility treated as truth
  - no natural explanation treated as automatic refutation of divine causation
  - no philosophy nonrefutation treated as proof of revelation
  - no historical suffering, survival, or statehood treated as proof of providence
  - no Cohenian vocabulary treated as preservation of traditional doctrine without comparing the deed named
  - no Maimonidean legal presumption relabeled philosophical certainty
  - no Machiavellian genealogy treated as complete metaphysical refutation

