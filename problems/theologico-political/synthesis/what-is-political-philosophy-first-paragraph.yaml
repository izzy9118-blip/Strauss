source_local_findings:
  - {classification: documented_finding, proposition: "Political philosophy is introduced in Jerusalem under the prophetic longing for the city of righteousness, justice, and the just city."}
  - {classification: documented_finding, proposition: "Strauss explicitly places his own discourse below the prophets' vision and says even the best human reproduction of that vision would be faint or weak."}
  - {classification: documented_finding, proposition: "The coming inquiry must move toward regions where recollection of the prophetic vision fades, where the Kingdom of God is derided as an imagined principality, and even where the vision never illuminated."}
  - {classification: documented_finding, proposition: "Distance or silence concerning sacred heritage is joined to an explicit promise never to forget what Jerusalem stands for."}
  - {classification: bounded_conclusion, proposition: "The registered paragraph supports a prophetic-Jerusalem versus philosophic-distance structure but does not itself define the philosophic best regime; that part of the predecessor formulation remains unconfirmed within this bounded scope."}
