problem: {canonical_key: theologico-political, role: PRIMARY_JURISDICTION, adjacent_problem_references: [athens-vs-jerusalem]}
source_local_findings:
  - {classification: documented_finding, proposition: "Husik is reconstructed as moving from theological authority to philosophy when inherited belief and practice cease to command complete obedience, and as thereafter pursuing objective truth through free inquiry rather than authority."}
  - {classification: documented_finding, proposition: "Husik defines philosophy as universal free inquiry and Judaism as positive historical faith centered on divine Law, making Jewish philosophy intrinsically problematic on his own definitions."}
  - {classification: documented_finding, proposition: "Medieval Jewish philosophy is treated as an unsuccessful justificatory synthesis yet as possessing enduring value because it vindicated the authority of reason in the presence of Revelation."}
  - {classification: documented_finding, proposition: "The preface argues that radical historicism cannot establish once and for all that orthodoxy has been destroyed if modern historical science is itself historically conditioned and revisable."}
  - {classification: documented_finding, proposition: "Husik's demand for a modern philosophy of Judaism persists despite his thesis that modern Jewish philosophy is impossible, preserving the reason-revelation problem rather than dissolving it historically."}
  - {classification: bounded_conclusion, proposition: "The preface ends with the same unresolved boundary at the moral level, where Husik's concern for justice may be philosophic conviction or may function as an article of faith; the source does not certify either reading as final doctrine."}
