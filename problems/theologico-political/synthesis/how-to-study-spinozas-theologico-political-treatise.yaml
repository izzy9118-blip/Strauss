source_local_findings:
  - classification: documented_finding
    proposition: Interpretation must precede explanation, and explicit meaning must precede reconstruction of what an author knew but did not state explicitly.
  - classification: documented_finding
    proposition: Spinoza's Treatise must be interpreted through an author-supplied framework before external historical information is used to supplement it.
  - classification: documented_finding
    proposition: The Treatise distinguishes a public practical argument from deeper reasoning addressed to potential philosophers while remaining accessible to vulgar readers.
  - classification: documented_finding
    proposition: Contradictions concerning revelation, theology, Christianity, and biblical intelligibility require interpretation in light of audience, accommodation, and the work's order.
  - classification: documented_finding
    proposition: The return to the literal Bible serves both a corrective appeal against traditional theology and a philosophic attack on biblical authority; detached historical study is subsequent to those purposes.
  - classification: documented_finding
    proposition: The practical proposals and obvious reasoning must be understood completely before concealed reasoning is reconstructed.

