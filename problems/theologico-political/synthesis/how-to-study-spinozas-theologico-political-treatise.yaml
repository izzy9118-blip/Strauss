  confirms:
    - interpretation precedes historical or psychological explanation
    - Scripture, prophecy, freedom of philosophizing, and differentiated audiences are explicit components of the essay
    - the public and deeper layers of the Treatise are ordered rather than interchangeable
  qualifies:
