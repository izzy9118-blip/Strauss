strict_problem_contribution:
  role: PRIMARY
  governing_claim: The Treatise’s conflict between philosophy and revelation must be reconstructed through exact interpretation
    of its practical intervention, differentiated audience, theological accommodations, contradictions, omissions,
    and defense of freedom to philosophize under sovereign authority.
  documented_findings:
  - Interpretation precedes explanation and the practical proposal precedes hidden teaching.
  - The Treatise addresses potential philosophers obstructed by the subordination of reason to theology.
  - Jewish subject matter serves an intervention directed toward Christian readers.
  - Freedom to philosophize and sovereign authority belong to the work’s practical action.
  - Contradictions concerning revelation, theology, Christ, and Christianity require controlled interpretation.
  bounded_conclusion: The reviewed source supplies a complete provisional contribution for this jurisdiction but does
    not certify doctrine or replace any predecessor.
