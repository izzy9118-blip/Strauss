    non_absorption: Election and sacred history are not poetic constructions merely because historians study them as beliefs.

source_and_evidence_limits:
  - TALMON-STUDY-001 reconstructs Strauss's one-page review, not Talmon's book.
  - The reviewed witness is the 1983 collected reprint, not the separately compared 1957 journal printing.
  - Pangle's Introduction is secondary and cannot govern the review.
  - Agreement among records derived from this witness is not independent corroboration.

prohibitions:
  - no historical efficacy treated as theological proof
  - no historical nonaffirmation treated as theological refutation
  - no predecessor progress claim promoted without item evidence
  - no Jewish particularity reduced to ethnic pride or generic identity
  - no source-specific synthesis treated as doctrinal certification
  - no predecessor displacement or successor activation

