migration_safeguards:
  migration_status:
    lifecycle: PLANNING
    certification: NOT_CERTIFIED
    activation: NOT_ACTIVE
  predecessor_effect: NONE
  rule: >
    This registry is a subordinate successor record. It does not certify or activate
    Nomos vs. Physis, convert pending studies into completed evidence, merge witness
    traditions, or authorize deletion or retrospective revision.
  prohibitions:
    - no silent deletion of a witness or accepted source
    - no merger of natural right and natural law by vocabulary alone
    - no identification of divine and natural law without argument
    - no causal explanation treated as normative refutation
    - no positive law treated as self-justifying
    - no collection-level synthesis replacing independent reconstruction
    - no certification from registry structure alone

termination:
  registry_state: FOUNDING_WITNESS_REGISTRY_CREATED
  certification: NOT_CERTIFIED
  completion_conditions:
    - principal witness lines are distinct and source-bounded
    - completed and pending studies are distinguished
    - source and editorial limits are explicit
    - natural, human positive, and divine-law witness lines remain separate
    - independent reconstruction requirements remain enforceable
  current_limit: >
    Structural witness registration is complete for founding production. Substantive
    source reconstruction remains pending and may revise local roles through explicit
    successor versions.
