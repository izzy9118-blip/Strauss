    - inference-discipline
    - uncertainty-preservation
    - speech-and-deed

anti_capture_principle: >
  No law, tradition, historical outcome, or asserted natural standard may certify
  itself through title, age, success, or necessity.

non_absorption_clause: >
  This problem owns the nature-convention distinction and must not absorb the full
  doctrines of revelation, poetry, prudence, rank, or modernity.

termination:
