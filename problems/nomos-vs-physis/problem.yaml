governing_question: >
  Is there a standard of right independent of enacted law, inherited custom,
  political power, historical circumstance, or revealed command; and how can such
  a standard be known and applied without turning prudence into relativism?

compressed_question: >
  What is right by nature, and how does it govern imperfect laws?

jurisdiction:
  owns:
    - nature and convention
    - natural right and natural law
    - the difference between the lawful and the just
    - descriptive natural fact and normative natural standard
    - distinctions among natural, human positive, and divine positive law
    - universal standards and prudential application as a boundary question
  does_not_own:
    - canonical_key: philosophy-vs-poetry
      reason: >
        Philosophy vs. Poetry owns rival human forms of wisdom, representation,
        education, and knowledge of souls.
    - canonical_key: theory-vs-practice
      reason: >
        Theory vs. Practice owns implementation, execution, institutions, equity,
        exception, and responsible action under imperfect conditions.
    - canonical_key: theologico-political
      reason: >
        The Theologico-Political Problem owns ultimate authority among autonomous
        reason, genuine revelation, prophecy, divine command, sacred law, and sovereignty.
    - canonical_key: athens-vs-jerusalem
      reason: >
        Athens vs. Jerusalem owns autonomous understanding and obedient love as
        comprehensive rival orientations toward the highest human life.
    - canonical_key: wise-vs-vulgar
      reason: >
        The Wise vs. The Vulgar owns rank, recognition, differentiated education,
        mediation, and capture by counterfeit claimants.
    - canonical_key: ancients-vs-moderns
      reason: >
        Ancients vs. Moderns owns the historical and philosophical transformation of
        nature, natural right, rights, progress, mastery, history, and value creation.

permanent_tension: >
  Political society requires law before the justice of law is demonstrated, yet
  enacted law, inherited custom, power, recurrence, historical success, or asserted
  divine title cannot establish their own justice. A natural standard must be
  distinguished from the facts, authorities, and interpretations through which it is
  claimed, while its application requires prudence that cannot certify itself.

boundary:
  activates_when:
    - law or custom is treated as self-justifying
    - natural right is invoked against enacted law
    - power, necessity, recurrence, or history is treated as a title to justice
    - natural, human positive, and divine law are conflated
    - equality, hierarchy, preservation, excellence, or freedom is claimed to be natural
    - universal standards and prudential application appear in tension
    - modern rights, historicism, value creation, or mastery transforms the meaning of nature
  does_not_activate_by_itself:
    - every legal dispute
    - every historical change
    - every theological claim
    - every practical disagreement
    - every use of natural vocabulary

