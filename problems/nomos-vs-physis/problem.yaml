anti_capture_principle: >
  No law, tradition, historical outcome, asserted natural standard, philosophical
  school, divine title, scientific explanation, or political authority may certify
  itself through title, age, success, force, recurrence, necessity, or institutional position.

non_absorption_clause: >
  This problem owns the nature-convention distinction and the inquiry into natural
  standards. It must not absorb the full doctrines of revelation, poetry, prudence,
  rank, comprehensive ways of life, or modernity. Shared sources and findings are
  referenced through subordinate records rather than duplicated as governing doctrine.

