governing_question: >
  Is there a standard of right independent of enacted law, inherited custom,
  political power, historical circumstance, or revealed command; and how can such
  a standard be known and applied without turning prudence into relativism?

compressed_question: >
  What is right by nature, and how does it govern imperfect laws?

jurisdiction:
  owns:
    - nature and convention
    - natural right and natural law
    - the difference between the lawful and the just
    - universal standards and prudential application
  does_not_own:
    - philosophy-vs-poetry
    - theory-vs-practice
    - theologico-political
    - athens-vs-jerusalem
    - wise-vs-vulgar
    - ancients-vs-moderns

permanent_tension: >
  Political society requires law before the justice of law is demonstrated, yet
  enacted law, inherited custom, power, recurrence, or historical success cannot
  establish their own justice.

boundary:
  activates_when:
    - law or custom is treated as self-justifying
    - natural right is invoked against enacted law
    - power or history is treated as a title to justice
    - natural, human, and divine law are conflated
  does_not_activate_by_itself:
    - every legal dispute
    - every historical change
    - every theological claim

relations:
  - related_problem: philosophy-vs-poetry
    relation_type: SUPPLIES_FINDING_TO
  - related_problem: theory-vs-practice
    relation_type: INTERSECTS
  - related_problem: theologico-political
    relation_type: INTERSECTS
  - related_problem: athens-vs-jerusalem
