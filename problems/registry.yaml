official_order_rule: >
  The order recorded here is authoritative for presentation, inquiry orientation,
  and repository navigation. It does not imply that every inquiry must activate the
  problems sequentially, that later problems are subordinate to earlier ones, or
  that their permanent tensions can be reduced to a single linear argument.

reference_rule: >
  Cross-problem references must use canonical_key. Repository paths may also be
  recorded for resolution, but paths do not constitute identity.

activation_rule: >
  A successor problem becomes active only after its predecessor is preserved,
  displaced material is classified, references validate, and the migration is
  certified. Classification, witness registration, and founding-structure completion
  do not authorize activation.
