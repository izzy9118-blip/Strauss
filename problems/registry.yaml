schema_version: 1.0
registry_type: foundational_problem_registry

identity:
  canonical_key: foundational-problem-registry
  title: Foundational Problem Registry
  version: 1.7.0

status:
  lifecycle: FOUNDING_DRAFT
  certification: NOT_CERTIFIED
  activation: PENDING_FOUNDATIONAL_MIGRATION

revision_history:
  predecessor_version: 1.6.0
  predecessor_blob_sha: 0fa856273aaf220068303800d80c399803f44704
  reason: >
    Register the expanded Wise vs. Vulgar witness registry and the completed
    independent Plato Apology source synthesis while preserving the incompleteness of
    the remaining witness corpus, migration certification, and activation.

authority:
  purpose: >
    Establish the canonical identities, official order, jurisdictional boundaries,
    repository locations, and migration status of the seven foundational problems.
  governed_by:
    path: governance/foundational-problem-architecture.yaml
    canonical_key: foundational-problem-architecture
  governing_rule: >
    The seven foundational problems remain distinct but connected. A problem may
    reference another problem's findings without reproducing its full doctrine or
    absorbing its jurisdiction. Interpretive rules of general application are
    maintained as shared protocols.

identity_rule:
  canonical_identity: canonical_key
  ordering_field: canonical_order
  title_field: title
  rule: >
    Canonical identity and canonical order are separate. Reordering, inserting,
    renaming, or relocating a problem does not alter its stable canonical key or
    retrospectively alter historical identifiers.
  legacy_identifier_rule: >
    Earlier identifiers remain historical aliases and provenance references. They
    do not determine current canonical order.

canonical_problems:
  - canonical_key: nomos-vs-physis
    canonical_order: 1
    title: Nomos vs. Physis
    successor_path: problems/nomos-vs-physis/problem.yaml
    subordinate_records:
      inquiry_profile: problems/nomos-vs-physis/inquiry-profile.yaml
      witnesses: problems/nomos-vs-physis/witnesses.yaml
      relations: problems/nomos-vs-physis/relations.yaml
      synthesis_directory: problems/nomos-vs-physis/synthesis/
      founding_source_bridge: problems/nomos-vs-physis/synthesis/studies-in-platonic-political-philosophy.yaml
    jurisdiction: >
      The distinction and conflict between what is by nature and what exists through
      law, convention, custom, inheritance, artifice, or authoritative opinion.
    migration_status: FOUNDING_STRUCTURE_COMPLETE_NOT_CERTIFIED

