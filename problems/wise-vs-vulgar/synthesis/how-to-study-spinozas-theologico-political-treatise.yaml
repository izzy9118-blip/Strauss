strict_problem_contribution:
  role: CONTROLLED_SECONDARY
  governing_claim: Spinoza differentiates actual philosophers, potential philosophers, and the vulgar; accommodation
    ad captum vulgi, contradiction, and omission become interpretable only after the explicit argument and audience
    are established.
  documented_findings:
  - The Treatise is not addressed to the vulgar or to actual philosophers simply.
  - Potential philosophers are impeded by the belief that reason must serve theology.
  - Spinoza knowingly speaks according to the capacity and opinions of the vulgar.
  - The more anti-vulgar position is generally the stronger candidate where opposed statements cannot both be serious.
  - The rule remains contextual and does not authorize mechanical reversal.
  bounded_conclusion: The reviewed source supplies a complete provisional contribution for this jurisdiction but does
    not certify doctrine or replace any predecessor.
