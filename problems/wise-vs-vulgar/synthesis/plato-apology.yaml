  problem: wise-vs-vulgar
  source_study: PLATO-APOLOGY-PVP-TP-001
  title: The Wise vs. The Vulgar — Plato's Apology
  version: 1.0.0

status:
  lifecycle: PROVISIONAL_SOURCE_SYNTHESIS
  certification: NOT_CERTIFIED
  activation: ACTIVE_SUBORDINATE_STUDY
