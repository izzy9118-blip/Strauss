strict_problem: >
  How can superior understanding guide political society when wisdom cannot certify
  itself and the city cannot reliably distinguish philosopher, sophist, prophet,
  ruler, scholar, poet, ideologue, or impostor?

principal_findings:
  - Dependence on authoritative opinion is the ordinary political condition, not proof of moral worthlessness.
  - Political decency can be genuine without philosophical knowledge.
  - The city possesses authority without knowledge sufficient to identify philosophy.
  - Eristic, prestige, technique, secrecy, and professional status can counterfeit wisdom.
  - Human beings differ in capacity, motive, character, and response to education.
  - Equal civic dignity does not imply identical educational capacity or vocation.
  - Theory does not automatically confer political legitimacy or competence.
  - Persecution, success, election, scholarship, office, obscurity, and hidden teaching do not certify wisdom.
  - Superior judgment may guide through counsel, education, institutional service, criticism, and restraint rather than unrestricted sovereignty.

unresolved_questions:
  - how wisdom may be provisionally recognized without self-certification
  - how differentiated education avoids domination and contempt
  - how superior judgment may guide without claiming unrestricted rule
  - how institutions can test claimants without presuming that office equals wisdom

jurisdiction_limits:
  - Poet and philosopher as substantive rival claimants remain under Philosophy vs. Poetry.
  - Prophet and divine authority remain under The Theologico-Political Problem.
  - General movement from knowledge to action remains under Theory vs. Practice.
  - Accepted predecessor material requires proposition-level redistribution before activation.

