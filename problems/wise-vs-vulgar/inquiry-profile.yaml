identity:
  problem: wise-vs-vulgar
  title: The Wise vs. The Vulgar — Inquiry Profile
  version: 0.1.0

status:
  lifecycle: FOUNDING_DRAFT
  certification: NOT_CERTIFIED
  activation: PENDING_FOUNDATIONAL_MIGRATION

authority:
  problem_reference: problems/wise-vs-vulgar/problem.yaml
  architecture_reference: governance/foundational-problem-architecture.yaml
  registry_reference: problems/registry.yaml
  migration_reference: migrations/foundational-problems-v2/migration.yaml
  predecessor_index_reference: migrations/foundational-problems-v2/predecessor-index.yaml
  protocol_registry_reference: protocols/registry.yaml
  governing_rule: >
    This profile governs the recognition, testing, education, mediation, and political
    responsibility of claimants to superior understanding. It invokes shared protocols
    by reference, preserves accepted predecessor material for proposition-level
    redistribution, and prohibits any claimant or repository object from certifying itself.

purpose: >
  Determine how political society may distinguish genuine from counterfeit claimants
  to wisdom when human beings differ in capacity, motive, character, and education,
  while titles, offices, success, suffering, secrecy, scholarship, election,
  expertise, obscurity, and influence remain unreliable certificates of rank.

