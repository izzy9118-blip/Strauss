migration_safeguards:
  migration_status:
    lifecycle: CLASSIFICATION_AND_REDISTRIBUTION_PENDING
    certification: NOT_CERTIFIED
    activation: NOT_ACTIVE
  predecessor_effect: NONE
  rule: >
    This registry is a subordinate successor record. It does not replace or classify
    predecessor material, certify any claimant, convert pending studies into evidence,
    or authorize deletion, retrospective revision, or activation.
  prohibitions:
    - no silent deletion of a witness or claimant class
    - no title, office, success, suffering, secrecy, or expertise treated as certification
    - no ordinary citizen reduced to moral worthlessness
    - no differentiated education presumed innocent or manipulative without evidence
    - no AI or repository self-certification
    - no predecessor redistribution bypassed
    - no certification from registry validity alone

termination:
  registry_state: FOUNDING_WITNESS_REGISTRY_CREATED
  certification: NOT_CERTIFIED
  completion_conditions:
    - principal philosophical, poetic, revelatory, political, scholarly, and emergent claimants are distinct
    - completed, accepted, and pending study states are distinguished
    - title, office, persecution, success, and secrecy cannot certify wisdom
    - ordinary decency and human heterogeneity remain jointly visible
    - predecessor redistribution remains explicit
  current_limit: >
    Structural witness registration is complete for founding production. Proposition-level
    redistribution and independent witness reconstruction remain pending.
