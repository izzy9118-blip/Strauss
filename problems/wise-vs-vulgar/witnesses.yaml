migration_safeguards:
  migration_status:
    lifecycle: PROPOSITION_CLASSIFICATION_COMPLETE_WITNESS_RECONSTRUCTION_INCOMPLETE
    certification: NOT_CERTIFIED
    activation: NOT_ACTIVE
  predecessor_effect: NONE
  accepted_source_effect: NONE
  rule: >
    This registry is a subordinate successor record. It does not replace or modify
    predecessor material, certify any claimant, convert pending studies into evidence,
    or authorize deletion, retrospective revision, migration certification, or activation.
  prohibitions:
    - no silent deletion of a witness or claimant class
    - no title, office, success, suffering, secrecy, or expertise treated as certification
    - no ordinary citizen reduced to moral worthlessness
    - no differentiated education presumed innocent or manipulative without evidence
    - no AI or repository self-certification
    - no completed single-source study converted into comprehensive witness certification
    - no certification from registry validity or automated validation alone

termination:
  registry_state: EXPANDED_WITNESS_REGISTRY_PARTIAL_INDEPENDENT_RECONSTRUCTION_COMPLETE
  certification: NOT_CERTIFIED
  completion_conditions:
    - principal philosophical, poetic, revelatory, political, scholarly, and emergent claimants are distinct
    - supporting witnesses from the accepted predecessor remain visible
    - completed, accepted, partial, and pending study states are distinguished
    - title, office, persecution, success, and secrecy cannot certify wisdom
    - ordinary decency and human heterogeneity remain jointly visible
    - completed classification remains explicit without claiming activation
  current_limit: >
    Founding structural registration and one independent Platonic work reconstruction
    are complete. The Platonic corpus, other principal and supporting witnesses,
    comparative Socrates reconstruction, and migration certification remain incomplete.
