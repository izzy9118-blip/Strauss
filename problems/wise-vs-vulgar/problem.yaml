governing_question: >
  How can superior understanding guide political society when wisdom cannot certify
  itself and the city cannot reliably distinguish philosopher, sophist, prophet,
  ruler, scholar, poet, ideologue, expert, or impostor?

compressed_question: >
  How can the wise be recognized without allowing false elites to certify themselves?

jurisdiction:
  owns:
    - rank and recognition
    - genuine and counterfeit claimants to wisdom
    - human heterogeneity
    - ordinary and political virtue
    - differentiated education and partial enlightenment
    - audience and mediation where recognition is central
    - elite self-certification and capture
    - the limits of identifying wisdom
  does_not_own:
    - nomos-vs-physis
    - philosophy-vs-poetry
    - theory-vs-practice
    - theologico-political
    - athens-vs-jerusalem
    - ancients-vs-moderns

permanent_tension: >
  Political society requires judgment beyond ordinary opinion, but no title, office,
  profession, success, suffering, secrecy, scholarship, election, or self-description
  can certify the possessor of wisdom.

boundary:
  activates_when:
    - a person or class claims superior knowledge or authority
    - the city must distinguish philosophy from sophistry or expertise from imposture
    - education is differentiated by capacity or audience
    - secrecy, persecution, office, success, or prestige is treated as proof of wisdom
    - superior judgment seeks political guidance or institutional mediation
  does_not_activate_by_itself:
    - every social inequality
    - every expert judgment
    - every disagreement between minority and majority

relations:
  - related_problem: philosophy-vs-poetry
    relation_type: DEPENDS_ON
  - related_problem: theory-vs-practice
    relation_type: INTERSECTS
  - related_problem: theologico-political
    relation_type: INTERSECTS
  - related_problem: athens-vs-jerusalem
    relation_type: INTERSECTS
  - related_problem: ancients-vs-moderns
    relation_type: INTERSECTS

shared_protocols:
  required:
    - source-status
    - evidence-classification
    - inference-discipline
    - uncertainty-preservation
    - speech-and-deed
    - claimant-to-wisdom
    - audience-and-rhetoric

anti_capture_principle: >
  No claimant may certify wisdom through title, office, success, suffering, secrecy,
  scholarship, election, obscurity, influence, or possession of the repository itself.

non_absorption_clause: >
  This problem owns rank, recognition, heterogeneity, and differentiated education.
  It must not absorb the full doctrines of poetry, revelation, practical judgment,
  Athens and Jerusalem, or modernity.

