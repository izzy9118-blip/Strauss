anti_capture_principle: >
  No claimant, class, profession, institution, state, repository, protocol, or
  artificial intelligence system may certify wisdom through title, office, success,
  suffering, secrecy, scholarship, election, obscurity, influence, credentials,
  possession of evidence, or control of interpretation.

non_absorption_clause: >
  This problem owns rank, recognition, heterogeneity, differentiated education,
  mediation, and capture. It must not absorb the full doctrines of nature, poetry,
  practical judgment, revelation, comprehensive ways of life, or modernity. Shared
  sources and findings are referenced through subordinate records.

