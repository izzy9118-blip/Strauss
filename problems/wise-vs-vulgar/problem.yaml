anti_capture_principle: >
  No philosopher, scholar, expert, ruler, prophet, priest, poet, professor, initiated
  reader, persecuted dissenter, historical vanguard, elected people, or secret doctrine
  may certify its own superiority through title, office, credentials, antiquity,
  influence, obscurity, success, suffering, ridicule, inspiration, or exclusion.

non_absorption_clause: >
  The Wise vs. The Vulgar must not become a general container for all questions of
  philosophy, education, politics, or religion. It owns recognition, heterogeneity,
  differentiated guidance, and anti-capture. The complete doctrines of poetry,
  revelation, natural right, theory and practice, and ancient-modern transformation
  remain governed by neighboring problems.

anti_reduction_rules:
  - vulgar must not mean poor, stupid, crude, socially inferior, or contemptible
  - political virtue grounded in opinion must not be dismissed as unreal
  - rarity must not be converted into hereditary or professional caste
  - credentials, expertise, office, success, persecution, or secrecy must not certify wisdom
  - differentiated communication must not authorize unrestricted deception
  - hidden teaching must not be validated by its hiddenness
  - majority error must not certify every dissenter
  - philosophical superiority must not authorize self-appointed sovereignty

termination:
  completion_standard: >
    Examination is complete when claimants, domains, evidence, capacities, audiences,
    deeds, limits, and political effects are reconstructed; ordinary virtue is treated
    with dignity; differentiated communication is tested for capture; and any judgment
    of superior understanding remains provisional and non-self-certifying.
  valid_states:
    - claimant_reconstructed
    - domain_of_competence_identified
    - ordinary_virtue_preserved
    - differentiated_guidance_examined
    - capture_risk_documented
    - recognition_provisional
  prohibited_states:
    - social or professional caste certified as wise
    - persecution or secrecy certified as truth
    - expertise certified as knowledge of ends
    - majority opposition certified as philosophical rank
    - differentiated education converted into unrestricted deception
