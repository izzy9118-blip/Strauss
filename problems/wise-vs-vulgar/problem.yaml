governing_question: >
  How can superior understanding guide political society when wisdom cannot certify
  itself and the city cannot reliably distinguish philosopher, sophist, prophet,
  ruler, scholar, poet, ideologue, expert, or impostor?

compressed_question: >
  How can the wise be recognized without allowing false elites to certify themselves?

jurisdiction:
  owns:
    - rank and recognition
    - genuine and counterfeit claimants to wisdom
    - human heterogeneity
    - ordinary and political virtue
    - differentiated education and partial enlightenment
    - audience and mediation where recognition is central
    - elite self-certification and capture
    - provisional and domain-limited judgments of rank
    - political responsibility of superior claimants
    - repository and artificial-intelligence non-certification
  does_not_own:
    - canonical_key: nomos-vs-physis
      reason: >
        Nomos vs. Physis owns the content and epistemic burden of natural standards.
    - canonical_key: philosophy-vs-poetry
      reason: >
        Philosophy vs. Poetry owns the substantive rivalry among poetic and philosophic forms of wisdom.
    - canonical_key: theory-vs-practice
      reason: >
        Theory vs. Practice owns the movement from understanding to action, counsel,
        rule, execution, institutions, correction, and chance.
    - canonical_key: theologico-political
      reason: >
        The Theologico-Political Problem owns revelation, prophecy, divine command,
        sacred law, interpretation, and ultimate authority.
    - canonical_key: athens-vs-jerusalem
      reason: >
        Athens vs. Jerusalem owns the comprehensive philosophic and Biblical ways of life.
    - canonical_key: ancients-vs-moderns
      reason: >
        Ancients vs. Moderns owns the historical transformation of elites, expertise,
        ideology, science, bureaucracy, historicism, and technology.

permanent_tension: >
  Political society requires judgment beyond ordinary opinion, but no title, office,
  profession, success, suffering, secrecy, scholarship, election, obscurity,
  influence, institutional selection, repository access, or self-description can
  certify the possessor of wisdom. Final certification may be impossible while
  evidence still permits provisional, domain-limited, comparative, and revisable judgments.

boundary:
  activates_when:
    - a person, class, profession, institution, text, or movement claims superior knowledge or authority
    - the city must distinguish philosophy from sophistry, prophecy from fraud, or expertise from imposture
    - education is differentiated by capacity, audience, risk, or political necessity
    - secrecy, persecution, office, success, suffering, election, or prestige is treated as proof of wisdom
    - superior judgment seeks direct rule, counsel, institutional service, criticism, or guarded influence
    - ordinary opinion is treated as complete wisdom or moral worthlessness
    - an elite controls interpretation, credentials, admission, evidence, or correction
    - a repository or artificial intelligence system is treated as a certified wise authority
  does_not_activate_by_itself:
    - every social inequality
    - every expert judgment
    - every minority-majority disagreement
    - every educational accommodation
    - every secret or confidential communication
    - every criticism of an elite

