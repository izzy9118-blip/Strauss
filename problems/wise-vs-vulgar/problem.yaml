  additional_strauss_source:
    title: Studies in Platonic Political Philosophy
    study_record: studies/studies-in-platonic-political-philosophy/foundational-problems-reconstruction.yaml
    local_contribution: >
      Supplies the authoritative multitude, counterfeit philosophy, rarity without
      caste, Xenophontic practical superiority, Maimonidean legal presumption,
      Nietzschean philosopher-commanders, Machiavellian unequal belief, and Cohen's
      absolute individual beyond state and society.

origin: >
  Political society requires authoritative opinions, laws, habits, education, and
  trusted judgment. Philosophy arises within and questions this horizon, yet the city
  cannot reliably distinguish philosopher from sophist, scholar, expert, poet,
  prophet, ideologue, ruler, or impostor. Philosophy itself remains defective where
  it lacks self-knowledge concerning audiences, motives, effects, and political dependence.

governing_question: >
  How can superior understanding responsibly guide political society when wisdom
  cannot certify itself, the city cannot reliably recognize it, human beings differ
  in capacity and motive, and differentiated education can become elite manipulation or capture?

compressed_question: >
  How can wisdom guide the city when neither the city nor the claimant can certify who is wise?

jurisdiction:
  owns:
    - recognition of genuine and counterfeit claimants to wisdom
    - the few and the many as a problem of capacity, opinion, education, and authority
    - human heterogeneity and differentiated education
    - political or vulgar virtue and its dignity and limits
    - philosopher, sophist, scholar, expert, poet, prophet, ruler, and impostor as claimants
    - title, office, success, persecution, secrecy, inspiration, and reputation as noncertifying signs
    - direct and indirect guidance where recognition is central
    - elite self-certification, esoteric capture, ideological vanguardism, and technocracy
    - provisional, domain-limited judgments of superior understanding
  does_not_own:
    - canonical_key: nomos-vs-physis
      reason: The natural or conventional status of law and right belongs there.
    - canonical_key: philosophy-vs-poetry
      reason: The poetic accusation and rival human forms of wisdom belong there.
    - canonical_key: theory-vs-practice
      reason: General mediation from understanding to action and institutions belongs there.
    - canonical_key: theologico-political
      reason: Ultimate authority among reason, revelation, divine law, and sovereignty belongs there.
    - canonical_key: athens-vs-jerusalem
      reason: Comprehensive rival ways of life belong there.
    - canonical_key: ancients-vs-moderns
      reason: Historical transformation, progress, and modern projects belong there.

permanent_tension:
  political_society:
    strongest_claim: >
      The city cannot act through universal philosophical inquiry and therefore needs
      authoritative opinion, law, education, and trusted judgment.
    danger: >
      Majority authority, convention, office, and public reputation may misrecognize
      philosophy or empower sophistry and ideology.
  philosophy_and_superior_understanding:
    strongest_claim: >
      Inquiry into justice, nature, the good, and the whole may produce superior understanding.
    danger: >
      Philosophy may lack self-knowledge, overestimate its completeness, ignore
      human heterogeneity, or convert difficulty and reserve into self-certification.
  differentiated_guidance:
    strongest_claim: >
      Different capacities, motives, and circumstances may require different forms,
      sequences, and levels of instruction.
    danger: >
      Differentiation may become deception, caste, exclusion, manipulation, or an
      unfalsifiable claim that only the initiated understand.
  unresolved_relation: >
    Political society needs guidance but cannot certify wisdom. Philosophy needs
    political society but questions its opinions. Recognition must remain provisional,
    evidentiary, domain-limited, and open to correction.

boundary:
  activates_when:
    - a person or class claims superior wisdom, insight, expertise, revelation, or historical knowledge
    - political society must distinguish philosopher from sophist, prophet from false prophet, or expert from ruler
    - human heterogeneity and differentiated education are invoked
    - secrecy, initiation, obscurity, or persecution is treated as evidence of rank
    - ordinary political virtue is dismissed as stupidity or contemptible vulgarity
    - expertise concerning means is treated as architectonic wisdom
    - elite disbelief or private exemption from public teaching creates asymmetric authority
  does_not_activate_by_itself:
    - every difference in intelligence or education
    - every disagreement between majority and minority
    - every use of specialized expertise
    - every question of audience or rhetoric
    - every private or difficult teaching

