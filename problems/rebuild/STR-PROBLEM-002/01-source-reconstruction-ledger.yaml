ledger_id: STR-PROBLEM-002-SOURCE-LEDGER-001
problem_id: STR-PROBLEM-002
title: The Theologico-Political Problem — Independent Source Reconstruction Ledger
version: 1.0
status: ACTIVE — REBUILD STAGE 1
record_type: source_reconstruction_ledger

purpose: >
  Register and govern the nineteen independent source reconstructions required before
  Problem Two may be resynthesized. The ledger prevents the existing problem object,
  a later source, a secondary interpretation, or an anticipated synthesis from silently
  determining what an earlier source is permitted to say.

governing_question: >
  Can philosophy give a rational account of the whole and of the best human life
  sufficient to reject the authoritative claim of divine revelation and divine law;
  or must philosophy remain permanently answerable to a claim that it cannot
  rationally refute, politically neutralize, or historically supersede?

source_count: 19
completion_rule: >
  The ledger is complete only when all nineteen records have fixed witnesses,
  independent reconstructions, passage-bound evidence, uncertainty records, and
  source-specific termination findings. Cross-source synthesis is prohibited before
  those conditions are met.

method:
  - fix the exact witness, edition, scope, and documentary limitations
  - reconstruct the source independently before comparison
  - distinguish explicit statement, textual implication, supported inference, and hypothesis
  - preserve sequence, audience, occasion, title, preface, beginning, ending, and structural anomalies
  - examine guarded writing when warranted without treating persecution as proof of concealment
  - record the strongest alternative reading and the evidence most threatening to the current reading
  - return to Strauss only after cited authors and rival positions have been reconstructed independently
  - preserve nonresolution where the evidence does not establish a victor

shared_required_fields:
  - witness_identity
  - witness_fixity
  - textual_scope
  - occasion_and_audience
  - announced_subject
  - actual_argument_sequence
  - explicit_thesis
  - key_terms_and_distinctions
  - cited_author_reconstructions
  - evidence_passages
  - structural_and_hermeneutic_observations
  - strongest_supported_reading
  - strongest_alternative_reading
  - threatening_evidence
  - relation_to_problem_two
  - uncertainties_and_dissent
  - epistemic_classification
  - termination_status

