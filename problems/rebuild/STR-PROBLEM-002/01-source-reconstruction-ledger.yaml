cross_source_synthesis_gate:
  status: CLOSED_PENDING_NINETEEN_RECONSTRUCTIONS
  prohibited_until_open:
    - revision of problems/theologico-political.yaml
    - certification of a new Problem Two synthesis
    - declaration of victory for philosophy or revelation
    - declaration that Jerusalem and Athens are harmonized
    - theological interpretation of Jewish survival or the State of Israel
    - inference of a secret teaching from persecution alone
  opens_when:
    - all nineteen witness_status values are FIXED
    - all nineteen reconstruction_status values are COMPLETE
    - every substantive claim is passage-bound
    - uncertainty and strongest-alternative records are complete
    - source-specific termination findings are recorded

