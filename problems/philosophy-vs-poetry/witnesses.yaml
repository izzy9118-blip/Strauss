authority:
  problem_reference: problems/philosophy-vs-poetry/problem.yaml
  inquiry_profile_reference: problems/philosophy-vs-poetry/inquiry-profile.yaml
  architecture_reference: governance/foundational-problem-architecture.yaml
  migration_reference: migrations/foundational-problems-v2/migration.yaml
  source_status_protocol: protocols/source-status.yaml
  governing_rule: >
    This registry identifies witnesses and their problem-specific documentary
    roles. It does not contain complete witness interpretations, replace
    source-specific studies, merge independent witnesses, or certify the rank or
    truth of any claimant.

registry_purpose: >
  Preserve the independent standing, source condition, jurisdictional role,
  current study status, and interpretive limits of the principal witnesses through
  whom the ancient quarrel between philosophy and poetry is reconstructed.

source_status_rules:
  - rule_id: PVP-WSR-001
    rule: >
      Leo Strauss's Socrates and Aristophanes is an author-published primary
      Strauss source and the completed founding documentary basis for the present
      problem reconstruction.
  - rule_id: PVP-WSR-002
    rule: >
      Studies in Platonic Political Philosophy is a posthumous collection arranged
      and titled by Strauss. Its essays remain qualified primary Strauss sources
      subject to their original occasions, while the completed collection study
      remains provisional and non-certified.
  - rule_id: PVP-WSR-003
    rule: >
      Strauss did not complete the projected introduction or projected essay on
      Plato's Gorgias. Joseph Cropsey's Foreword is editorial provenance and Thomas
      L. Pangle's Introduction is secondary context; neither may supply missing
      authorial doctrine or govern Strauss's meaning.
  - rule_id: PVP-WSR-004
    rule: >
      Aristophanes, Plato, and Xenophon are independent witnesses. Strauss's
      interpretation does not eliminate the requirement to reconstruct each from
      its own surviving works and documentary conditions.
  - rule_id: PVP-WSR-005
    rule: >
      Plato and Xenophon must be reconstructed independently before comparison or
      synthesis. Apparent agreement may not be assumed and disagreement may not be
      silently harmonized.
  - rule_id: PVP-WSR-006
    rule: >
      Aristophanes must not be reduced to a spokesman for conventional Athens,
      civic piety, vulgar opinion, or anti-philosophic prejudice.
  - rule_id: PVP-WSR-007
    rule: >
      Socrates is a disputed subject represented through conflicting poetic,
      Platonic, Xenophontic, and later witnesses. No representation is automatic
      unmediated historical access.
  - rule_id: PVP-WSR-008
    rule: >
      A character, chorus, narrator, dramatic victor, reported speech, or action is
      evidence within a work but is not automatically the doctrine of the author.
  - rule_id: PVP-WSR-009
    rule: >
      Collection-level synthesis may orient later inquiry but may not force an
      independent primary-text reconstruction to confirm it.

witnesses:
  - witness_id: PVP-WIT-001
    name: Leo Strauss
    witness_class: MODERN_INTERPRETIVE_PRIMARY_WITNESS
    local_role: >
      Primary governing modern witness for reconstructing Philosophy vs. Poetry as
      a foundational problem and for locating the quarrel within mature Socratic
      political philosophy.
    documentary_standing:
      authority: PRIMARY_FOR_STRAUSS_INTERPRETATION
      limit: >
        Strauss governs claims about his own arguments and readings, not the final
        independent meaning of Aristophanes, Plato, Xenophon, Biblical revelation,
        or the historical Socrates.
    registered_sources:
      - title: Socrates and Aristophanes
        publication_condition: AUTHOR_PUBLISHED
        source_class: AUTHOR_PUBLISHED_PRIMARY_SOURCE
        local_function: >
          Founding sequential reconstruction of philosophy, comedy, the young
          Socrates, the Socratic response, and the gods within the quarrel.
        study_id: PVP-STUDY-001
        completed_study_record: >
          studies/socrates-and-aristophanes/
          philosophy-poetry-theologico-political-reconstruction.yaml
        synthesis_record: problems/philosophy-vs-poetry/synthesis/socrates-and-aristophanes.yaml
        study_status: SEQUENTIAL_READING_COMPLETE_NOT_CERTIFIED
      - title: Studies in Platonic Political Philosophy
        publication_condition: POSTHUMOUS_COLLECTION_ARRANGED_AND_TITLED_BY_STRAUSS
        source_class: QUALIFIED_PRIMARY_STRAUSS_COLLECTION
        local_function: >
          Collection-level evidence concerning Platonic drama, poetry, rhetoric,
          history, symbol, gods, divine authority, and the seven foundational problems.
        source_id: SPPP-SOURCE-001
        study_id: SPPP-STUDY-001
        source_status_record: studies/studies-in-platonic-political-philosophy/source-status.yaml
        completed_study_record: studies/studies-in-platonic-political-philosophy/sequential-reading.yaml
        synthesis_record: problems/philosophy-vs-poetry/synthesis/studies-in-platonic-political-philosophy.yaml
        study_status: COMPLETE_PROVISIONAL_NOT_CERTIFIED
        editorial_limit: >
          The missing intended introduction and Gorgias essay remain missing;
          Pangle's Introduction remains secondary and Cropsey's Foreword editorial.
      - title: The Rebirth of Classical Political Rationalism
        publication_condition: COLLECTION_REQUIRING_ITEM_LEVEL_SOURCE_STATUS
        source_class: QUALIFIED_STRAUSS_CORPUS_WITNESS
        local_function: >
          Relevant statements concerning poetry, rhetoric, comedy, eros, knowledge
          of souls, and the political correction of philosophy.
        study_status: SOURCE_SPECIFIC_RECONSTRUCTION_PENDING
    claimant_status: INTERPRETER_AND_PHILOSOPHIC_CLAIMANT_REQUIRING_TEST

  - witness_id: PVP-WIT-002
    name: Aristophanes
    witness_class: INDEPENDENT_POETIC_CLAIMANT
    local_role: >
      Independent comic poet, rival claimant to wisdom and education, and principal
      surviving poetic witness to the young Socrates and the poetic accusation.
    documentary_standing:
      authority: PRIMARY_POETIC_WITNESS_THROUGH_SURVIVING_COMEDIES
      limit: >
        Comic distortion, dramatic construction, character speech, chorus judgment,
        and dramatic victory do not automatically state Aristophanes' final doctrine.
    current_study_relation: >
      Strauss's sequential treatment is preserved in PVP-STUDY-001; direct
      independent comedy-by-comedy reconstruction remains required.
    prohibited_reductions:
      - spokesman for conventional Athens
      - merely vulgar opponent of philosophy
      - entertainer without substantive knowledge
      - direct biographer of Socrates
      - final theologian whose comic gods settle divine truth
    study_status: INDEPENDENT_ARISTOPHANIC_RECONSTRUCTION_PENDING

  - witness_id: PVP-WIT-003
    name: Plato
    witness_class: INDEPENDENT_PHILOSOPHIC_AND_DRAMATIC_WITNESS
    local_role: >
      Independent philosophic witness whose explicit criticism of poetry must be
      compared with his poetic, mimetic, rhetorical, and dramatic deed.
    documentary_standing:
      authority: PRIMARY_CLASSICAL_PHILOSOPHIC_WITNESS
      limit: >
        Socratic speech within a dialogue is not automatically Plato's final teaching,
        and Plato may not be forced to confirm Strauss's synthesis.
    completed_registered_study:
      study_id: PLATO-APOLOGY-PVP-TP-001
      work: Apology of Socrates
      path: studies/plato/apology/philosophy-poetry-divine-authority-reconstruction.yaml
      source_status: studies/plato/apology/source-status.yaml
      completion: COMPLETE_FOR_REGISTERED_JOWETT_TRANSLATION
      certification: NOT_CERTIFIED
      comparative_synthesis: NOT_AUTHORIZED
      limit: >
        The study remains revisable through Greek-text and alternate-translation
        comparison and does not complete the Platonic witness as a whole.
    remaining_priority_scope:
      - Republic
      - Gorgias
      - Phaedrus
      - Symposium
      - Laws
      - other dialogues as relevance is established
    study_status: PARTIAL_INDEPENDENT_PLATONIC_RECONSTRUCTION_IN_PROGRESS

  - witness_id: PVP-WIT-004
    name: Xenophon
    witness_class: INDEPENDENT_SOCRATIC_WITNESS
    local_role: >
      Independent Socratic witness with prima facie historical standing whose
      practical and political presentation must be reconstructed apart from Plato.
    documentary_standing:
      authority: PRIMARY_CLASSICAL_SOCRATIC_WITNESS
      historical_standing: PRIMA_FACIE_HISTORICAL_WITH_LITERARY_MEDIATION
      limit: >
        Historical standing does not eliminate selection, rhetoric, dramatic
        construction, or differences among Xenophon's works.
    planned_study_scope:
      - Memorabilia
      - Oeconomicus
      - Symposium
      - Apology
      - other relevant Xenophontic works
    study_status: INDEPENDENT_XENOPHONTIC_RECONSTRUCTION_PENDING

  - witness_id: PVP-WIT-005
    name: Socrates
    witness_class: DISPUTED_SUBJECT_AND_REPRESENTED_CLAIMANT
    local_role: >
      Central disputed subject represented as natural philosopher, rhetorician,
      citizen, teacher, erotic guide, law-abiding defendant, political philosopher,
      and examiner through conflicting witnesses.
    documentary_standing:
      authority: NO_DIRECT_SURVIVING_AUTHORIAL_CORPUS
      representation_channels:
        - Aristophanes
        - Plato
        - Xenophon
        - later ancient witnesses
        - Leo Strauss's reconstructions
    governing_uncertainties:
      - whether Aristophanes preserves historically reliable features of the young Socrates
      - whether a historical Socratic turn occurred in the form reconstructed by Strauss
      - whether Aristophanes contributed causally to that turn
      - how Platonic and Xenophontic representations relate to the historical person
      - whether mature Socratic philosophy integrates or manages poetic truth
    study_status: DISPUTED_RECONSTRUCTION_REQUIRING_COMPARATIVE_WITNESS_WORK

contextual_and_editorial_witnesses:
  - witness_id: PVP-CXT-001
    name: Joseph Cropsey
    witness_class: EDITORIAL_PROVENANCE
    source_relation: Foreword to Studies in Platonic Political Philosophy
    permitted_role: publication provenance and collection history
    prohibited_role: supplying Strauss's missing doctrine or governing the essays
  - witness_id: PVP-CXT-002
    name: Thomas L. Pangle
    witness_class: SECONDARY_EDITORIAL_AND_INTERPRETIVE_CONTEXT
    source_relation: Introduction to Studies in Platonic Political Philosophy
    permitted_role: provisional orientation and bibliographic guidance
    prohibited_role: >
      Governing Strauss's meaning, supplying the missing authorial introduction, or
      deciding the rank of poetry, revelation, or philosophy.

witness_relation_rules:
  independent_reconstruction_rule: >
    Aristophanes, Plato, and Xenophon must each be reconstructed on their own terms
    before comparison. Strauss must be reconstructed source by source before a
    corpus-level claim is certified.
  non_confirmation_rule: >
    No later witness may be forced to confirm PVP-STUDY-001 or SPPP-STUDY-001.
    Contradiction, qualification, correction, and dissent must be preserved.
  no_majority_rule: >
    Agreement among witnesses does not mechanically establish historical or
    philosophic truth; documentary authority, argument, dramatic action, occasion,
    and source condition remain controlling.
  no_absorption_rule: >
    Evidence concerning poetic gods or civic theology must cross-reference the
    Theologico-Political Problem where revelation, divine command, prophecy, sacred
    law, or ultimate authority is at issue.

