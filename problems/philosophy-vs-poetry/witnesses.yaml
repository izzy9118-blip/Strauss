migration_safeguards:
  migration_status:
    lifecycle: PLANNING
    certification: NOT_CERTIFIED
    activation: NOT_ACTIVE
  predecessor_effect: NONE
  rule: >
    This revised subordinate successor record does not rewrite, replace, certify,
    deactivate, or remove any predecessor problem object or accepted historical source.
  prohibitions:
    - no silent deletion of a witness or accepted source
    - no retrospective rewriting of predecessor history
    - no merger of independent witnesses before reconstruction
    - no certification from registry structure or study completion alone
    - no absorption of the Theologico-Political Problem through witness overlap

termination:
  registry_state: FOUNDING_WITNESS_REGISTRY_UPDATED
  certification: NOT_CERTIFIED
  completion_conditions:
    - all principal witnesses have explicit source status and local role
    - independent reconstruction requirements are preserved
    - completed and pending studies are distinguished
    - Socrates remains a disputed represented subject
    - editorial framing cannot govern primary meaning
    - brother-problem jurisdiction remains distinct
  current_limit: >
    The registry now records the completed collection and Apology studies, but
    substantive Aristophanic, Platonic, Xenophontic, and Strauss corpus work remains
    pending and may revise local roles through documented successor versions.
