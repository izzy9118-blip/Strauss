    - comedy

anti_capture_principle: >
  Neither antiquity nor novelty, practical success nor political weakness,
  historical endurance nor technical power, scientific prestige nor revolutionary
  victory may certify philosophical rank. No ancient, modern, civilization,
  institution, technology, or historical movement may declare itself the final tribunal.

non_absorption_clause: >
  This problem owns the transformation of ancient and Biblical horizons under
  modernity. It must not absorb the full doctrines of nature, poetry, practice,
  revelation, Athens and Jerusalem, or rank. Shared sources and findings are
  referenced through subordinate records rather than duplicated as governing doctrine.

