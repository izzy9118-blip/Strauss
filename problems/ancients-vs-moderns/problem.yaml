governing_question: >
  Did modern political thought discover a truer standard, or did it gain reliability,
  institutional power, and control by lowering or narrowing the fuller ancient and
  Biblical questions?

compressed_question: >
  Does modern power rest on deeper truth or on a lowered horizon?

jurisdiction:
  owns:
    - chronology and innovation as insufficient standards of rank
    - ancient, Biblical, and modern beginnings and highest ends as a comparative sequence
    - the modern transformation of nature, right, history, science, and political philosophy
    - progress, historicism, value creation, secularization, and rationalization
    - method, sovereignty, science, technology, institutions, and control as modern forms
    - the relation between ancient standards and modern reliability
    - practical gains and human costs of modern lowering or narrowing
    - modern transformations of revelation, education, equality, and knowledge
    - return, recovery, and the limits of restoring an earlier horizon unchanged
  does_not_own:
    - canonical_key: nomos-vs-physis
      reason: >
        Nomos vs. Physis owns nature, convention, natural right, natural law, and the
        normative standard apart from their historical transformation.
    - canonical_key: philosophy-vs-poetry
      reason: >
        Philosophy vs. Poetry owns rival human forms of wisdom, representation,
        education, and knowledge of souls.
    - canonical_key: theory-vs-practice
      reason: >
        Theory vs. Practice owns the permanent relation among understanding, judgment,
        authority, execution, institutions, correction, and chance.
    - canonical_key: theologico-political
      reason: >
        The Theologico-Political Problem owns ultimate authority between autonomous
        reason and genuine revelation, prophecy, divine command, and sacred law.
    - canonical_key: athens-vs-jerusalem
      reason: >
        Athens vs. Jerusalem owns the complete philosophic and Biblical ways of life.
    - canonical_key: wise-vs-vulgar
      reason: >
        The Wise vs. The Vulgar owns rank, recognition, expertise, differentiated
        education, mediation, and elite capture.

permanent_tension: >
  Modernity gains practical control by beginning from ordinary passions,
  preservation, fear, rights, method, sovereignty, science, and institutional
  reliability, while ancient and Biblical horizons preserve higher questions of
  virtue, nature, justice, revelation, holiness, contemplation, and the best life.
  The gain is real, but neither practical power nor ancient height interprets itself
  as philosophical superiority.

boundary:
  activates_when:
    - modernity claims superiority through progress, novelty, method, science, or power
    - ancient standards are dismissed as impossible, aristocratic, theological, or obsolete
    - preservation, security, rights, equality, or freedom replaces virtue or the best life as the beginning
    - method, sovereignty, institutions, administration, or technology replaces rare virtue and prudence
    - history or value creation replaces nature, revelation, or universal reason
    - religious doctrine is rationalized, privatized, politicized, psychologized, or historicized
    - institutional reliability is treated as proof of the highest understanding
    - ancient or Biblical vocabulary is preserved with transformed referents
    - modern crises generate a proposed return to ancient or Biblical sources
    - chronology is used as a standard of rank
  does_not_activate_by_itself:
    - every chronological comparison
    - every technological innovation
    - every difference between old and new institutions
    - every case of progress or decline
    - every recovery of an older text
    - every disagreement between generations

