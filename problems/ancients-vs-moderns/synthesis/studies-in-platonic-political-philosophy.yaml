strict_problem: >
  Did modern political thought discover a truer standard, or did it gain reliability,
  institutional power, and control by lowering or narrowing the fuller ancient and biblical questions?

principal_findings:
  - Chronology alone establishes no rank.
  - Ancient political philosophy begins from the good life, virtue, justice, nature, and the best regime.
  - The ancients preserve the height of the standard while accepting political improbability.
  - Machiavelli and Hobbes begin from ordinary passions, preservation, fear, and institutional reliability.
  - Modernity replaces dependence on fortune, providence, rare virtue, and wisdom with project, method, sovereignty, and control.
  - Historicism attacks ancient nature and modern universal reason but risks self-contradiction.
  - Nietzsche radicalizes modern creation while leaving the creator's authority unresolved.
  - Cohen's modern purification elevates morality while transforming revelation, Law, and immortality.
  - Some modern discoveries appear new because the Socratic or comprehensive horizon has narrowed.

unresolved_questions:
  - whether modern reliability rests on truer knowledge or lowered ends
  - whether practical power can establish philosophical superiority
  - whether historicism can avoid self-contradiction
  - whether modern transformations preserve or replace revelation and natural right

jurisdiction_limits:
  - Nature and natural right remain under Nomos vs. Physis.
  - The strict reason-revelation conflict remains theologico-political.
  - The complete Athens-Jerusalem alternative remains distinct.
  - The collection does not replace independent ancient or modern witnesses.

