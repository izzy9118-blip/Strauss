  non_absorption: The paragraph does not stand for the whole ancient-modern dispute.
source_findings:
- id: HIERO-LAST-PF-001
  classification: documented_finding
  proposition: 'The last paragraph identifies the deepest dispute with Kojeve as the legitimation of classical philosophy’s
    presupposition of eternal unchanging order against historical self-creation of Being.'
- id: HIERO-LAST-PF-002
  classification: documented_finding
  proposition: 'The classical position distinguishes political conditions of philosophy from sources of philosophic truth;
    the historicist position threatens that distinction by making social-historical change constitutive of Being and truth.'
- id: HIERO-LAST-PF-003
  classification: documented_finding
  proposition: 'The practical contrast is between attachment to human-historical concerns and philosophic detachment toward
    the whole.'
- id: HIERO-LAST-PF-004
  classification: documentary_limit
  proposition: 'The registered paragraph does not itself formulate a doctrine of a universal state or theological implications.'
