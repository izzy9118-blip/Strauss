migration_safeguards:
  migration_status:
    lifecycle: PLANNING
    certification: NOT_CERTIFIED
    activation: NOT_ACTIVE
  predecessor_effect: NONE
  rule: >
    This registry is a subordinate successor record. It does not certify or activate
    Ancients vs. Moderns, convert pending studies into evidence, or authorize deletion,
    chronological ranking, retrospective harmonization, or jurisdictional merger.
  prohibitions:
    - no silent deletion of a witness or source
    - no chronology, novelty, antiquity, power, or weakness treated as certification
    - no ancient, Biblical, or modern horizon treated as homogeneous
    - no genealogy treated as refutation by itself
    - no institutional success treated as comprehensive wisdom
    - no secondary framing governing primary meaning
    - no certification from registry validity alone

termination:
  registry_state: FOUNDING_WITNESS_REGISTRY_CREATED
  certification: NOT_CERTIFIED
  completion_conditions:
    - ancient, Biblical, modern, historicist, and institutional witness lines remain distinct
    - completed and pending studies are distinguished
    - chronology and power cannot certify rank
    - transformations remain explicit rather than hidden by shared vocabulary
    - independent reconstruction requirements remain enforceable
  current_limit: >
    Structural witness registration is complete for founding production. Independent
    ancient, Biblical, modern, scientific, and institutional reconstruction remains pending.
