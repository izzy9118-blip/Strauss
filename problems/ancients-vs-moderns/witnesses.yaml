      Primary witness for reconstructing the ancient-modern quarrel, Machiavellian
      lowering, Hobbesian regularization, historicism, Nietzsche, and modern rational religion.
    registered_sources:
      - title: Studies in Platonic Political Philosophy
        source_class: QUALIFIED_PRIMARY_STRAUSS_COLLECTION
