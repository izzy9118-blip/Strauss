source_local_findings:
  - {classification: documented_finding, proposition: "The Bible and Greek philosophy are the two fundamental sources or codes of Western civilization."}
  - {classification: documented_finding, proposition: "Strauss describes Western life as life between Jerusalem and Athens and treats their tension as fundamental and life-giving."}
  - {classification: documented_finding, proposition: "Biblical and classical ethics overlap substantially in practical conduct while differing radically over humility, self-assertion, art, cosmology, creation, and the meaning of wisdom."}
  - {classification: documented_finding, proposition: "Every attempted synthesis ultimately sides with one of the alternatives, while neither Jerusalem nor Athens has refuted the other."}
  - {classification: bounded_conclusion, proposition: "The source requires openness to both alternatives without aesthetic eclecticism, harmonization, or certification of a victor."}
non_absorption:
  - Jerusalem and Athens are not reduced to historical cultures detached from the primary question of revelation versus philosophy.
  - Moral overlap does not dissolve disagreement over ultimate authority and the good life.
  - The synthesis does not certify either alternative or a higher common principle.
  - Independent biblical and Greek witnesses remain required for corroboration.
limits:
  - The 1979 and 1981 publication states remain separately unreviewed.
  - No doctrine, migration, successor activation, or predecessor displacement is authorized.
