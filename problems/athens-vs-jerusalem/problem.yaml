governing_question: >
  Can the comprehensive orientations beginning from wonder, nature, and autonomous
  understanding and from fear of the Lord, creation, command, and obedient love be
  reconciled without transforming one into the other?

compressed_question: >
  Can Athens and Jerusalem be reconciled without ceasing to be themselves?

jurisdiction:
  owns:
    - autonomous understanding and obedient love as comprehensive ways of life
    - wonder and fear of the Lord as rival beginnings
    - seeing, questioning, hearing, and obedient reception
    - nature and creation as rival accounts of the whole
    - philosopher and prophet as rival highest human types
    - natural excellence and divine Law as standards within comprehensive orientations
    - the best regime and the Messianic age
    - particular bearers of universal claims
    - historical intertwining and highest incompatibility
    - testing attempted reconciliations for transformation
  does_not_own:
    - canonical_key: nomos-vs-physis
      reason: >
        Nomos vs. Physis owns the general nature-convention and natural-law distinctions.
    - canonical_key: philosophy-vs-poetry
      reason: >
        Philosophy vs. Poetry owns rival human forms of wisdom, representation,
        dramatic and poetic form, and knowledge of souls.
    - canonical_key: theory-vs-practice
      reason: >
        Theory vs. Practice owns political judgment, implementation, institutions,
        toleration, statehood, and finite action under imperfect conditions.
    - canonical_key: theologico-political
      reason: >
        The Theologico-Political Problem owns ultimate authority among autonomous
        reason, genuine revelation, prophecy, divine command, sacred law, and sovereignty.
    - canonical_key: wise-vs-vulgar
      reason: >
        The Wise vs. The Vulgar owns rank, recognition, differentiated education,
        mediation, and capture by counterfeit claimants.
    - canonical_key: ancients-vs-moderns
      reason: >
        Ancients vs. Moderns owns the historical transformation through secularization,
        rationalization, progress, historicism, mastery, and value creation.

permanent_tension: >
  Both orientations claim wisdom in the highest sense. Athens cannot surrender
  autonomous examination without ceasing to be philosophic, while Jerusalem cannot
  surrender creation, command, covenant, Law, and obedient love without ceasing to be
  revelatory. Historical intertwining and mutual illumination do not by themselves
  establish a standpoint that preserves both final authorities.

boundary:
  activates_when:
    - wonder and fear are treated as comprehensive beginnings
    - nature and creation are compared as accounts of the whole
    - seeing and hearing are ranked as modes of access to truth
    - philosopher and prophet make rival highest claims
    - autonomous understanding and obedient love are compared as ways of life
    - divine Law and natural excellence are treated as interchangeable
    - the best regime is identified with redemption or the Messianic age
    - historical intertwining is treated as proof of reconciliation
    - modern mediation claims to preserve both orientations
    - political restoration, survival, or statehood is assigned theological finality
  does_not_activate_by_itself:
    - every contrast between Greek and Jewish sources
    - every dispute about religion and philosophy
    - every use of Athens or Jerusalem as a metaphor
    - every historical encounter between the traditions
    - every political issue involving a religious community

relations:
  - related_problem: nomos-vs-physis
    relation_type: DEPENDS_ON
  - related_problem: philosophy-vs-poetry
