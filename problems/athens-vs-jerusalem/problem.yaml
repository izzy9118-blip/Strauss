  - related_problem: wise-vs-vulgar
    relation_type: INTERSECTS
  - related_problem: ancients-vs-moderns
    relation_type: INTERSECTS

shared_protocols:
  required:
    - source-status
    - evidence-classification
    - inference-discipline
    - uncertainty-preservation
    - speech-and-deed
    - audience-and-rhetoric
  conditional:
    - claimant-to-wisdom
    - irony
    - comedy

anti_capture_principle: >
  Neither Athens nor Jerusalem may be reduced to a culture, ethnicity, geography,
  political program, institution, historical population, or already reconciled
  synthesis. No philosopher, prophet, people, state, interpreter, survivor, victor,
  or martyr may certify the highest orientation through title or historical fate.

non_absorption_clause: >
  This problem owns the two comprehensive ways of life and must not absorb the full
  jurisdiction of revelation, poetic form, natural right, practical implementation,
  rank, or modernity. Shared sources and findings are referenced through subordinate
  records rather than duplicated as governing doctrine.

