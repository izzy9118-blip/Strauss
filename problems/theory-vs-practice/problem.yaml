governing_question: >
  How can knowledge of ends become a politically effective deed when deliberation,
  persuasion, authority, execution, institutions, character, and chance remain distinct?

compressed_question: >
  How does understanding become responsible action?

jurisdiction:
  owns:
    - the relation between understanding and action
    - contemplation and political responsibility
    - theoretical standards and practical judgment
    - deliberation, persuasion, authorization, command, and execution
    - effective and legitimate authority as a distinction
    - production and right use as a distinction
    - institutions, distributed knowledge, correction, and accountability
    - founding, preservation, indirect guidance, and chance
    - finite political goods under unresolved comprehensive questions
  does_not_own:
    - canonical_key: nomos-vs-physis
      reason: >
        Nomos vs. Physis owns the natural, legal, and moral standard that action is
        claimed to serve.
    - canonical_key: philosophy-vs-poetry
      reason: >
        Philosophy vs. Poetry owns rival forms of wisdom and poetry's specific
        accusation concerning souls, education, prudence, and political consequence.
    - canonical_key: theologico-political
      reason: >
        The Theologico-Political Problem owns ultimate authority among autonomous
        reason, genuine revelation, prophecy, divine command, sacred law, and sovereignty.
    - canonical_key: athens-vs-jerusalem
      reason: >
        Athens vs. Jerusalem owns autonomous understanding and obedient love as
        comprehensive rival orientations toward the highest human life.
    - canonical_key: wise-vs-vulgar
      reason: >
        The Wise vs. The Vulgar owns rank, recognition, differentiated education,
        mediation, and elite capture.
    - canonical_key: ancients-vs-moderns
      reason: >
        Ancients vs. Moderns owns the historical transformation from virtue and
        prudence toward method, sovereignty, institutions, mastery, and history.

permanent_tension: >
  Political action cannot wait for complete knowledge, but urgency and successful
  outcomes do not transform opinion into knowledge or effective authority into
  rightful authority. General standards require judgment concerning particulars,
  while judgment, institutions, and indirect guidance cannot certify their own wisdom.

boundary:
  activates_when:
    - a theoretical judgment must guide action
    - success or failure is treated as proof of wisdom or folly
    - authority, legitimacy, expertise, and execution are conflated
    - production of a means is confused with knowledge of right use
    - founding and preservation are treated as the same capacity
    - institutions distribute knowledge, correction, or responsibility
    - chance is ignored in judging prior decisions
    - indirect guidance is compared with direct rule
  does_not_activate_by_itself:
    - every practical task
    - every policy disagreement
    - every legal or administrative question
    - every failed implementation
    - every conflict between an ideal and reality

