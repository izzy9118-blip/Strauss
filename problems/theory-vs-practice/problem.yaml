    - evidence-classification
    - inference-discipline
    - uncertainty-preservation
    - speech-and-deed
    - audience-and-rhetoric
  conditional:
    - claimant-to-wisdom
    - irony
    - comedy

anti_capture_principle: >
  Neither theoretical brilliance, technical expertise, legal office, force, popular
  consent, secrecy, practical success, historical victory, nor institutional endurance
  may certify wisdom, legitimacy, or responsible rule without examining ends, means,
  judgment, character, correction, accountability, and chance.

non_absorption_clause: >
  This problem owns the general movement from understanding to action and must not
  absorb the full doctrines of nature, poetry, revelation, comprehensive ways of life,
  rank, or modernity. Shared sources and findings are referenced through subordinate
  records rather than duplicated as governing doctrine.

