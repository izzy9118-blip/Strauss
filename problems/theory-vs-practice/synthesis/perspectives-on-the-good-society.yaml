source_findings:
- id: GOOD-SOCIETY-PF-001
  classification: documented_finding
  proposition: 'Strauss treats the secular state as a necessary condition of civic equality and interfaith discussion but
    not as a self-sufficient source of the standards by which the good society is judged.'
- id: GOOD-SOCIETY-PF-002
  classification: documented_finding
  proposition: 'Religious diversity can resist conformism because it directs human beings toward what transcends humanity,
    but tolerance does not require respect for every object of worship or practice.'
- id: GOOD-SOCIETY-PF-003
  classification: documented_finding
  proposition: 'Jewish-Christian common ground does not abolish disagreement; recognition of the other remains subordinate
    to truth.'
- id: GOOD-SOCIETY-PF-004
  classification: documented_finding
  proposition: 'Progress, social action, science, and organizational efficiency cannot by themselves be equated with redemption
    or the good society.'
- id: GOOD-SOCIETY-PF-005
  classification: documented_finding
  proposition: 'Political-theological prescriptions must remain subject to prudential consequences and the limit of human
    knowledge.'
- id: GOOD-SOCIETY-PF-006
  classification: bounded_conclusion
  proposition: 'The closing possibility of secession rejects the expectation that a final political organization can absorb
    every serious human difference without loss.'
