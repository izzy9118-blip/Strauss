witnesses:
  - witness_id: TVP-WIT-001
    name: Leo Strauss
    witness_class: MODERN_INTERPRETIVE_PRIMARY_WITNESS
    local_role: >
      Primary witness for reconstructing the kingly-art problem, practical judgment,
      ancient political limits, modern lowering, and the distinction among knowledge,
      action, authority, and institutions.
    registered_sources:
      - title: Studies in Platonic Political Philosophy
        source_class: QUALIFIED_PRIMARY_STRAUSS_COLLECTION
        study_record: studies/studies-in-platonic-political-philosophy/foundational-problems-reconstruction.yaml
