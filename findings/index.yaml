proposition_kinds:
- documented_finding
- supported_inference
- working_hypothesis
- comparative_question
- unresolved_uncertainty
- competing_interpretation
- contradiction_recorded
- dissent
- bounded_conclusion
- affirmative_non_resolution
preservation_rules:
- record-local evidence classifications and confidence govern the indexed propositions
- uncertainty, opacity, contradiction, and dissent are positive findings and may not be omitted
- source-specific studies may supply problem syntheses only by explicit derivation or reference
- problem syntheses may not replace their source-specific studies
- migration ledgers classify disposition and transformation; they do not certify doctrine or activate successors
- active predecessors and accepted migration sources remain independently recoverable
- no later finding silently revises an earlier record
- supersession requires an explicit forward record and preserved predecessor identity
- agreement across records derived from the same source is not independent corroboration
- platform reviewability, printed locators, and object identifiers may not be transformed into byte custody or cryptographic
  identity
findings_gaps:
- gap_id: FINDINGS-GAP-001
  statement: The registry does not yet index every proposition as a separate normalized object.
  effect: PROPOSITION_LEVEL_QUERY_REQUIRES_LOADING_REFERENCED_RECORD
- gap_id: FINDINGS-GAP-002
  statement: Many registered source entities lack independent source-specific study records.
  effect: FINDINGS_COVERAGE_REMAINS_SOURCE_ASYMMETRICAL
- gap_id: FINDINGS-GAP-003
  statement: Twelve of the nineteen Theologico-Political writings now have complete provisional item studies; the remaining
    seven lack individual sequential studies.
  effect: PREDECESSOR_SYNTHESIS_REMAINS_REVISABLE
- gap_id: FINDINGS-GAP-004
  statement: Independent Aristophanes, Xenophon, biblical, medieval, Spinozist, Cohenian, Kantian, Talmonian, and most Platonic
    findings remain incomplete.
  effect: COMPARATIVE_AND_DOCTRINAL_RANKING_BLOCKED
- gap_id: FINDINGS-GAP-005
  statement: Actual candidate ministerial reports have not yet been validated against the complete contract stack.
  effect: RUNTIME_REPORT_READINESS_REMAINS_LIMITED
- gap_id: FINDINGS-GAP-006
  statement: No authorized certification record promotes the indexed findings to final doctrine or successor activation.
  effect: ALL_FINDING_SETS_REMAIN_NONCERTIFYING
validation_rules:
- finding_set, gap, source, problem, and relation identifiers must resolve and remain unique
- every registered path must resolve within the repository
- every YAML record in current problem synthesis directories must be registered exactly once
- every YAML record in the foundational transaction directory must be registered exactly once
- every analytical or integration study record in the corpus registry must be registered exactly once
- every source binding must resolve in corpus/index.yaml
- every problem binding must resolve in problems/registry.yaml
- indexes must equal bindings derived from finding_sets
- active predecessor content must equal the preserved historical copy
- certification and activation may not be inferred from lifecycle, completion, acceptance, or classification
- current-state exhaustive indexing may not be described as complete findings or doctrine
- FINDSET-011 must retain its three jurisdiction-preserving local syntheses and platform-reference limitations
- FINDSET-012 must derive only FINDSET-122 and FINDSET-123, preserve CORPUS-WIT-103 and pending 1948 comparison, and retain
  noncorroboration and no-successor safeguards
- FINDSET-013 must derive only FINDSET-124 through FINDSET-126, preserve CORPUS-WIT-108 and pending earlier-text comparison,
  and retain noncorroboration and no-successor safeguards
