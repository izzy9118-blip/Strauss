schema_version: 1.0
record_type: typed_findings_registry
identity:
  id: STRAUSS-FINDINGS-INDEX-001
  title: Strauss Repository Typed Findings Registry
  version: 1.12.0
status:
  lifecycle: ACTIVE_OPERATIONAL_REGISTRY
  registry_scope: EXHAUSTIVE_FOR_CURRENT_COMMITTED_FINDINGS_RECORD_STATE
  findings_completion: INCOMPLETE_OPEN_FINDINGS_STORE
  certification: NOT_CERTIFIED
  authority: DISCOVERY_PROVENANCE_JURISDICTION_AND_REVISION_ONLY
revision_history:
  predecessor_version: 1.11.0
  predecessor_blob_sha: PRESERVED_BY_GIT
  transformation: SUBSTANTIVE_FORWARD_REVISION
  reason: Register WHY-REMAIN-JEWS-STUDY-001 as FINDSET-019 and jurisdiction-preserving syntheses FINDSET-138 and FINDSET-139
    while preserving transcription, speaker-layer, editorial-intervention, noncorroboration, noncertification, and no-successor
    safeguards.
purpose: Provide deterministic discovery and loading of current findings-bearing records by source, problem, record class,
  migration state, and provenance while preserving the difference among documentary finding, supported inference, working
  hypothesis, comparative question, contradiction, dissent, and unresolved uncertainty.
governing_records:
  evidence_classification: protocols/evidence-classification.yaml
  inference_discipline: protocols/inference-discipline.yaml
  uncertainty_preservation: protocols/uncertainty-preservation.yaml
  problem_preservation: method/preserve-problem.yaml
  corpus_registry: corpus/index.yaml
  problem_registry: problems/registry.yaml
  migration_plan: migrations/foundational-problems-v2/migration.yaml
scope_rule: The registry is exhaustive for findings-bearing and findings-governing records now committed in studies, problem
  synthesis directories, foundational migration transaction ledgers, and the two preserved predecessor sources explicitly
  used by current migration. It is not an assertion that every sentence in the repository is a finding, that every source
  has been studied, or that current findings are complete, correct, or certified.
finding_unit_rule: The registry identifies authoritative finding sets by reference. Individual propositions, evidence locators,
  qualifications, contradictions, and uncertainties remain in the referenced record and must be loaded from that record. The
  registry may not paraphrase them into a stronger or more final claim.
identifier_rules:
  finding_set_prefix: FINDSET
  source_binding_authority: corpus/index.yaml
  problem_binding_authority: problems/registry.yaml
  uniqueness_rule: Every finding_set_id identifies one committed repository record.
  nonduplication_rule: The same underlying proposition may appear in a study, local synthesis, and migration transaction only
    through explicit derivation or reference. Repetition in the registry does not establish independent corroboration.
