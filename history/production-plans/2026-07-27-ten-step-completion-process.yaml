    state: IMPLEMENTED_AND_ACTIVE
    governing_record: manifest.yaml
    current_version: 1.2.0
    limit: The manifest remains semantically incomplete and not doctrinally certified.
  - sequence: 3
    action: Reconstruct speech/speech-mechanism.yaml as the first full mechanism.
    state: IMPLEMENTED_CONTRACT_SOURCE_APPLICATION_INCOMPLETE
    governing_record: speech/speech-mechanism.yaml
    limit: The speech contract remains subordinate to source-grounded reasoning.
  - sequence: 4
    action: Strengthen adapter.py to validate substantive contracts.
    state: IMPLEMENTED_LIMITED_READ_ONLY
    governing_record: adapter.py
    limit: The adapter cannot certify doctrine, witnesses, migrations, or Assembly authority.
  - sequence: 5
    action: Reconstruct the six hermeneutic objects.
    state: IMPLEMENTED_CONTRACTS_SOURCE_APPLICATION_INCOMPLETE
    governing_records: [hermeneutics/literary-concealment.yaml, hermeneutics/whole-and-part.yaml, hermeneutics/speaker-and-author.yaml, hermeneutics/audience.yaml, hermeneutics/contradiction.yaml, hermeneutics/historical-and-philosophical-understanding.yaml]
  - sequence: 6
    action: Reconstruct the four method objects.
    state: IMPLEMENTED_CONTRACTS_SOURCE_APPLICATION_INCOMPLETE
    governing_records: [method/recover-question.yaml, method/reconstruct-alternatives.yaml, method/textual-order.yaml, method/preserve-problem.yaml]
  - sequence: 7
    action: Complete the seven problem objects and their source relations.
    state: ACTIVE_INCOMPLETE
    governing_record: problems/registry.yaml
    completed:
      - seven subordinate bundles load in canonical order
      - controlled relation records exist
      - active predecessors and accepted migration sources remain preserved
      - Jerusalem and Athens now supplies distinct provisional syntheses to Theologico-Political and Athens-versus-Jerusalem
    remaining:
      - complete source-specific application to each problem
      - complete independent witness reconstruction
      - complete proposition-level migration where required
      - preserve jurisdictional seams without absorption
  - sequence: 8
    action: Populate corpus and findings with real typed registrations.
    state: ACTIVE_INCOMPLETE
    governing_records: [corpus/index.yaml, findings/index.yaml]
    completed:
      - all 19 Theologico-Political predecessor writings have bounded item identities
      - CORPUS-WIT-109 is registered with provenance, fingerprint, and locators
      - JA-STUDY-001 is complete provisional for the reviewed 1983 collected witness
      - CORPUS-STUDY-008, FINDSET-008, FINDSET-111, and FINDSET-112 are registered
      - corpus and findings registries preserve derivation, jurisdiction, gaps, and noncertification
    remaining:
      - establish reviewed witnesses for eighteen item identities
      - conduct eighteen independent sequential item studies
      - compare the original 1967 Jerusalem and Athens printing where wording matters
      - expand independent primary witnesses beyond Strauss's writings
      - normalize propositions where warranted by reproducible extraction
      - preserve later additions through forward revision
  - sequence: 9
    action: Run behavioral tests.
    state: ACTIVE_CONTINUOUS
    governing_records: [tests/, .github/workflows/validate-lean-interface.yml]
    completed_in_current_sequence:
      - tests drafted for one completed provisional TP item study and eighteen incomplete states
      - tests drafted for corpus/findings coverage, derivation, jurisdiction, and completion-language consistency
    current_requirement: Run the complete GitHub Actions validation before merge.
    limit: Tests validate declared contracts and fixtures, not philosophical truth or corpus completion.
  - sequence: 10
    action: Repin the completed Strauss interface in Sanctum.
    state: BLOCKED_UNTIL_SUBSTANTIVE_COMPLETION
    governing_record: izzy9118-blip/Sanctum/registry/ministers.yaml
    prohibition: >
      Do not describe a limited or structurally valid Strauss interface as completed. A later
      completed-interface pin requires substantive completion, declared validation, accurate
      preservation or resolution of blockers, and separate Sanctum validation.

