  certification: NOT_CERTIFIED
  completion: IN_PROGRESS
  governing_rule: >
    Structural validity, typed registration, completed provisional study, and passing tests
    do not establish substantive repository completion. Every unit must preserve source
    hierarchy, independent reconstruction, uncertainty, predecessor authority, nonabsorption,
    and the prohibition on repository or artificial-intelligence self-certification.

