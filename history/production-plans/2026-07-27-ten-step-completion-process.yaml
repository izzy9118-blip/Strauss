schema_version: 1.0
record_type: production_process_state

identity:
  id: STRAUSS-PRODUCTION-PROCESS-001
  title: Ten-Step Strauss Operational Completion Process
  version: 1.2.0

status:
  lifecycle: ACTIVE_PRODUCTION_SEQUENCE
  certification: NOT_CERTIFIED
  completion: IN_PROGRESS
  governing_rule: >
    Structural validity, typed registration, and passing tests do not establish
    substantive completion. Each completed step must preserve source hierarchy,
    independent reconstruction, uncertainty, predecessor authority, and the
    prohibition on repository or artificial-intelligence self-certification.

revision_history:
  predecessor_version: 1.1.0
  predecessor_blob_sha: 5b7e14aec64f95c2a7d286b70c3ec56c2aa42d3b
  reason: >
    Record completion of bounded item-level source-identity registration for all nineteen
    writings in the active Theologico-Political predecessor basis. Advance Step 8 from
    identity registration to reviewed-witness prioritization and independent source study,
    while preserving semantic incompleteness and the Step 10 completed-interface repin blocker.

steps:
  - sequence: 1
    action: Create a complete repository audit.
    state: IMPLEMENTED_AND_ACTIVE
    governing_record: audits/operational-completeness.yaml
    current_version: 1.8.0
    limit: The audit records incompleteness; it does not cure it.
  - sequence: 2
    action: Correct the manifest completion language.
    state: IMPLEMENTED_AND_ACTIVE
    governing_record: manifest.yaml
    current_version: 1.0.0
    limit: The manifest remains semantically incomplete and not doctrinally certified.
  - sequence: 3
    action: Reconstruct speech/speech-mechanism.yaml as the first full mechanism.
    state: IMPLEMENTED_CONTRACT_SOURCE_APPLICATION_INCOMPLETE
    governing_record: speech/speech-mechanism.yaml
    limit: The speech contract is subordinate to source-grounded reasoning and requires continuing behavioral application.
  - sequence: 4
    action: Strengthen adapter.py to validate substantive contracts.
    state: IMPLEMENTED_LIMITED_READ_ONLY
    governing_record: adapter.py
    limit: The adapter cannot certify doctrine, witnesses, migrations, or Assembly authority.
  - sequence: 5
    action: Reconstruct the six hermeneutic objects.
    state: IMPLEMENTED_CONTRACTS_SOURCE_APPLICATION_INCOMPLETE
    governing_records:
      - hermeneutics/literary-concealment.yaml
      - hermeneutics/whole-and-part.yaml
      - hermeneutics/speaker-and-author.yaml
      - hermeneutics/audience.yaml
      - hermeneutics/contradiction.yaml
      - hermeneutics/historical-and-philosophical-understanding.yaml
  - sequence: 6
    action: Reconstruct the four method objects.
    state: IMPLEMENTED_CONTRACTS_SOURCE_APPLICATION_INCOMPLETE
    governing_records:
      - method/recover-question.yaml
      - method/reconstruct-alternatives.yaml
      - method/textual-order.yaml
      - method/preserve-problem.yaml
  - sequence: 7
    action: Complete the seven problem objects and their source relations.
    state: ACTIVE_INCOMPLETE
    governing_record: problems/registry.yaml
    completed:
      - seven subordinate bundles exist and load in canonical order
      - controlled relation records exist
      - active predecessors and accepted migration sources remain preserved
    remaining:
      - complete source-specific application to each problem
      - complete independent witness reconstruction
      - complete proposition-level migration where required
      - resolve or preserve jurisdictional seams without absorption
  - sequence: 8
    action: Populate corpus and findings with real typed registrations.
    state: ACTIVE_INCOMPLETE
    governing_records:
      - corpus/index.yaml
      - findings/index.yaml
    completed:
      - current committed source and study state is typed and bounded
      - current committed findings-bearing records are typed and bounded
      - all 19 active Theologico-Political predecessor writings have bounded item-level source identities
      - all 19 identity records preserve title, date, sequence, aliases or registered scope, missing witness, incomplete study, and noncertification
      - generic validation and behavioral tests cover the complete status range
    remaining:
      - establish reviewed witnesses and publication provenance for the nineteen item-level identities
      - conduct independent sequential studies after witness status is explicit
      - expand independent primary witnesses beyond Strauss's own writings
      - normalize propositions where governing records remain aggregate
      - preserve later additions through forward revision
  - sequence: 9
    action: Run behavioral tests.
    state: ACTIVE_CONTINUOUS
    governing_records:
      - tests/
      - .github/workflows/validate-lean-interface.yml
    completed_in_current_sequence:
      - complete 19-of-19 item-level source-identity coverage tests
      - manifest, audit, mapping, registry, and process consistency tests
      - missing-witness, incomplete-study, noncertification, and successor non-effect tests
    limit: Tests validate declared contracts and fixtures, not philosophical truth or corpus completion.
  - sequence: 10
    action: Repin the completed Strauss interface in Sanctum.
    state: BLOCKED_UNTIL_SUBSTANTIVE_COMPLETION
    governing_record: izzy9118-blip/Sanctum/registry/ministers.yaml
    prohibition: >
      Do not describe a limited or structurally valid Strauss interface as completed.
      A later completed-interface Sanctum pin may occur only after substantive completion,
      declared validation, and accurate resolution or preservation of all remaining blockers.

current_production_unit:
  step: 8
  completed_subunit:
    title: Theologico-Political item-level source-identity registration
    state: COMPLETE_19_OF_19
    status_range: CORPUS-STATUS-101_THROUGH_CORPUS-STATUS-119
    root: studies/theologico-political/
    non_effect: >
      Identity completion does not supply reviewed witnesses, stable locators, fingerprints,
      independent reconstruction, source-level findings, doctrine, migration, or activation.
  next_subunit:
    title: Reviewed-witness priority and first item-level witness registration
    first_action: >
      Create a controlled priority record for the nineteen writings based on foundational
      relevance, source availability, documentary condition, and nonduplication. Select the
      first source only through documented criteria, then register a lawful reviewed witness
      before beginning independent sequential reconstruction.
    required_fields:
      - source identity and priority basis
      - publication provenance
      - edition or textual witness identity
      - file or stable external locator where lawful
      - fingerprint where a local witness is reviewed
      - textual condition and locator reliability
      - relation to existing predecessor and collection-level records
      - explicit noncertification and independent-witness limits
  non_effects:
    - no source-text admission through identity records
    - no independent study completion
    - no doctrinal certification
    - no migration certification
    - no successor activation
    - no predecessor displacement
    - no Sanctum repin as a completed interface

termination:
  state: CONTINUE_UNTIL_GENUINE_BLOCKER
  blocker_rule: >
    A blocker must identify the exact missing source, authority, path, validation
    failure, or jurisdictional conflict and the precise cure required.
