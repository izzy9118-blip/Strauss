criteria:
  - {id: DOCUMENTARY_AVAILABILITY, rule: Prefer a lawful reviewed witness already available with stable bibliographic evidence and locators.}
  - {id: FOUNDATIONAL_JURISDICTION, rule: Prefer sources that directly govern the reason-revelation confrontation and its political form.}
  - {id: SOURCE_ASYMMETRY_REPAIR, rule: Prefer sources represented only through derivative predecessor or collection-level synthesis.}
  - {id: INDEPENDENT_RECONSTRUCTION_READINESS, rule: Prefer an item that can be isolated and read sequentially without importing adjacent essays.}
  - {id: NONDUPLICATION, rule: Do not mistake records derived from one witness for independent corroboration.}
  - {id: LOCATOR_REPRODUCIBILITY, rule: Prefer stable printed or section locators and preserve whether byte-level identity is available.}

