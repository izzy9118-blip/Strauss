  active_predecessor: problems/theologico-political.yaml
  preserved_predecessor: history/foundational-problems/theologico-political/STR-PROBLEM-002-v1.1-active-predecessor.yaml
  corpus_registry: corpus/index.yaml
  audit: audits/operational-completeness.yaml
  process: history/production-plans/2026-07-27-ten-step-completion-process.yaml

criteria:
  - id: DOCUMENTARY_AVAILABILITY
    rule: Prefer a lawful reviewed witness already available with stable bibliographic evidence and locators.
  - id: FOUNDATIONAL_JURISDICTION
    rule: Prefer sources that directly govern the reason-revelation confrontation and its political form.
  - id: SOURCE_ASYMMETRY_REPAIR
    rule: Prefer sources currently represented only through derivative predecessor or collection-level synthesis.
  - id: INDEPENDENT_RECONSTRUCTION_READINESS
    rule: Prefer a source whose complete item can be isolated and read sequentially without silently importing adjacent essays.
  - id: NONDUPLICATION
    rule: Do not mistake several records derived from one collection witness for independent corroboration.
  - id: LOCATOR_REPRODUCIBILITY
    rule: Prefer witnesses with stable printed pagination and a recorded container fingerprint.

available_container_witness:
  source_id: CORPUS-SRC-002
  title: Studies in Platonic Political Philosophy
  witness_id: CORPUS-WIT-001
  witness_type: SEARCHABLE_PDF_WITH_PAGE_IMAGES
  publication: University of Chicago Press, 1983
  page_count: 263
  file_size_bytes: 12551057
  sha256: 8479ed41fe951b8ebc5a2a5b6557a482a60de0d13032785a68f11d51ea8b4fb6
