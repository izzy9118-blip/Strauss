purpose: >
  Order reviewed-witness production for the nineteen source identities in the active
  Theologico-Political predecessor basis by documentary availability, foundational relevance,
  ability to repair source asymmetry, nonduplication, and readiness for independent sequential
  reconstruction. Priority does not rank philosophical truth or certify a source.

