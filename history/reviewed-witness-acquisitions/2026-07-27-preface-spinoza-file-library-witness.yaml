bounded_content_markers:
  opening_marker: >
    The item opens by identifying the 1925-28 German study, its young Jewish
    author, and the theologico-political predicament under the Weimar Republic.
  concluding_marker: >
    The argumentative body concludes by distinguishing modern from premodern
    rationalism and stating that Strauss had read Spinoza too literally because
    he had not read him literally enough; editorial notes follow.
  use_rule: >
    These markers identify item boundaries and reviewability only. They are not a
    substitute for the required independent sequential reconstruction.

