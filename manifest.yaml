revision_history:
  predecessor_version: 1.1.0
  predecessor_blob_sha: 1623009fb9433c72355ec94f8f612a34317ee500
  reason: >
    Register JA-STUDY-001 as the first complete provisional sequential study in the
    nineteen-source Theologico-Political production sequence; register CORPUS-STUDY-008,
    FINDSET-008, and the two jurisdiction-preserving problem-local syntheses. Preserve the
    original-edition gap, eighteen missing item witnesses and studies, independent-witness
    gaps, predecessor authority, noncertification, nonactivation, and the Sanctum repin block.

purpose: >
  Provide one compact, machine-readable entry point through which a runtime can load
  the repository's problems, hermeneutics, method, speech discipline, corpus registry,
  and findings registry without deleting, overwriting, or silently harmonizing the richer
  records from which this interface is derived.

audit:
  path: audits/operational-completeness.yaml
  version: 2.0.0
  classification_vocabulary:
    - SUBSTANTIVELY_RECONSTRUCTED
    - PARTIALLY_RECONSTRUCTED
    - MAPPED_TO_RICHER_RECORDS
    - STRUCTURAL_PLACEHOLDER
    - EMPTY_OR_UNIMPLEMENTED
  repinning_rule: >
    Sanctum must not be repinned as a completed Strauss interface while semantic completion
    remains INCOMPLETE. Any interim pin requires successful declared validation and must
    preserve all source, witness, study, doctrine, migration, activation, and runtime limits.

