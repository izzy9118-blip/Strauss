  bundle_members: [constitution, inquiry_profile, witness_registry, relation_record, synthesis_records]
  limitation: >
    Bundle loading validates identity, relation coverage, noncertification, and path integrity.
    It does not complete missing witnesses, settle doctrine, certify migrations, activate
    successors, displace predecessors, or confer Assembly authority.

