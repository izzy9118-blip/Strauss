problem_bundle_completion:
  state: SUBSTANTIVE_BUNDLES_RUNTIME_LOADED_SOURCE_APPLICATION_AND_MIGRATION_INCOMPLETE
  loader: problem_bundles.py
  bundle_members:
    - constitution
    - inquiry_profile
    - witness_registry
    - relation_record
    - synthesis_records
  limitation: >
    Bundle loading makes the governing records available together and validates identity,
    relation coverage, non-certification, and path integrity. It does not complete missing
    witnesses, settle doctrine, certify migrations, activate successors, or confer Assembly authority.

hermeneutic_completion:
  state: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE
  limitation: >
    Contract reconstruction establishes evidentiary and procedural rules. It does not
    complete their application to every source, work, author, or finding in the corpus.

hermeneutics:
  - key: literary-concealment
    path: hermeneutics/literary-concealment.yaml
    contract_version: STRAUSS-HERMENEUTIC-LC-1
  - key: whole-and-part
    path: hermeneutics/whole-and-part.yaml
    contract_version: STRAUSS-HERMENEUTIC-WP-1
  - key: speaker-and-author
    path: hermeneutics/speaker-and-author.yaml
    contract_version: STRAUSS-HERMENEUTIC-SA-1
  - key: audience
    path: hermeneutics/audience.yaml
    contract_version: STRAUSS-HERMENEUTIC-AUD-1
  - key: contradiction
    path: hermeneutics/contradiction.yaml
    contract_version: STRAUSS-HERMENEUTIC-CON-1
  - key: historical-and-philosophical-understanding
    path: hermeneutics/historical-and-philosophical-understanding.yaml
    contract_version: STRAUSS-HERMENEUTIC-HPU-1

method_completion:
  state: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE
  limitation: >
    The method contracts govern question recovery, independent reconstruction, ordered
    reading, and problem preservation. They do not execute source interpretation by
    themselves or complete every source-specific method record.

method:
  - key: recover-question
    path: method/recover-question.yaml
    contract_version: STRAUSS-METHOD-RQ-1
  - key: reconstruct-alternatives
    path: method/reconstruct-alternatives.yaml
    contract_version: STRAUSS-METHOD-RA-1
  - key: textual-order
    path: method/textual-order.yaml
    contract_version: STRAUSS-METHOD-TO-1
  - key: preserve-problem
    path: method/preserve-problem.yaml
    contract_version: STRAUSS-METHOD-PP-1

speech:
  mechanism: speech/speech-mechanism.yaml
  contract_version: STRAUSS-SPEECH-CONTRACT-1
  completion: PARTIALLY_RECONSTRUCTED
  voice_status: subordinate_to_reasoning
  limitation: >
    The contract governs inputs, evidence, audience, speech and deed, concealment,
    irony, comedy, uncertainty, typed candidate output, and stopping conditions. Source
    interpretation and final natural-language composition remain reasoning operations,
    not automatic consequences of loading the contract.

corpus:
  index: corpus/index.yaml
  loader: corpus_registry.py
  registry_version: 1.0.0
  completion: SUBSTANTIVELY_RECONSTRUCTED_CURRENT_STATE_EXHAUSTIVE_OPEN_CORPUS
  scope: EXHAUSTIVE_FOR_CURRENT_COMMITTED_SOURCE_AND_STUDY_STATE
  limitation: >
    The registry accounts for every current source identity and studies-tree YAML record,
    but the wider Strauss corpus, item-level source statuses, editions, translations,
    independent witnesses, and source-text access remain incomplete.

findings:
  index: findings/index.yaml
  completion: MAPPED_TO_RICHER_RECORDS

runtime:
  adapter: adapter.py
  problem_bundle_loader: problem_bundles.py
  corpus_registry_loader: corpus_registry.py
  validation_command: python adapter.py --validate
  problem_bundle_validation_command: python problem_bundles.py --validate
  corpus_registry_validation_command: python corpus_registry.py --validate
  test_command: python -m unittest discover -s tests -p 'test_*.py'
  permitted_operations:
    - validate declared paths and contracts
    - load bounded operational context
    - load complete read-only foundational problem bundles
    - load the typed current-state corpus registry
    - validate typed speech requests
    - build non-authoritative candidate report structures
  prohibited_operations:
    - admit or distribute source texts through the registry
    - certify doctrine or wisdom
    - activate successor problems
    - displace active predecessors
    - rewrite source findings
    - confer Assembly authority

sanctum_contract:
  assembly_repository: izzy9118-blip/Sanctum
  registry_path: registry/ministers.yaml
  participation: universal
  outside_my_ground_permitted: true
  output_rule: >
    The adapter emits candidate ministerial context and reports. Git remains the
    authoritative memory, and Sanctum's Validation Gate alone may confer Assembly-level
    authority on a returned record.

migration:
  mapping_record: migrations/lean-operational-interface.yaml
  mode: ADDITIVE_NON_DESTRUCTIVE
  flat_problem_projection_deferred: true
  reason: >
    The lean interface is established through explicit mappings while active
    predecessors, successor directories, studies, protocols, governance records,
    migration ledgers, and historical copies remain intact. The existing path
    problems/theologico-political.yaml is an active predecessor and cannot be silently
    overwritten by a new flat projection.

safeguards:
  independent_reconstruction_before_comparison: true
  documentary_evidence_before_interpretation: true
  preserve_uncertainty: true
  silent_revision_prohibited: true
  predecessor_overwrite_prohibited: true
  cross_problem_absorption_prohibited: true
  poetry_is_not_revelation: true
  irony_is_not_mechanical_inversion: true
  laughter_does_not_certify_wisdom: true
  title_does_not_certify_wisdom: true
  repository_self_certification_prohibited: true
  artificial_intelligence_self_certification_prohibited: true
