schema_version: 1.0
record_type: strauss_operational_manifest

identity:
  id: STRAUSS-MANIFEST-001
  repository: izzy9118-blip/Strauss
  minister_id: leo-strauss
  title: Minister of Political Philosophy
  version: 0.6.0

status:
  lifecycle: ADDITIVE_OPERATIONAL_INTERFACE
  structural_validation: REQUIRED_ON_EACH_CHANGE
  semantic_completion: INCOMPLETE
  doctrinal_certification: NOT_CERTIFIED
  runtime_readiness: LIMITED_READ_ONLY_CONTEXT_AND_CANDIDATE_REPORT_SUPPORT
  activation: AVAILABLE_FOR_VALIDATED_LIMITED_ADAPTER_USE
  constitutional_effect: NONE_ON_EXISTING_PROBLEM_MIGRATION
  governing_notice: >
    A resolved path, valid YAML document, passing loader, complete current-state index,
    or successful test does not establish substantive completeness, doctrinal truth,
    claimant rank, migration certification, or readiness for unrestricted ministerial reasoning.

revision_history:
  predecessor_version: 0.5.0
  predecessor_blob_sha: 45f9656b190b456d3ccdf16290e3ffa96de969d2
  reason: >
    Register a typed corpus registry exhaustive for the repository's current committed
    source and study state. Preserve the corpus as open and materially incomplete,
    source-text admission as separate, independent witnesses as incomplete, and all
    doctrinal, migration, activation, and Assembly authority as unauthorized.

purpose: >
  Provide one compact, machine-readable entry point through which a runtime can load
  the Strauss repository's problems, hermeneutics, method, speech discipline, corpus
  registry, and findings index without deleting, overwriting, or silently harmonizing
  the repository records from which the interface is derived.

audit:
  path: audits/operational-completeness.yaml
  version: 1.4.0
  classification_vocabulary:
    - SUBSTANTIVELY_RECONSTRUCTED
    - PARTIALLY_RECONSTRUCTED
    - MAPPED_TO_RICHER_RECORDS
    - STRUCTURAL_PLACEHOLDER
    - EMPTY_OR_UNIMPLEMENTED
  repinning_rule: >
    Sanctum must pin a new Strauss commit only after the revised interface passes its
    declared structural and behavioral validation. A new pin does not constitute
    doctrinal certification.

component_completion:
  manifest: PARTIALLY_RECONSTRUCTED
  adapter: PARTIALLY_RECONSTRUCTED
  problem_bundle_loader: PARTIALLY_RECONSTRUCTED_READ_ONLY_BUNDLE_SUPPORT
  corpus_registry_loader: SUBSTANTIVELY_RECONSTRUCTED_CURRENT_STATE_EXHAUSTIVE_OPEN_CORPUS
  speech_mechanism: PARTIALLY_RECONSTRUCTED
  hermeneutics: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE
  method: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE
  problem_objects: SUBSTANTIVE_BUNDLES_RUNTIME_LOADED_SOURCE_APPLICATION_AND_MIGRATION_INCOMPLETE
  corpus_index: SUBSTANTIVELY_RECONSTRUCTED_CURRENT_STATE_EXHAUSTIVE_OPEN_CORPUS
  findings_index: MAPPED_TO_RICHER_RECORDS
  migration_mapping: SUBSTANTIVELY_RECONSTRUCTED
  behavioral_tests: SPEECH_HERMENEUTIC_METHOD_PROBLEM_BUNDLE_AND_CORPUS_CONTRACTS_VALIDATED_SOURCE_FIXTURES_INCOMPLETE

source_hierarchy:
  tiers:
    - primary_external
    - primary_contemporaneous
    - secondary_about_own_primary_acts
    - secondary_interpretive
  rule: >
    Primary sources govern secondary sources where primary sources are available.
    Source type, edition, translation, editorial condition, and documentary limits
    remain explicit in every source-specific reconstruction.

proposition_kinds:
  - documented_finding
  - supported_inference
  - working_hypothesis
  - comparative_question
  - unresolved_uncertainty

load_order:
  - method
  - hermeneutics
  - problems
  - speech
  - corpus
  - findings

