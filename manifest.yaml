  limitation: >
    Proposition-level normalization, source-asymmetry repair, independent witness expansion,
    doctrinal certification, migration certification, and successor activation remain incomplete.

runtime:
  adapter: adapter.py
  problem_bundle_loader: problem_bundles.py
  corpus_registry_loader: corpus_registry.py
  findings_registry_loader: findings_registry.py
  validation_command: python adapter.py --validate
  problem_bundle_validation_command: python problem_bundles.py --validate
  corpus_registry_validation_command: python corpus_registry.py --validate
  findings_registry_validation_command: python findings_registry.py --validate
  test_command: python -m unittest discover -s tests -p 'test_*.py'
  permitted_operations:
    - validate declared paths and substantive contracts
    - load bounded operational context
    - load complete read-only foundational problem bundles
    - load typed current-state corpus and findings registries
    - validate reviewed-witness metadata, locators, study bindings, derivations, and jurisdiction
    - validate typed speech requests
    - build non-authoritative candidate report structures
  prohibited_operations:
    - admit or distribute source texts through a registry
    - allow a local filename to override title-page or copyright-page evidence
    - treat OCR as authoritative where page images disagree or remain unclear
    - treat source-study completion as independent corroboration
    - promote a finding beyond its record-local evidence status
    - certify doctrine, wisdom, witnesses, findings, or migration
    - activate successor problems or displace active predecessors
    - rewrite source findings or confer Assembly authority

sanctum_contract:
  assembly_repository: izzy9118-blip/Sanctum
  registry_path: registry/ministers.yaml
  participation: universal
  outside_my_ground_permitted: true
  completed_interface_repin_status: BLOCKED_WHILE_SEMANTIC_COMPLETION_IS_INCOMPLETE
  output_rule: >
    The adapter emits candidate context and reports. Git remains authoritative memory, and
    Sanctum's Validation Gate alone may confer Assembly-level authority. No pin may describe
    this interface as completed while semantic_completion is INCOMPLETE.

migration:
  mapping_record: migrations/lean-operational-interface.yaml
  mode: ADDITIVE_NON_DESTRUCTIVE
  flat_problem_projection_deferred: true
  reason: >
    Explicit mappings preserve predecessors, successor directories, studies, protocols,
    governance records, transaction ledgers, and historical copies. The active predecessor
    at problems/theologico-political.yaml may not be overwritten silently.

safeguards:
  independent_reconstruction_before_comparison: true
  documentary_evidence_before_interpretation: true
  preserve_uncertainty: true
  silent_revision_prohibited: true
  predecessor_overwrite_prohibited: true
  cross_problem_absorption_prohibited: true
  poetry_is_not_revelation: true
  irony_is_not_mechanical_inversion: true
  laughter_does_not_certify_wisdom: true
  title_does_not_certify_wisdom: true
  repository_self_certification_prohibited: true
  artificial_intelligence_self_certification_prohibited: true
