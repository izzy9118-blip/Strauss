name: Repair CORPUS-SRC-102 integration

on:
  push:
    branches:
      - production/corpus-src-102-sequential-reconstruction
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Repair CORPUS-SRC-102 integration validation')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'production/corpus-src-102-sequential-reconstruction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/corpus-src-102-sequential-reconstruction
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install pyyaml jsonschema
      - name: Apply bounded forward corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "corpus_registry.py",
              'if study_record.get("termination", {}).get("successor_effect") != "NONE":',
              'if study_record.get("termination", {}).get("successor_effect") not in (None, "NONE"):',
          )

          witness_test = "tests/test_corpus_wit_102_platform_registration.py"
          replace(
              witness_test,
              "def test_registration_does_not_complete_study_or_certify(self) -> None:",
              "def test_historical_registration_remains_noncertifying_after_forward_study(self) -> None:",
          )
          replace(witness_test, '"NOT_YET_COMPLETED",', '"SPINOZA-PREFACE-STUDY-001",')
          replace(witness_test, '"INCOMPLETE_3_OF_19",', '"INCOMPLETE_4_OF_19",')

          talmon_test = "tests/test_pr21_talmon_completion.py"
          replacements = {
              'self.assertEqual(manifest["identity"]["version"], "1.5.0")': 'self.assertEqual(manifest["identity"]["version"], "1.6.0")',
              'self.assertEqual(audit["identity"]["version"], "2.3.0")': 'self.assertEqual(audit["identity"]["version"], "2.4.0")',
              'self.assertEqual(mapping["identity"]["version"], "1.5.0")': 'self.assertEqual(mapping["identity"]["version"], "1.6.0")',
              'self.assertEqual(process["identity"]["version"], "1.7.0")': 'self.assertEqual(process["identity"]["version"], "1.8.0")',
              'self.assertEqual(schedule["identity"]["version"], "1.5.0")': 'self.assertEqual(schedule["identity"]["version"], "1.6.0")',
              'self.assertEqual(corpus["identity"]["version"], "1.9.0")': 'self.assertEqual(corpus["identity"]["version"], "1.10.0")',
              'self.assertEqual(findings["identity"]["version"], "1.3.0")': 'self.assertEqual(findings["identity"]["version"], "1.4.0")',
              'self.assertEqual(state["independent_sequential_study_count"], 3)': 'self.assertEqual(state["independent_sequential_study_count"], 4)',
              '["COHEN-STUDY-001", "JA-STUDY-001", "TALMON-STUDY-001"],': '["COHEN-STUDY-001", "JA-STUDY-001", "TALMON-STUDY-001", "SPINOZA-PREFACE-STUDY-001"],',
          }
          for old, new in replacements.items():
              replace(talmon_test, old, new)

          study_path = Path(
              "studies/theologico-political/preface-to-spinozas-critique-of-religion/sequential-reconstruction.yaml"
          )
          study_text = study_path.read_text(encoding="utf-8")
          study_text, count = re.subn(
              r"Reason can decisively exclude revelation only through a demonstrated comprehensive account\s+of the whole",
              "Reason can decisively exclude revelation only through a clear and exhaustive account of the whole",
              study_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("expected permanent-finding wording was not found")
          study_path.write_text(study_text, encoding="utf-8")

          for transient in (
              "materialization-validation.log",
              "materialization-validation.status",
              ".github/workflows/materialize-spinoza-preface.yml",
          ):
              Path(transient).unlink(missing_ok=True)
          PY
      - name: Validate complete repository interface
        run: |
          python adapter.py --validate
          python problem_bundles.py --validate
          python corpus_registry.py --validate
          python findings_registry.py --validate
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit validated production unit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate CORPUS-SRC-102 sequential reconstruction'
          git push origin HEAD:production/corpus-src-102-sequential-reconstruction
