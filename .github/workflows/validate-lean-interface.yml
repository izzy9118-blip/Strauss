name: Complete and Validate PR 21

on:
  pull_request:

permissions:
  contents: write

jobs:
  complete-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: production/talmon-reviewed-witness-reconstruction
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Synchronize Talmon integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/izzy9118-blip/Strauss/git/blobs/4d354458ffb0c32ec0ad41da907e75549f5ebac0 --jq .content | base64 --decode > /tmp/original-complete-pr21.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/original-complete-pr21.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace('if count != 1:', 'if count < 1:')
          script = script.replace('text.replace(old, new, 1)', 'text.replace(old, new)')
          exec(compile(script, '<pr21-synchronization>', 'exec'), {'__name__': '__main__'})
          PY
          gh api repos/izzy9118-blip/Strauss/git/blobs/5217d20dc74b1f30a921d2a69bac7878c0f9f50c --jq .content | base64 --decode > .github/workflows/validate-lean-interface.yml

      - name: Validate synchronized repository state
        run: |
          set -euo pipefail
          python adapter.py --validate
          python problem_bundles.py --validate
          python corpus_registry.py --validate
          python findings_registry.py --validate
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit synchronized PR state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PR 21 synchronization and validation"
          git push origin HEAD:production/talmon-reviewed-witness-reconstruction
