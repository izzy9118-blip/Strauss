name: Validate Lean Strauss Interface

on:
  push:
    branches:
      - main
    paths:
      - "manifest.yaml"
      - "adapter.py"
      - "hermeneutics/**"
      - "method/**"
      - "speech/**"
      - "corpus/**"
      - "findings/**"
      - "migrations/lean-operational-interface.yaml"
      - "tests/**"
      - ".github/workflows/validate-lean-interface.yml"
  pull_request:
    paths:
      - "manifest.yaml"
      - "adapter.py"
      - "hermeneutics/**"
      - "method/**"
      - "speech/**"
      - "corpus/**"
      - "findings/**"
      - "migrations/lean-operational-interface.yaml"
      - "tests/**"
      - ".github/workflows/validate-lean-interface.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate manifest and mapped paths
        run: python adapter.py --validate

      - name: Run adapter tests
        run: python -m unittest discover -s tests -p 'test_*.py'
