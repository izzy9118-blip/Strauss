name: Validate Lean Strauss Interface

on:
  push:
    branches:
      - main
    paths:
      - "manifest.yaml"
      - "adapter.py"
      - "problem_bundles.py"
      - "corpus_registry.py"
      - "findings_registry.py"
      - "audits/**"
      - "problems/**"
      - "studies/**"
      - "hermeneutics/**"
      - "method/**"
      - "speech/**"
      - "corpus/**"
      - "findings/**"
      - "migrations/lean-operational-interface.yaml"
      - "tests/**"
      - ".github/workflows/validate-lean-interface.yml"
  pull_request:
    paths:
      - "manifest.yaml"
      - "adapter.py"
      - "problem_bundles.py"
      - "corpus_registry.py"
      - "findings_registry.py"
      - "audits/**"
      - "problems/**"
      - "studies/**"
      - "hermeneutics/**"
      - "method/**"
      - "speech/**"
      - "corpus/**"
      - "findings/**"
      - "migrations/lean-operational-interface.yaml"
      - "tests/**"
      - ".github/workflows/validate-lean-interface.yml"

permissions:
  contents: write

jobs:
  materialize-src103:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'corpus-src-103-reviewed-witness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out CORPUS-SRC-103 branch
        uses: actions/checkout@v4
        with:
          ref: corpus-src-103-reviewed-witness
          fetch-depth: 0
      - id: pending
        shell: bash
        run: |
          if [ -f history/staging/register-src103.py.gz.b64 ]; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pending.outputs.value == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.pending.outputs.value == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruamel.yaml==0.18.10
      - if: steps.pending.outputs.value == 'true'
        name: Materialize and validate CORPUS-SRC-103
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode history/staging/register-src103.py.gz.b64 | gzip --decompress > /tmp/register_src103_witness.py
          sed -i 's#ROOT = Path(__file__).resolve().parents\[1\]#ROOT = Path.cwd()#g' /tmp/register_src103_witness.py
          python /tmp/register_src103_witness.py
          rm -f .github/workflows/trigger-corpus-src-103.yml
          rm -f .github/workflows/corpus-src-103-materialize.yml
          rm -f history/staging/register-src103.py.gz.b64
          rm -f tests/test_src103_materialization_trigger.py
          python adapter.py --validate
          python problem_bundles.py --validate
          python corpus_registry.py --validate
          python findings_registry.py --validate
          python -m unittest discover -s tests -p 'test_*.py'
      - if: steps.pending.outputs.value == 'true'
        name: Commit materialized registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register reviewed witness for CORPUS-SRC-103"
          git push origin HEAD:corpus-src-103-reviewed-witness

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate manifest, audit, paths, and speech contract
        run: |
          set -o pipefail
          python adapter.py --validate 2>&1 | tee lean-validation.txt

      - name: Validate complete foundational problem bundles
        run: |
          set -o pipefail
          python problem_bundles.py --validate 2>&1 | tee problem-bundle-validation.txt

      - name: Validate typed corpus registry
        run: |
          set -o pipefail
          python corpus_registry.py --validate 2>&1 | tee corpus-registry-validation.txt

      - name: Validate typed findings registry
        run: |
          set -o pipefail
          python findings_registry.py --validate 2>&1 | tee findings-registry-validation.txt

      - name: Run structural and behavioral interface tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee lean-tests.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-strauss-interface-diagnostics
          path: |
            lean-validation.txt
            problem-bundle-validation.txt
            corpus-registry-validation.txt
            findings-registry-validation.txt
            lean-tests.txt
          if-no-files-found: ignore
