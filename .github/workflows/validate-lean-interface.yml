name: Validate Lean Strauss Interface

on:
  push:
    branches:
      - main
    paths:
      - "manifest.yaml"
      - "adapter.py"
      - "problem_bundles.py"
      - "corpus_registry.py"
      - "findings_registry.py"
      - "audits/**"
      - "problems/**"
      - "studies/**"
      - "hermeneutics/**"
      - "method/**"
      - "speech/**"
      - "corpus/**"
      - "findings/**"
      - "migrations/lean-operational-interface.yaml"
      - "tests/**"
      - ".github/workflows/validate-lean-interface.yml"
  pull_request:
    paths:
      - "manifest.yaml"
      - "adapter.py"
      - "problem_bundles.py"
      - "corpus_registry.py"
      - "findings_registry.py"
      - "audits/**"
      - "problems/**"
      - "studies/**"
      - "hermeneutics/**"
      - "method/**"
      - "speech/**"
      - "corpus/**"
      - "findings/**"
      - "migrations/lean-operational-interface.yaml"
      - "tests/**"
      - ".github/workflows/validate-lean-interface.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Materialize SRC103 integration
        if: github.event_name == 'pull_request' && github.head_ref == 'study-src103-spinoza-treatise'
        run: |
          python scripts/materialize_src103_integration.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add corpus/index.yaml findings/index.yaml corpus_registry.py findings_registry.py manifest.yaml audits/operational-completeness.yaml migrations/lean-operational-interface.yaml history/production-plans/2026-07-27-ten-step-completion-process.yaml history/production-plans/2026-07-27-theologico-political-reviewed-witness-priority.yaml
            git commit -m "Integrate CORPUS-SRC-103 into typed registries"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Validate manifest, audit, paths, and speech contract
        run: |
          set -o pipefail
          python adapter.py --validate 2>&1 | tee lean-validation.txt

      - name: Validate complete foundational problem bundles
        run: |
          set -o pipefail
          python problem_bundles.py --validate 2>&1 | tee problem-bundle-validation.txt

      - name: Validate typed corpus registry
        run: |
          set -o pipefail
          python corpus_registry.py --validate 2>&1 | tee corpus-registry-validation.txt

      - name: Validate typed findings registry
        run: |
          set -o pipefail
          python findings_registry.py --validate 2>&1 | tee findings-registry-validation.txt

      - name: Run structural and behavioral interface tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee lean-tests.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-strauss-interface-diagnostics
          path: |
            lean-validation.txt
            problem-bundle-validation.txt
            corpus-registry-validation.txt
            findings-registry-validation.txt
            lean-tests.txt
          if-no-files-found: ignore
