name: Diagnose CORPUS-WIT-102 Registration

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/corpus-wit-102-platform-registration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruamel.yaml==0.18.10

      - name: Execute and capture failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api repos/izzy9118-blip/Strauss/git/blobs/c20ae414e22ebca4c0ed29e9f2e8778b08176f8b --jq .content | base64 --decode > /tmp/register-corpus-wit-102.yml
          python - <<'PY' > /tmp/corpus-wit-102-diagnostic.txt 2>&1
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/register-corpus-wit-102.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<corpus-wit-102-registration>', 'exec'), {'__name__': '__main__'})
          PY
          code=$?
          echo "exit_code=$code" >> /tmp/corpus-wit-102-diagnostic.txt
          git reset --hard HEAD
          rm -f .github/workflows/register-corpus-wit-102.yml
          rm -f .github/workflows/execute-corpus-wit-102-registration.yml
          rm -f .github/workflows/diagnose-corpus-wit-102-registration.yml
          mkdir -p history/validation
          cp /tmp/corpus-wit-102-diagnostic.txt history/validation/corpus-wit-102-synchronization-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record CORPUS-WIT-102 synchronization diagnostic"
          git push origin HEAD:production/corpus-wit-102-platform-registration
