name: Apply findings validator revision

on:
  push:
    branches:
      - validate/inquiry-0001
    paths:
      - tools/apply_findings_validator_revision.py
      - .github/workflows/apply-findings-validator-revision.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/inquiry-0001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply forward validator revision
        run: python tools/apply_findings_validator_revision.py
      - name: Commit revised validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findings_registry.py tools/apply_findings_validator_revision.py .github/workflows/apply-findings-validator-revision.yml
          git commit -m "Advance findings validator to registry 1.17.0 and account for FINDSET-158"
          git push origin HEAD:validate/inquiry-0001
