name: Apply final Inquiry 0001 test fixes

on:
  push:
    branches:
      - validate/inquiry-0001
    paths:
      - tools/apply_final_inquiry0001_test_fixes.py
      - .github/workflows/apply-final-inquiry0001-test-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/inquiry-0001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final forward corrections
        run: python tools/apply_final_inquiry0001_test_fixes.py
      - name: Commit corrected expectations and mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/lean-operational-interface.yaml tests/test_corpus_registry.py tests/test_corpus_wit_103_registration.py tools/apply_final_inquiry0001_test_fixes.py .github/workflows/apply-final-inquiry0001-test-fixes.yml
          git commit -m "Align mapping and witness-history tests with the repaired Inquiry 0001 state"
          git push origin HEAD:validate/inquiry-0001
