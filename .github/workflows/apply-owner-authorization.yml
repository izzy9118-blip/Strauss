name: Apply Strauss Owner Authorization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_owner_authorization.py"
      - ".github/workflows/apply-owner-authorization.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/authorization-trigger.txt"

permissions:
  contents: write

jobs:
  authorize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.6 PyYAML==6.0.2

      - name: Apply owner certification and authorization
        run: python scripts/apply_owner_authorization.py

      - name: Validate authorized repository state
        run: |
          python adapter.py --validate
          python problem_bundles.py --validate
          python corpus_registry.py --validate
          python findings_registry.py --validate
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Remove one-shot materializer
        run: |
          rm -f scripts/apply_owner_authorization.py
          rm -f .github/workflows/apply-owner-authorization.yml

      - name: Commit authorized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Certify and authorize Strauss repository state"
          git push origin HEAD:main
