name: Normalize Strauss Owner Authorization

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/authorization-normalize-trigger.txt"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.6 PyYAML==6.0.2
      - name: Normalize authorization semantics
        run: python scripts/normalize_owner_authorization_state.py
      - name: Validate normalized state
        run: |
          python adapter.py --validate
          python problem_bundles.py --validate
          python corpus_registry.py --validate
          python findings_registry.py --validate
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Remove one-shot normalization artifacts
        run: |
          rm -f scripts/normalize_owner_authorization_state.py
          rm -f .github/workflows/normalize-owner-authorization.yml
      - name: Commit normalized authorized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize owner-authorized operational state"
          git push origin HEAD:main
