name: Materialize CORPUS-SRC-103 Reviewed Witness

on:
  push:
    branches:
      - corpus-src-103-reviewed-witness
    paths:
      - ".github/workflows/register-corpus-src-103.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: corpus-src-103-reviewed-witness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruamel.yaml==0.18.10

      - name: Materialize registration
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/register-src103.py.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/register-src103.py.gz.b64 | gzip --decompress > /tmp/register_src103_witness.py
          python /tmp/register_src103_witness.py

      - name: Remove temporary production workflow
        run: rm -f .github/workflows/register-corpus-src-103.yml

      - name: Validate bounded registration
        shell: bash
        run: |
          set -euo pipefail
          python adapter.py --validate
          python problem_bundles.py --validate
          python corpus_registry.py --validate
          python findings_registry.py --validate
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit registered witness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register reviewed witness for CORPUS-SRC-103"
          git push origin HEAD:corpus-src-103-reviewed-witness
