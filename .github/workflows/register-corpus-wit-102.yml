                      "certified migration, successor activation, predecessor displacement, or completed-interface readiness."
                  ),
              },
              "next_subunit": {
                  "title": "Preface to Spinoza's Critique of Religion independent sequential reconstruction",
                  "source_id": "CORPUS-SRC-102",
                  "first_action": (
                      "Read printed pages 137-180 in textual order, distinguishing autobiography, historical narrative, reported "
                      "positions, editorial layers, and philosophic argument before comparison with the active predecessor."
