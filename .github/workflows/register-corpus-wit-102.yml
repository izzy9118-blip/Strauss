name: Register CORPUS-WIT-102

on:
  push:
    branches:
      - production/corpus-wit-102-platform-registration
    paths:
      - ".github/workflows/register-corpus-wit-102.yml"

permissions:
  contents: write

jobs:
  register-and-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: production/corpus-wit-102-platform-registration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruamel.yaml==0.18.10

      - name: Synchronize qualified platform-reference witness state
        run: |
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML

          ROOT = Path.cwd()
          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 120
          yaml.indent(mapping=2, sequence=4, offset=2)

          def load(path: str):
              with (ROOT / path).open(encoding="utf-8") as handle:
                  return yaml.load(handle)

          def save(path: str, data) -> None:
              with (ROOT / path).open("w", encoding="utf-8") as handle:
                  yaml.dump(data, handle)

          def by_id(items, field, value):
              return next(item for item in items if item.get(field) == value)

          # Typed corpus registry forward revision.
          corpus_path = "corpus/index.yaml"
          corpus = load(corpus_path)
          corpus["identity"]["version"] = "1.9.0"
          corpus["revision_history"] = {
              "predecessor_version": "1.8.0",
              "predecessor_blob_sha": "c86d617e43f63fd3338e58e9ac4fbb8bed8017a5",
              "transformation": "SUBSTANTIVE_FORWARD_REVISION",
              "reason": (
                  "Register CORPUS-WIT-102 as a qualified platform-reference witness for the complete "
                  "1997 SUNY collected item. Preserve absent byte custody, unavailable SHA256 and file size, "
                  "pending PDF-page offset and 1965/1968 edition comparisons, incomplete sequential study, "
                  "noncertification, predecessor authority, and no successor effect."
              ),
          }
          source_102 = by_id(corpus["source_entities"], "source_id", "CORPUS-SRC-102")
          source_102.clear()
          source_102.update({
              "source_id": "CORPUS-SRC-102",
              "creator": "Leo Strauss",
              "canonical_title": "Preface to Spinoza's Critique of Religion",
              "canonical_aliases": ["Autobiographical Preface to Spinoza's Critique of Religion"],
              "date": 1965,
              "entity_type": "REGISTERED_STRAUSS_WRITING",
              "registration_basis": "problems/theologico-political.yaml#documentary_source_basis.sources[2]",
              "source_status_record": "CORPUS-STATUS-102",
              "reviewed_witnesses": ["CORPUS-WIT-102"],
              "item_level_source_status": "REVIEWED_ITEM_WITNESS_REGISTERED_STUDY_PENDING",
              "study_status": "INDEPENDENT_SEQUENTIAL_RECONSTRUCTION_REQUIRED",
              "problem_bindings": ["theologico-political", "athens-vs-jerusalem", "ancients-vs-moderns"],
              "limits": [
                  "reviewed witness is a qualified ChatGPT File Library platform reference, not repository-custodied bytes",
                  "platform object identity is not a cryptographic fingerprint",
                  "reviewed text is the 1997 SUNY editorial composite, not a separately reviewed 1965 or 1968 printing",
                  "CORPUS-WIT-102 does not complete independent sequential reconstruction or corroboration",
              ],
          })
          witnesses = corpus["reviewed_witnesses"]
          witnesses[:] = [item for item in witnesses if item.get("witness_id") != "CORPUS-WIT-102"]
          insertion_index = next(i for i, item in enumerate(witnesses) if item.get("witness_id") == "CORPUS-WIT-105")
          witnesses.insert(insertion_index, {
              "witness_id": "CORPUS-WIT-102",
              "source_id": "CORPUS-SRC-102",
              "witness_type": "ITEM_WITHIN_PLATFORM_REFERENCE_SEARCHABLE_PDF_WITH_PAGE_IMAGES",
              "witness_class": "PLATFORM_REFERENCE_WITNESS",
              "container_title": "Jewish Philosophy and the Crisis of Modernity",
              "container_editor": "Kenneth Hart Green",
              "publisher": "State University of New York Press",
              "publication_year": 1997,
              "platform_name": "ChatGPT File Library",
              "platform_object_identifier": "file_0000000073c081fd9fb65f9ea7552cde",
              "displayed_filename": "jewish-philosophy-and-the-crisis-of-modernity-essays-and-lectures-in-modern-jewish-thought_compress.pdf",
              "access_date": "2026-07-27",
              "platform_page_count": 525,
              "printed_page_range": {"start": 137, "end": 180},
              "pdf_page_range_one_based": "PENDING_DIRECT_OFFSET_VERIFICATION",
              "source_status_path": "studies/theologico-political/preface-to-spinozas-critique-of-religion/source-status.yaml",
              "witness_record_path": "studies/theologico-political/preface-to-spinozas-critique-of-religion/reviewed-witness.yaml",
              "searchable_text": True,
              "page_images_available": True,
              "wording_rule": "PAGE_IMAGES_GOVERN_WHERE_EXTRACTED_TEXT_IS_UNCERTAIN_OR_CONFLICTS",
              "repository_copy_status": "NOT_DISTRIBUTED_BY_ITEM_REGISTRY",
              "byte_custody_state": "NOT_EXPOSED_TO_REPOSITORY",
              "sha256_state": "UNAVAILABLE_WITH_REASON_PRESERVED",
              "file_size_state": "NOT_AVAILABLE",
              "original_1965_edition_comparison": "PENDING",
              "authorial_1968_reprint_comparison": "PENDING",
          })
          status_102 = by_id(corpus["source_status_records"], "status_id", "CORPUS-STATUS-102")
          status_102["completion"] = "REVIEWED_ITEM_WITNESS_REGISTERED_STUDY_PENDING"
          coverage = corpus["coverage"]
          coverage["reviewed_witnesses_registered"] = 7
          coverage["theologico_political_reviewed_item_witnesses_registered"] = 4
          coverage["theologico_political_independent_item_studies_registered"] = 3
          coverage["current_studies_tree_yaml_records_accounted_for"] = 35
          gap = by_id(corpus["corpus_gaps"], "gap_id", "CORPUS-GAP-003")
          gap["statement"] = (
              "All nineteen predecessor writings have bounded source identities; Jerusalem and Athens, the Hermann Cohen "
              "introductory essay, and the Talmon review have reviewed witnesses and complete provisional sequential studies; "
              "the Preface to Spinoza's Critique of Religion has a qualified platform-reference witness with its sequential study "
              "pending; the other fifteen lack reviewed item witnesses and sixteen total writings lack independent item studies."
          )
          corpus["validation_rules"] = [
              rule.replace(
                  "CORPUS-SRC-105, CORPUS-SRC-109, and CORPUS-SRC-111 alone record complete provisional independent item studies in this sequence; the other sixteen remain incomplete",
                  "CORPUS-SRC-102 records a qualified witness with study pending; CORPUS-SRC-105, CORPUS-SRC-109, and CORPUS-SRC-111 alone record complete provisional independent item studies; the other fifteen lack witnesses and sixteen total studies remain incomplete",
              ) if isinstance(rule, str) else rule
              for rule in corpus["validation_rules"]
          ]
          termination = corpus["termination"]
          termination["theologico_political_reviewed_witness_state"] = "INCOMPLETE_4_OF_19"
          termination["theologico_political_independent_study_state"] = "INCOMPLETE_3_OF_19"
          termination["next_required_units"] = [
              "conduct the independent sequential reconstruction of CORPUS-SRC-102 from printed pages 137-180",
              "compare the 1997 collected composite with the original 1965 and authorial 1968 versions where required",
              "compare the reviewed 1983 Jerusalem and Athens reprint with the original 1967 printing where required",
              "compare the reviewed 1983 Hermann Cohen essay reprint with the original 1972 printing where required",
              "compare the reviewed 1983 Talmon review reprint with the original 1957 journal printing where required",
              "acquire and register reviewed witnesses for the remaining fifteen item identities",
              "conduct independent sequential reconstruction for the remaining sixteen writings",
              "acquire and reconstruct Talmon's reviewed work",
              "expand independent Aristophanes, Plato, Xenophon, biblical, medieval, Spinozist, Cohenian, Kantian, Talmonian, and modern witness studies",
              "preserve all later additions through forward registry revision",
          ]
          save(corpus_path, corpus)

          # Manifest forward revision.
          manifest = load("manifest.yaml")
          manifest["identity"]["version"] = "1.5.0"
          manifest["revision_history"] = {
              "predecessor_version": "1.4.0",
              "predecessor_blob_sha": "6364c1e8cf85a087f514cbb00ce9159eeba50f0e",
              "reason": (
                  "Register CORPUS-WIT-102 as a qualified platform-reference witness and synchronize corpus registry v1.9.0 "
                  "while preserving incomplete sequential reconstruction, missing byte identity, pending edition comparisons, "
                  "fifteen missing item witnesses, sixteen missing item studies, noncertification, and the Sanctum repin block."
              ),
          }
          manifest["audit"]["version"] = "2.3.0"
          manifest["component_completion"]["reviewed_source_witnesses"] = "SEVEN_REVIEWED_WITNESSES_INCLUDING_QUALIFIED_PLATFORM_REFERENCE_CORPUS_WIT_102_WITH_RECORDED_LIMITS"
          manifest["component_completion"]["theologico_political_item_level_source_statuses"] = "19_OF_19_IDENTITIES_4_OF_19_REVIEWED_ITEM_WITNESSES_3_OF_19_COMPLETE_PROVISIONAL_ITEM_STUDIES"
          manifest["component_completion"]["behavioral_tests"] = "SPEECH_HERMENEUTIC_METHOD_PROBLEM_BUNDLE_CORPUS_FINDINGS_AND_PLATFORM_REFERENCE_WITNESS_CONTRACTS_REQUIRE_VALIDATION"
          manifest["corpus"]["registry_version"] = "1.9.0"
          reviewed = manifest["corpus"]["reviewed_witnesses"]
          reviewed[:] = [item for item in reviewed if item.get("witness_id") != "CORPUS-WIT-102"]
          reviewed.insert(3, {
              "source": "Preface to Spinoza's Critique of Religion",
              "witness_id": "CORPUS-WIT-102",
              "witness_class": "PLATFORM_REFERENCE_WITNESS",
              "platform_object_identifier": "file_0000000073c081fd9fb65f9ea7552cde",
              "printed_pages": "137-180",
              "pdf_pages_one_based": "PENDING_DIRECT_OFFSET_VERIFICATION",
              "item_status": "studies/theologico-political/preface-to-spinozas-critique-of-religion/source-status.yaml",
          })
          mstate = manifest["corpus"]["theologico_political_item_level_statuses"]
          mstate["reviewed_witness_count"] = 4
          mstate["remaining_without_reviewed_item_witness"] = 15
          mstate["independent_sequential_study_count"] = 3
          mstate["remaining_without_independent_sequential_study"] = 16
          mstate["rule"] = (
              "Four reviewed item witnesses include one qualified platform-reference witness; three complete provisional "
              "source studies are not independent corroboration, doctrinal certification, migration completion, successor "
              "activation, or repository completion."
          )
          manifest["corpus"]["limitation"] = (
              "All nineteen predecessor writings have bounded identities. Four have reviewed item witnesses, but CORPUS-SRC-102 "
              "still lacks its independent sequential reconstruction; only Jerusalem and Athens, the Hermann Cohen introductory "
              "essay, and the Talmon review have complete provisional item studies. Byte custody, original-edition comparisons, "
              "independent witnesses, and source-text access remain incomplete."
          )
          save("manifest.yaml", manifest)

          # Operational audit forward revision.
          audit = load("audits/operational-completeness.yaml")
          audit["identity"]["version"] = "2.3.0"
          audit["revision_history"] = {
              "predecessor_version": "2.2.0",
              "predecessor_blob_sha": "c5d7375332c4a786a215e8ecc250250e8100c8ba",
              "reason": (
                  "Record CORPUS-WIT-102 as a qualified platform-reference witness. Preserve absent byte custody, pending "
                  "sequential reconstruction and edition comparisons, fifteen missing item witnesses, sixteen missing item "
                  "studies, noncertification, predecessor authority, and the completed-interface Sanctum repin block."
              ),
          }
          audit["basis"]["prior_validated_interface_commit"] = "83c5106766fc7b048664c586eb46f925eb3cb04e"
          audit["basis"]["current_revision_scope"] = "production/corpus-wit-102-platform-registration"
          units = audit["summary"]["completed_operational_units"]
          units[:] = [u for u in units if not (isinstance(u, str) and u.startswith("six reviewed witnesses"))]
          units.insert(7, "seven reviewed witnesses, including qualified platform-reference CORPUS-WIT-102")
          astate = audit["summary"]["theologico_political_item_level_status"]
          astate["reviewed_item_witness_count"] = 4
          astate["registered_without_reviewed_witness_count"] = 15
          astate["independently_reconstructed_count_within_this_sequence"] = 3
          astate["remaining_without_independent_sequential_study"] = 16
          astate["registered_witness_source_ids"] = ["CORPUS-SRC-102", "CORPUS-SRC-105", "CORPUS-SRC-109", "CORPUS-SRC-111"]
          astate["registered_witness_ids"] = ["CORPUS-WIT-102", "CORPUS-WIT-105", "CORPUS-WIT-109", "CORPUS-WIT-111"]
          deficiencies = audit["summary"]["remaining_major_deficiencies"]
          audit["summary"]["remaining_major_deficiencies"] = [
              "fifteen Theologico-Political item identities lack reviewed item witnesses",
              "sixteen Theologico-Political writings lack independent sequential item studies, including CORPUS-SRC-102",
              "the exact CORPUS-WIT-102 bytes, SHA256, file size, and PDF-page offset are unavailable to the repository",
              "the 1965 and 1968 Preface textual states have not been separately compared with the 1997 composite",
          ] + [item for item in deficiencies if not (isinstance(item, str) and item.startswith(("sixteen Theologico-Political item identities", "sixteen Theologico-Political writings")))]
          records = audit["records"]
          records[:] = [item for item in records if item.get("path") not in {
              "studies/theologico-political/preface-to-spinozas-critique-of-religion/reviewed-witness.yaml",
              "studies/theologico-political/preface-to-spinozas-critique-of-religion/source-status.yaml",
          }]
          corpus_index = next(i for i, item in enumerate(records) if item.get("path") == "corpus/index.yaml")
          records[corpus_index:corpus_index] = [
              {
                  "path": "studies/theologico-political/preface-to-spinozas-critique-of-religion/reviewed-witness.yaml",
                  "classification": "SUBSTANTIVELY_RECONSTRUCTED",
                  "identity": "CORPUS-WIT-102",
                  "present_function": [
                      "registers the complete 1997 SUNY collected item through a controlled platform reference",
                      "records printed pages 137-180, platform object identity, searchable text, and page-image authority",
                      "preserves missing byte custody, digest, file size, and exact PDF-page offset",
                      "distinguishes the editorial composite from separately reviewed 1965 and 1968 versions",
                  ],
                  "remaining": [
                      "complete independent sequential reconstruction",
                      "1965 and 1968 edition comparison",
                      "later forward materialization and fingerprinting if exact bytes become accessible",
                  ],
              },
              {
                  "path": "studies/theologico-political/preface-to-spinozas-critique-of-religion/source-status.yaml",
                  "classification": "PARTIALLY_RECONSTRUCTED",
                  "present_function": [
                      "registers CORPUS-WIT-102 separately from source identity and future study",
                      "preserves active-predecessor contribution as untested at source level",
                      "records platform-reference qualification and all noncertification limits",
                  ],
                  "remaining": ["independent sequential reconstruction", "edition comparison", "independent corroboration"],
              },
          ]
          corpus_record = by_id(records, "path", "corpus/index.yaml")
          corpus_record["registry_version"] = "1.9.0"
          corpus_record["present_function"] = [
              "22 typed source entities",
              "7 reviewed witnesses",
              "22 source-status records",
              "10 analytical and integration study records",
              "all 35 YAML records in the studies tree accounted for",
              "all 7 problem witness registries",
              "19 Theologico-Political identities, 4 reviewed item witnesses, and 3 complete provisional item studies",
              "7 positive corpus-gap records",
          ]
          corpus_record["remaining"] = [
              "fifteen reviewed item witnesses",
              "sixteen independent item studies",
              "complete Strauss bibliography and edition-specific source statuses",
              "broader independent classical, biblical, medieval, Spinozist, Cohenian, Kantian, and modern corpora",
              "source-text admission and runtime source access remain separate",
          ]
          loader_record = by_id(records, "path", "corpus_registry.py")
          loader_record["present_function"] = [
              "validates exact current studies-tree coverage and all typed counts",
              "validates nineteen predecessor identities, aliases, scopes, and preserved-copy equality",
              "validates CORPUS-WIT-102 as a witness-only qualified platform-reference state",
              "validates complete-study states for CORPUS-SRC-105, CORPUS-SRC-109, and CORPUS-SRC-111",
              "validates witness identity, locators, missing-byte safeguards, study binding, noncertification, and successor non-effect",
          ]
          manifest_record = by_id(records, "path", "manifest.yaml")
          manifest_record["present_function"] = [
              "registers corpus v1.9.0, findings v1.3.0, 19 identities, 4 item witnesses, and 3 item studies",
              "preserves structural, semantic, runtime, migration, predecessor, and certification limits",
              "blocks completed-interface Sanctum repinning",
          ]
          audit["production_order"]["completed_in_current_sequence"].append("CORPUS-WIT-102 qualified platform-reference registration")
          audit["production_order"]["next"] = [
              "run complete structural and behavioral validation for this witness registration",
              "conduct CORPUS-SRC-102 independent sequential reconstruction from printed pages 137-180",
              "acquire CORPUS-SRC-103 and the remaining fourteen item witnesses after it",
              "expand independent Spinozist, biblical, Platonic, Xenophontic, medieval, Cohenian, Kantian, and modern witness studies",
              "validate actual ministerial reports against the full contract stack",
          ]
          save("audits/operational-completeness.yaml", audit)

          # Lean mapping forward revision.
          mapping = load("migrations/lean-operational-interface.yaml")
          mapping["identity"]["version"] = "1.5.0"
          mapping["revision_history"] = {
              "predecessor_version": "1.4.0",
              "predecessor_blob_sha": "fc5152aef23264d116131a12cfafbe4494f1a1b4",
              "reason": (
                  "Synchronize corpus registry v1.9.0 and CORPUS-WIT-102 qualified platform-reference registration while "
                  "preserving three-of-nineteen study completion, absent byte custody, incomplete reconstruction, "
                  "noncertification, predecessor authority, and repository incompleteness."
              ),
          }
          mapping["completion_audit"]["version"] = "2.3.0"
          mapping["production_process"]["completed_witness_subunit"] = "JERUSALEM_ATHENS_COHEN_TALMON_AND_SPINOZA_PREFACE_4_OF_19"
          mapping["production_process"]["completed_study_subunit"] = "JERUSALEM_ATHENS_COHEN_AND_TALMON_3_OF_19_COMPLETE_PROVISIONAL"
          cmap = mapping["mappings"]["corpus"]
          cmap["interface"]["registry_version"] = "1.9.0"
          cmap["transformation"] = "SUBSTANTIVE_FORWARD_REVISION_WITH_QUALIFIED_PLATFORM_REFERENCE_WITNESS"
          cmap["reviewed_witnesses"]["count"] = 7
          cmap["reviewed_witnesses"]["source_ids"] = ["CORPUS-SRC-001", "CORPUS-SRC-002", "CORPUS-SRC-003", "CORPUS-SRC-102", "CORPUS-SRC-105", "CORPUS-SRC-109", "CORPUS-SRC-111"]
          cstate = cmap["theologico_political_item_level_statuses"]
          cstate["reviewed_witness_count"] = 4
          cstate["remaining_without_reviewed_witness"] = 15
          cstate["independent_sequential_study_count"] = 3
          cstate["remaining_without_independent_sequential_study"] = 16
          cmap["present_function"] = [
              "register source entities separately from witnesses and studies",
              "account for all 35 YAML records in the current studies tree",
              "validate all nineteen identities, aliases, scopes, witness states, study states, and noncertification",
              "validate CORPUS-WIT-102 platform identity, printed locators, missing byte identity, and study-pending state",
              "validate fingerprinted witnesses and completed study bindings for CORPUS-WIT-105, CORPUS-WIT-109, and CORPUS-WIT-111",
              "preserve corpus gaps and original-edition comparison limits",
          ]
          cmap["limit"] = (
              "Current-state exhaustiveness, four reviewed item witnesses, and three complete provisional item studies do not "
              "create a complete corpus, admit source text, supply independent corroboration, certify findings, or authorize migration and activation."
          )
          save("migrations/lean-operational-interface.yaml", mapping)

          # Production process forward revision.
          process = load("history/production-plans/2026-07-27-ten-step-completion-process.yaml")
          process["identity"]["version"] = "1.7.0"
          process["revision_history"] = {
              "predecessor_version": "1.6.0",
              "predecessor_blob_sha": "bdcca463c862f03e5bafc44f1fdcc5a2a471eee7",
              "reason": (
                  "Advance Step 8 after qualified platform-reference registration of CORPUS-WIT-102. Preserve fifteen missing "
                  "item witnesses, sixteen missing item studies, pending byte materialization and edition comparison, and the Step 10 repin blocker."
              ),
          }
          step1 = next(item for item in process["steps"] if item["sequence"] == 1)
          step2 = next(item for item in process["steps"] if item["sequence"] == 2)
          step8 = next(item for item in process["steps"] if item["sequence"] == 8)
          step9 = next(item for item in process["steps"] if item["sequence"] == 9)
          step1["current_version"] = "2.3.0"
          step2["current_version"] = "1.5.0"
          step8["completed"] = [
              "all 19 Theologico-Political predecessor writings have bounded item identities",
              "CORPUS-WIT-102 is registered as a qualified platform-reference witness with printed locators and missing-byte safeguards",
              "CORPUS-WIT-109, CORPUS-WIT-105, and CORPUS-WIT-111 remain fingerprinted reviewed item witnesses",
              "JA-STUDY-001, COHEN-STUDY-001, and TALMON-STUDY-001 are complete provisional for their reviewed 1983 collected witnesses",
              "CORPUS-STUDY-008 through CORPUS-STUDY-010, FINDSET-008 through FINDSET-010, and FINDSET-111 through FINDSET-118 are registered",
              "corpus and findings registries preserve derivation, jurisdiction, gaps, and noncertification",
          ]
          step8["remaining"] = [
              "establish reviewed witnesses for fifteen item identities",
              "conduct sixteen independent sequential item studies, beginning with CORPUS-SRC-102",
              "materialize and fingerprint CORPUS-WIT-102 only through later forward revision if exact bytes become accessible",
              "compare the 1965 and 1968 Preface textual states with the 1997 composite where wording matters",
              "complete the remaining original-edition comparisons already recorded",
              "reconstruct Talmon's reviewed work independently",
              "expand independent primary witnesses beyond Strauss's writings",
              "normalize propositions where warranted by reproducible extraction",
              "preserve later additions through forward revision",
          ]
          step9["completed_in_current_sequence"] = [
              "tests drafted for four TP item witnesses, three complete studies, one witness-only state, and fifteen missing-witness states",
              "tests drafted for qualified platform-reference identity, locator, missing-byte, noncertification, and no-successor safeguards",
              "tests drafted for corpus and findings coverage, derivation, jurisdiction, and completion-language consistency",
          ]
          process["current_production_unit"] = {
              "step": 8,
              "completed_subunit": {
                  "title": "Preface to Spinoza's Critique of Religion qualified platform-reference witness registration",
                  "state": "COMPLETE_PENDING_BRANCH_VALIDATION_AND_MERGE",
                  "source_id": "CORPUS-SRC-102",
                  "witness_id": "CORPUS-WIT-102",
