          # Dedicated regression test for the qualified witness state.
          (ROOT / "tests/test_corpus_wit_102_platform_registration.py").write_text('''from pathlib import Path\nimport unittest\n\nimport yaml\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef load_yaml(relative_path: str) -> dict:\n    with (ROOT / relative_path).open(encoding="utf-8") as handle:\n        return yaml.safe_load(handle)\n\n\nclass CorpusWitness102PlatformRegistrationTests(unittest.TestCase):\n    def test_witness_meets_platform_reference_minimums(self) -> None:\n        protocol = load_yaml("protocols/platform-reference-witness.yaml")\n        witness = load_yaml("studies/theologico-political/preface-to-spinozas-critique-of-religion/reviewed-witness.yaml")\n        status = load_yaml("studies/theologico-political/preface-to-spinozas-critique-of-religion/source-status.yaml")\n\n        self.assertEqual(protocol["identity"]["protocol_version"], "1.0.0")\n        self.assertEqual(witness["identity"]["witness_id"], "CORPUS-WIT-102")\n        self.assertEqual(witness["status"]["lifecycle"], "QUALIFIED_PLATFORM_REFERENCE_WITNESS_REGISTERED")\n        self.assertEqual(witness["platform_reference"]["platform_object_identifier"], "file_0000000073c081fd9fb65f9ea7552cde")\n        self.assertEqual(witness["item_identity_and_locators"]["printed_page_range"], {"start": 137, "end": 180})\n        self.assertEqual(witness["byte_identity"]["byte_custody_state"], "NOT_EXPOSED_TO_REPOSITORY")\n        self.assertEqual(witness["byte_identity"]["sha256_state"], "UNAVAILABLE_WITH_REASON_PRESERVED")\n        self.assertEqual(status["termination"]["reviewed_witness_state"], "REGISTERED_QUALIFIED_PLATFORM_REFERENCE")\n\n    def test_registration_does_not_complete_study_or_certify(self) -> None:\n        witness = load_yaml("studies/theologico-political/preface-to-spinozas-critique-of-religion/reviewed-witness.yaml")\n        status = load_yaml("studies/theologico-political/preface-to-spinozas-critique-of-religion/source-status.yaml")\n        corpus = load_yaml("corpus/index.yaml")\n\n        self.assertEqual(witness["termination"]["study_state"], "INCOMPLETE")\n        self.assertEqual(witness["termination"]["certification"], "NOT_CERTIFIED")\n        self.assertEqual(witness["termination"]["successor_effect"], "NONE")\n        self.assertEqual(status["status"]["independent_sequential_study"], "NOT_YET_COMPLETED")\n        self.assertEqual(corpus["termination"]["theologico_political_reviewed_witness_state"], "INCOMPLETE_4_OF_19")\n        self.assertEqual(corpus["termination"]["theologico_political_independent_study_state"], "INCOMPLETE_3_OF_19")\n\n    def test_acquisition_record_remains_historically_distinct(self) -> None:\n        acquisition = load_yaml("history/reviewed-witness-acquisitions/2026-07-27-preface-spinoza-file-library-witness.yaml")\n        self.assertEqual(acquisition["status"]["corpus_registration_effect"], "NONE")\n        self.assertEqual(acquisition["termination"]["reviewed_witness_registration"], "DEFERRED")\n        self.assertEqual(acquisition["registration_decision"]["state"], "DEFERRED_PENDING_BYTE_LEVEL_IDENTITY_OR_CONTROLLED_PLATFORM_REFERENCE_POLICY")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

