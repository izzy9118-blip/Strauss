                  "following_source": "CORPUS-SRC-103",
              },
              "non_effects": [
                  "no source-text admission through registries",
                  "no doctrinal or migration certification",
                  "no successor activation or predecessor displacement",
                  "no Sanctum repin as a completed interface",
              ],
          }
          save("history/production-plans/2026-07-27-ten-step-completion-process.yaml", process)

          # Priority schedule forward revision.
          schedule = load("history/production-plans/2026-07-27-theologico-political-reviewed-witness-priority.yaml")
          schedule["identity"]["version"] = "1.5.0"
          schedule["status"]["reviewed_witness_completion"] = "INCOMPLETE_4_OF_19"
          schedule["status"]["independent_sequential_study_completion"] = "INCOMPLETE_3_OF_19"
          schedule["revision_history"] = {
              "predecessor_version": "1.4.0",
              "predecessor_blob_sha": "053d7c717fa177451b4342a2fbd7e07b9f3bef41",
              "reason": (
                  "Record qualified platform-reference registration of CORPUS-WIT-102, preserve its incomplete sequential "
                  "study and missing byte identity, and advance the next acquisition target to CORPUS-SRC-103 without ranking truth."
              ),
          }
          group1 = schedule["priority_groups"][0]["items"]
          group1[:] = [item for item in group1 if item.get("source_id") != "CORPUS-SRC-102"]
          group1.append({
              "rank": 4,
              "source_id": "CORPUS-SRC-102",
              "status_id": "CORPUS-STATUS-102",
              "title": "Preface to Spinoza's Critique of Religion",
