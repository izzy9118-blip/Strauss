name: Complete PR 21

on:
  push:
    branches:
      - production/talmon-reviewed-witness-reconstruction
    paths:
      - ".github/workflows/complete-pr21.yml"

permissions:
  contents: write

jobs:
  synchronize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: production/talmon-reviewed-witness-reconstruction
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Synchronize Talmon integration records and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_many(path: str, replacements: list[tuple[str, str]]) -> None:
              for old, new in replacements:
                  replace_once(path, old, new)

          # Findings tests: advance exact live counts and add Talmon derivation coverage.
          replace_many("tests/test_findings_registry.py", [
              ('registry["identity"]["version"], "1.2.0"', 'registry["identity"]["version"], "1.3.0"'),
              ('self.assertEqual(len(finding_ids), 29)', 'self.assertEqual(len(finding_ids), 33)'),
              ('self.assertEqual(len(registered), 15)', 'self.assertEqual(len(registered), 18)'),
              ('self.assertEqual(len(registered), 9)', 'self.assertEqual(len(registered), 10)'),
          ])
          replace_once(
              "tests/test_findings_registry.py",
              '    def test_indexes_are_derived_from_finding_set_bindings(self) -> None:\n',
              '''    def test_talmon_study_and_three_local_syntheses_are_explicitly_derived(self) -> None:\n        registry = findings_registry.load_registry()\n        by_id = {item["finding_set_id"]: item for item in registry["finding_sets"]}\n        study = by_id["FINDSET-010"]\n        tp = by_id["FINDSET-116"]\n        avj = by_id["FINDSET-117"]\n        avm = by_id["FINDSET-118"]\n\n        self.assertEqual(study["source_bindings"], ["CORPUS-SRC-111"])\n        self.assertEqual(\n            study["problem_bindings"],\n            ["theologico-political", "athens-vs-jerusalem", "ancients-vs-moderns"],\n        )\n        self.assertEqual(\n            study["derived_local_syntheses"],\n            ["FINDSET-116", "FINDSET-117", "FINDSET-118"],\n        )\n        self.assertEqual(study["independent_corroboration"], "INCOMPLETE")\n        self.assertEqual(study["original_edition_comparison"], "PENDING")\n        self.assertEqual(study["reviewed_work_reconstruction"], "INCOMPLETE")\n        self.assertEqual(study["certification"], "NOT_CERTIFIED")\n\n        for synthesis, expected_problem in (\n            (tp, "theologico-political"),\n            (avj, "athens-vs-jerusalem"),\n            (avm, "ancients-vs-moderns"),\n        ):\n            self.assertEqual(synthesis["source_bindings"], ["CORPUS-SRC-111"])\n            self.assertEqual(synthesis["derived_from"], ["FINDSET-010"])\n            self.assertEqual(synthesis["problem_bindings"], [expected_problem])\n            self.assertEqual(synthesis["successor_effect"], "NONE")\n            self.assertEqual(synthesis["certification"], "NOT_CERTIFIED")\n\n    def test_indexes_are_derived_from_finding_set_bindings(self) -> None:\n''',
          )

          # Cross-record consistency tests: advance from two to three completed item units.
          replace_many("tests/test_interface_consistency.py", [
              ('def test_nineteen_identity_two_witness_two_study_language_matches', 'def test_nineteen_identity_three_witness_three_study_language_matches'),
              ('self.assertEqual(manifest_state["reviewed_witness_count"], 2)', 'self.assertEqual(manifest_state["reviewed_witness_count"], 3)'),
              ('self.assertEqual(audit_state["reviewed_item_witness_count"], 2)', 'self.assertEqual(audit_state["reviewed_item_witness_count"], 3)'),
              ('self.assertEqual(mapping_state["reviewed_witness_count"], 2)', 'self.assertEqual(mapping_state["reviewed_witness_count"], 3)'),
              ('self.assertEqual(manifest_state["independent_sequential_study_count"], 2)', 'self.assertEqual(manifest_state["independent_sequential_study_count"], 3)'),
              ('self.assertEqual(audit_state["independently_reconstructed_count_within_this_sequence"], 2)', 'self.assertEqual(audit_state["independently_reconstructed_count_within_this_sequence"], 3)'),
              ('self.assertEqual(mapping_state["independent_sequential_study_count"], 2)', 'self.assertEqual(mapping_state["independent_sequential_study_count"], 3)'),
              ('self.assertEqual(manifest_state["remaining_without_reviewed_item_witness"], 17)', 'self.assertEqual(manifest_state["remaining_without_reviewed_item_witness"], 16)'),
              ('self.assertEqual(mapping_state["remaining_without_reviewed_witness"], 17)', 'self.assertEqual(mapping_state["remaining_without_reviewed_witness"], 16)'),
              ('"INCOMPLETE_2_OF_19",', '"INCOMPLETE_3_OF_19",'),
              ('def test_priority_schedule_advances_to_talmon_without_truth_ranking', 'def test_priority_schedule_advances_beyond_talmon_without_truth_ranking'),
              ('["CORPUS-SRC-109", "CORPUS-SRC-105"]', '["CORPUS-SRC-109", "CORPUS-SRC-105", "CORPUS-SRC-111"]'),
              ('["JA-STUDY-001", "COHEN-STUDY-001"]', '["JA-STUDY-001", "COHEN-STUDY-001", "TALMON-STUDY-001"]'),
              ('"COMPLETE_FOR_CORPUS_WIT_105_AND_CORPUS_WIT_109",', '"COMPLETE_FOR_CORPUS_WIT_105_CORPUS_WIT_109_AND_CORPUS_WIT_111",'),
              ('"COMPLETE_PROVISIONAL_FOR_COHEN_STUDY_001_AND_JA_STUDY_001",', '"COMPLETE_PROVISIONAL_FOR_COHEN_STUDY_001_JA_STUDY_001_AND_TALMON_STUDY_001",'),
              ('self.assertEqual(schedule["termination"]["next_item_witness"], "CORPUS-SRC-111")', 'self.assertEqual(schedule["termination"]["next_item_witness"], "CORPUS-SRC-102")'),
          ])
          replace_once(
              "tests/test_interface_consistency.py",
              '        for finding_id in ("FINDSET-113", "FINDSET-114", "FINDSET-115"):\n            self.assertEqual(by_id[finding_id]["successor_effect"], "NONE")\n            self.assertEqual(by_id[finding_id]["derived_from"], ["FINDSET-009"])\n',
              '''        for finding_id in ("FINDSET-113", "FINDSET-114", "FINDSET-115"):\n            self.assertEqual(by_id[finding_id]["successor_effect"], "NONE")\n            self.assertEqual(by_id[finding_id]["derived_from"], ["FINDSET-009"])\n\n        self.assertEqual(\n            by_id["FINDSET-010"]["derived_local_syntheses"],\n            ["FINDSET-116", "FINDSET-117", "FINDSET-118"],\n        )\n        self.assertEqual(by_id["FINDSET-116"]["problem_bindings"], ["theologico-political"])\n        self.assertEqual(by_id["FINDSET-117"]["problem_bindings"], ["athens-vs-jerusalem"])\n        self.assertEqual(by_id["FINDSET-118"]["problem_bindings"], ["ancients-vs-moderns"])\n        for finding_id in ("FINDSET-116", "FINDSET-117", "FINDSET-118"):\n            self.assertEqual(by_id[finding_id]["successor_effect"], "NONE")\n            self.assertEqual(by_id[finding_id]["derived_from"], ["FINDSET-010"])\n''',
          )

          # Manifest forward revision.
          replace_many("manifest.yaml", [
              ('  version: 1.3.0\n', '  version: 1.4.0\n'),
              ('  predecessor_version: 1.2.0\n  predecessor_blob_sha: 38a730f5abff4066869badd13cd1ddef076ec4f3\n', '  predecessor_version: 1.3.0\n  predecessor_blob_sha: 2f196ff5564adbe1390cd1dcff1acbf27d1a73a2\n'),
              ('''  reason: >\n    Register CORPUS-WIT-105, COHEN-STUDY-001, CORPUS-STUDY-009, FINDSET-009,\n    and three jurisdiction-preserving problem-local syntheses. Synchronize corpus registry\n    v1.7.0 and findings registry v1.2.0 while preserving the original 1972 edition gap,\n    seventeen missing Theologico-Political item witnesses and studies, independent-witness\n    gaps, predecessor authority, noncertification, nonactivation, and the Sanctum repin block.\n''', '''  reason: >\n    Register CORPUS-WIT-111, TALMON-STUDY-001, CORPUS-STUDY-010, FINDSET-010,\n    and three jurisdiction-preserving problem-local syntheses. Synchronize corpus registry\n    v1.8.0 and findings registry v1.3.0 while preserving the original 1957 edition gap,\n    Talmon-work reconstruction gap, sixteen missing Theologico-Political item witnesses and\n    studies, predecessor authority, noncertification, nonactivation, and the Sanctum repin block.\n'''),
              ('  version: 2.1.0\n', '  version: 2.2.0\n'),
              ('SPPP_SA_PLATO_APOLOGY_JERUSALEM_ATHENS_AND_COHEN_ITEM_REGISTERED_WITH_RECORDED_LIMITS', 'SPPP_SA_PLATO_APOLOGY_JERUSALEM_ATHENS_COHEN_AND_TALMON_ITEMS_REGISTERED_WITH_RECORDED_LIMITS'),
              ('19_OF_19_IDENTITIES_2_OF_19_REVIEWED_ITEM_WITNESSES_2_OF_19_COMPLETE_PROVISIONAL_ITEM_STUDIES', '19_OF_19_IDENTITIES_3_OF_19_REVIEWED_ITEM_WITNESSES_3_OF_19_COMPLETE_PROVISIONAL_ITEM_STUDIES'),
              ('SPEECH_HERMENEUTIC_METHOD_PROBLEM_BUNDLE_CORPUS_FINDINGS_JA_AND_COHEN_SOURCE_STUDY_CONTRACTS_REQUIRE_VALIDATION', 'SPEECH_HERMENEUTIC_METHOD_PROBLEM_BUNDLE_CORPUS_FINDINGS_JA_COHEN_AND_TALMON_SOURCE_STUDY_CONTRACTS_REQUIRE_VALIDATION'),
              ('  registry_version: 1.7.0\n', '  registry_version: 1.8.0\n'),
              ('    reviewed_witness_count: 2\n', '    reviewed_witness_count: 3\n'),
              ('    remaining_without_reviewed_item_witness: 17\n', '    remaining_without_reviewed_item_witness: 16\n'),
              ('    independent_sequential_study_count: 2\n', '    independent_sequential_study_count: 3\n'),
              ('    remaining_without_independent_sequential_study: 17\n', '    remaining_without_independent_sequential_study: 16\n'),
              ('    completed_study_ids: [COHEN-STUDY-001, JA-STUDY-001]\n', '    completed_study_ids: [COHEN-STUDY-001, JA-STUDY-001, TALMON-STUDY-001]\n'),
              ('      Two complete provisional source studies are not independent corroboration, doctrinal\n', '      Three complete provisional source studies are not independent corroboration, doctrinal\n'),
              ('''    All nineteen predecessor writings have bounded identities, but only Jerusalem and Athens\n    and the Hermann Cohen introductory essay have reviewed item witnesses and complete\n    provisional item studies. The wider corpus, original-edition comparisons, independent\n''', '''    All nineteen predecessor writings have bounded identities, but only Jerusalem and Athens,\n    the Hermann Cohen introductory essay, and the Talmon review have reviewed item witnesses\n    and complete provisional item studies. The wider corpus, original-edition comparisons, independent\n'''),
              ('  registry_version: 1.2.0\n', '  registry_version: 1.3.0\n'),
              ('  newly_registered: [FINDSET-009, FINDSET-113, FINDSET-114, FINDSET-115]\n', '  newly_registered: [FINDSET-010, FINDSET-116, FINDSET-117, FINDSET-118]\n'),
          ])
          replace_once(
              "manifest.yaml",
              "    - {source: Jerusalem and Athens, witness_id: CORPUS-WIT-109, container_witness_id: CORPUS-WIT-001, printed_pages: 147-173, pdf_pages_one_based: 151-177, original_publication: 'The City College Papers, no. 6, The City College of New York, 1967', item_status: studies/theologico-political/jerusalem-and-athens/source-status.yaml}\n",
              "    - {source: Jerusalem and Athens, witness_id: CORPUS-WIT-109, container_witness_id: CORPUS-WIT-001, printed_pages: 147-173, pdf_pages_one_based: 151-177, original_publication: 'The City College Papers, no. 6, The City College of New York, 1967', item_status: studies/theologico-political/jerusalem-and-athens/source-status.yaml}\n    - {source: Review of J. L. Talmon, witness_id: CORPUS-WIT-111, container_witness_id: CORPUS-WIT-001, printed_pages: 232, pdf_pages_one_based: 236, original_publication: 'Journal of Modern History 29, no. 3, 1957', item_status: studies/theologico-political/review-talmon-nature-of-jewish-history/source-status.yaml}\n",
          )

          # Audit forward revision and current-state accounting.
          replace_many("audits/operational-completeness.yaml", [
              ('  version: 2.1.0\n', '  version: 2.2.0\n'),
              ('  predecessor_version: 2.0.0\n  predecessor_blob_sha: 432381b75dc086d0e3dee6bead60d501688e0413\n', '  predecessor_version: 2.1.0\n  predecessor_blob_sha: 0cd1529f590c21cd3881f7def50994b88e293031\n'),
              ('''  reason: >\n    Record CORPUS-WIT-105, COHEN-STUDY-001, CORPUS-STUDY-009, FINDSET-009,\n    and the three jurisdiction-preserving local syntheses. Preserve original-edition\n    comparison, independent corroboration, seventeen missing witnesses and studies,\n    doctrinal and migration noncertification, successor nonactivation, active predecessor\n    authority, and the completed-interface Sanctum repin block.\n''', '''  reason: >\n    Record CORPUS-WIT-111, TALMON-STUDY-001, CORPUS-STUDY-010, FINDSET-010,\n    and three jurisdiction-preserving local syntheses. Preserve original-edition and reviewed-work\n    comparison gaps, independent corroboration, sixteen missing witnesses and studies, doctrinal\n    and migration noncertification, successor nonactivation, active predecessor authority,\n    and the completed-interface Sanctum repin block.\n'''),
              ('  prior_validated_interface_commit: 853dd7de13d7bf4abc881fc7671a5833b822b6cb\n  current_revision_scope: production/cohen-reviewed-witness-registration\n', '  prior_validated_interface_commit: 2d8cdafbb1ec694c9f54109c4708f86de49379fa\n  current_revision_scope: production/talmon-reviewed-witness-reconstruction\n'),
              ('    - five reviewed witnesses, including CORPUS-WIT-105 and CORPUS-WIT-109\n', '    - six reviewed witnesses, including CORPUS-WIT-105, CORPUS-WIT-109, and CORPUS-WIT-111\n'),
              ('    - COHEN-STUDY-001 complete provisional sequential reconstruction\n', '    - COHEN-STUDY-001 complete provisional sequential reconstruction\n    - TALMON-STUDY-001 complete provisional sequential reconstruction\n'),
              ('    - CORPUS-STUDY-008, CORPUS-STUDY-009, FINDSET-008, and FINDSET-009 typed registrations\n', '    - CORPUS-STUDY-008 through CORPUS-STUDY-010 and FINDSET-008 through FINDSET-010 typed registrations\n'),
              ('    - FINDSET-111 through FINDSET-115 jurisdiction-preserving problem-local syntheses\n', '    - FINDSET-111 through FINDSET-118 jurisdiction-preserving problem-local syntheses\n'),
              ('    reviewed_item_witness_count: 2\n', '    reviewed_item_witness_count: 3\n'),
              ('    registered_without_reviewed_witness_count: 17\n', '    registered_without_reviewed_witness_count: 16\n'),
              ('    independently_reconstructed_count_within_this_sequence: 2\n', '    independently_reconstructed_count_within_this_sequence: 3\n'),
              ('    remaining_without_independent_sequential_study: 17\n', '    remaining_without_independent_sequential_study: 16\n'),
              ('    completed_source_ids: [CORPUS-SRC-105, CORPUS-SRC-109]\n', '    completed_source_ids: [CORPUS-SRC-105, CORPUS-SRC-109, CORPUS-SRC-111]\n'),
              ('    completed_witness_ids: [CORPUS-WIT-105, CORPUS-WIT-109]\n', '    completed_witness_ids: [CORPUS-WIT-105, CORPUS-WIT-109, CORPUS-WIT-111]\n'),
              ('    completed_study_ids: [COHEN-STUDY-001, JA-STUDY-001]\n', '    completed_study_ids: [COHEN-STUDY-001, JA-STUDY-001, TALMON-STUDY-001]\n'),
              ('      The two studies are independent reconstructions relative to predecessor and collection-\n', '      The three studies are independent reconstructions relative to predecessor and collection-\n'),
              ('    - seventeen Theologico-Political item identities lack reviewed item witnesses\n', '    - sixteen Theologico-Political item identities lack reviewed item witnesses\n'),
              ('    - seventeen Theologico-Political writings lack independent sequential item studies\n', '    - sixteen Theologico-Political writings lack independent sequential item studies\n'),
              ('    - the original 1972 Cohen essay printing has not been compared with the reviewed 1983 reprint\n', '    - the original 1972 Cohen essay printing has not been compared with the reviewed 1983 reprint\n    - the original 1957 Talmon review printing has not been compared with the reviewed 1983 reprint\n    - Talmon\'s reviewed work remains independently unreconstructed\n'),
              ('    registry_version: 1.7.0\n', '    registry_version: 1.8.0\n'),
              ('      - 5 reviewed witnesses\n', '      - 6 reviewed witnesses\n'),
              ('      - 9 analytical and integration study records\n', '      - 10 analytical and integration study records\n'),
              ('      - all 32 YAML records in the studies tree accounted for\n', '      - all 34 YAML records in the studies tree accounted for\n'),
              ('      - 19 Theologico-Political identities, 2 reviewed item witnesses, and 2 complete provisional item studies\n', '      - 19 Theologico-Political identities, 3 reviewed item witnesses, and 3 complete provisional item studies\n'),
              ('      - seventeen reviewed item witnesses and studies\n', '      - sixteen reviewed item witnesses and studies\n'),
              ('    registry_version: 1.2.0\n', '    registry_version: 1.3.0\n'),
              ('      - 29 typed finding sets\n', '      - 33 typed finding sets\n'),
              ('      - 9 source-specific or integration records\n', '      - 10 source-specific or integration records\n'),
              ('      - 15 problem-local syntheses\n', '      - 18 problem-local syntheses\n'),
