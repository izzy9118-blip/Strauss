name: Materialize CORPUS-SRC-103

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: corpus-src-103-complete-review
          fetch-depth: 0

      - name: Detect complete payload
        id: payload
        shell: bash
        run: |
          if [ -f history/staging/src103-complete-payload/READY ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruamel.yaml==0.18.10

      - name: Materialize complete review and validate
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            cat history/staging/src103-complete-payload/part-* | base64 --decode | gzip --decompress > /tmp/complete_src103_review.py
            python /tmp/complete_src103_review.py
            python - <<'PY'
          from pathlib import Path
          import yaml

          status_path = Path("studies/theologico-political/how-to-study-spinozas-theologico-political-treatise/source-status.yaml")
          status = yaml.safe_load(status_path.read_text(encoding="utf-8"))
          status["registration_basis"]["corpus_source_id"] = "CORPUS-SRC-103"
          reviewed = status["reviewed_witness"]
          reviewed["witness_id"] = "CORPUS-WIT-103"
          reviewed["printed_page_range"] = {"start": 181, "end": 233}
          reviewed["pdf_page_range_one_based"] = {"start": 200, "end": 252}
          status["termination"]["study_id"] = "SPINOZA-TREATISE-STUDY-001"
          status_path.write_text(
              yaml.safe_dump(status, sort_keys=False, allow_unicode=True, width=120),
              encoding="utf-8",
          )

          witness_path = Path("studies/theologico-political/how-to-study-spinozas-theologico-political-treatise/reviewed-witness.yaml")
          witness = yaml.safe_load(witness_path.read_text(encoding="utf-8"))
          witness["byte_identity"] = {
              "algorithm": "SHA256",
              "sha256": "43e98521c28a9ef8ede1eb7a6507d8ee78d605d0a531624d5dd20075220bda66",
              "file_size_bytes": 39287307,
          }
          witness["item_identity_and_locators"] = {
              "printed_page_range": {"start": 181, "end": 233},
              "pdf_page_range_one_based": {"start": 200, "end": 252},
              "argumentative_body_printed_range": {"start": 181, "end": 224},
              "notes_printed_range": {"start": 224, "end": 233},
          }
          witness_path.write_text(
              yaml.safe_dump(witness, sort_keys=False, allow_unicode=True, width=120),
              encoding="utf-8",
          )

          registry_path = Path("corpus_registry.py")
          text = registry_path.read_text(encoding="utf-8")
          text = text.replace(
              '        "theologico_political_reviewed_item_witnesses_registered": 4,\n'
              '        "theologico_political_independent_item_studies_registered": 4,',
              '        "theologico_political_reviewed_item_witnesses_registered": 5,\n'
              '        "theologico_political_independent_item_studies_registered": 5,',
          )
          text = text.replace(
              '    if termination.get("theologico_political_reviewed_witness_state") != "INCOMPLETE_4_OF_19":\n'
              '        errors.append("TP reviewed-witness state must be INCOMPLETE_4_OF_19")\n'
              '    if termination.get("theologico_political_independent_study_state") != "INCOMPLETE_4_OF_19":\n'
              '        errors.append("TP independent-study state must be INCOMPLETE_4_OF_19")',
              '    if termination.get("theologico_political_reviewed_witness_state") != "INCOMPLETE_5_OF_19":\n'
              '        errors.append("TP reviewed-witness state must be INCOMPLETE_5_OF_19")\n'
              '    if termination.get("theologico_political_independent_study_state") != "INCOMPLETE_5_OF_19":\n'
              '        errors.append("TP independent-study state must be INCOMPLETE_5_OF_19")',
          )
          text = text.replace(
              '    if study_record.get("termination", {}).get("successor_effect") != "NONE":\n'
              '        errors.append(f"{study_id} may not affect successor activation")',
              '    study_status = study_record.get("status", {})\n'
              '    study_termination = study_record.get("termination", {})\n'
              '    study_successor_effect = study_termination.get(\n'
              '        "successor_effect",\n'
              '        study_status.get("successor_effect", study_status.get("successor_activation_effect")),\n'
              '    )\n'
              '    if study_successor_effect != "NONE":\n'
              '        errors.append(f"{study_id} may not affect successor activation")',
          )
          registry_path.write_text(text, encoding="utf-8")

          findings_path = Path("findings/index.yaml")
          findings = yaml.safe_load(findings_path.read_text(encoding="utf-8"))
          direct_source_keys = [
              "CORPUS-SRC-001",
              "CORPUS-SRC-002",
              "CORPUS-SRC-003",
              "CORPUS-SRC-102",
              "CORPUS-SRC-103",
              "CORPUS-SRC-105",
              "CORPUS-SRC-111",
          ]
          by_source = {key: [] for key in direct_source_keys}
          by_source["CORPUS-SRC-101-119"] = []
          predecessor_sources = {f"CORPUS-SRC-{number:03d}" for number in range(101, 120)}
          separately_indexed = {"CORPUS-SRC-102", "CORPUS-SRC-105", "CORPUS-SRC-111"}
          for item in findings["finding_sets"]:
              bindings = set(item.get("source_bindings", []))
              finding_id = item["finding_set_id"]
              for key in direct_source_keys:
                  if key in bindings:
                      by_source[key].append(finding_id)
              if bindings & predecessor_sources and not (
                  len(bindings) == 1 and next(iter(bindings)) in separately_indexed
              ):
                  by_source["CORPUS-SRC-101-119"].append(finding_id)
          findings["indexes"]["by_source"] = by_source
          findings_path.write_text(
              yaml.safe_dump(findings, sort_keys=False, allow_unicode=True, width=120),
              encoding="utf-8",
          )

          findings_test_path = Path("tests/test_findings_registry.py")
          test_text = findings_test_path.read_text(encoding="utf-8")
          test_text = test_text.replace("self.assertEqual(len(finding_ids), 37)", "self.assertEqual(len(finding_ids), 41)")
          test_text = test_text.replace("self.assertEqual(len(registered), 21)", "self.assertEqual(len(registered), 24)")
          test_text = test_text.replace("self.assertEqual(len(registered), 11)", "self.assertEqual(len(registered), 12)")
          findings_test_path.write_text(test_text, encoding="utf-8")

          talmon_test_path = Path("tests/test_pr21_talmon_completion.py")
          talmon_text = talmon_test_path.read_text(encoding="utf-8")
          talmon_text = talmon_text.replace(
              '["COHEN-STUDY-001", "JA-STUDY-001", "TALMON-STUDY-001", "SPINOZA-PREFACE-STUDY-001"],',
              '["COHEN-STUDY-001", "JA-STUDY-001", "TALMON-STUDY-001", "SPINOZA-PREFACE-STUDY-001", "SPINOZA-TREATISE-STUDY-001"],',
          )
          talmon_test_path.write_text(talmon_text, encoding="utf-8")
          PY
            rm -rf history/staging/src103-payload
            rm -rf history/staging/src103-complete-payload
            rm -f .github/workflows/materialize-corpus-src-103.yml
            python adapter.py --validate
            python problem_bundles.py --validate
            python corpus_registry.py --validate
            python findings_registry.py --validate
            python -m unittest discover -s tests -p 'test_*.py'
          } > /tmp/src103-materialize.log 2>&1
          status=$?
          cat /tmp/src103-materialize.log
          exit "$status"

      - name: Upload failure log
        if: failure() && steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: src103-materialize-error
          path: /tmp/src103-materialize.log
          if-no-files-found: error

      - name: Commit complete review
        if: success() && steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete CORPUS-SRC-103 review"
          git push origin HEAD:corpus-src-103-complete-review
