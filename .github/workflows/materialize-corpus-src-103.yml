name: Materialize CORPUS-SRC-103

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: corpus-src-103-complete-review
          fetch-depth: 0

      - name: Detect complete payload
        id: payload
        shell: bash
        run: |
          if [ -f history/staging/src103-complete-payload/READY ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruamel.yaml==0.18.10

      - name: Materialize complete review and validate
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            cat history/staging/src103-complete-payload/part-* | base64 --decode | gzip --decompress > /tmp/complete_src103_review.py
            python /tmp/complete_src103_review.py
            rm -rf history/staging/src103-payload
            rm -rf history/staging/src103-complete-payload
            rm -f .github/workflows/materialize-corpus-src-103.yml
            python adapter.py --validate
            python problem_bundles.py --validate
            python corpus_registry.py --validate
            python findings_registry.py --validate
            python -m unittest discover -s tests -p 'test_*.py'
          } > /tmp/src103-materialize.log 2>&1
          status=$?
          cat /tmp/src103-materialize.log
          exit "$status"

      - name: Upload failure log
        if: failure() && steps.payload.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: src103-materialize-error
          path: /tmp/src103-materialize.log
          if-no-files-found: error

      - name: Commit complete review
        if: success() && steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete CORPUS-SRC-103 review"
          git push origin HEAD:corpus-src-103-complete-review
