name: Apply SRC-103 findings registry repair

on:
  push:
    branches:
      - validate/inquiry-0001
    paths:
      - tools/apply_src103_findings_registry_fix.py
      - .github/workflows/apply-src103-registry-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/inquiry-0001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Apply additive registry correction
        run: python tools/apply_src103_findings_registry_fix.py
      - name: Commit repaired registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add findings/index.yaml tools/apply_src103_findings_registry_fix.py .github/workflows/apply-src103-registry-fix.yml
          git commit -m "Register missing SRC-103 Ancients-vs-Moderns synthesis; restore exhaustive findings accounting"
          git push origin HEAD:validate/inquiry-0001
