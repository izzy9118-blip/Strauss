name: Validate Foundational Architecture

on:
  push:
    branches:
      - main
    paths:
      - "governance/**"
      - "problems/**"
      - "protocols/**"
      - "migrations/foundational-problems-v2/**"
      - "studies/studies-in-platonic-political-philosophy/**"
      - "scripts/validate_foundational_architecture.py"
      - ".github/workflows/validate-foundational-architecture.yml"
  pull_request:
    paths:
      - "governance/**"
      - "problems/**"
      - "protocols/**"
      - "migrations/foundational-problems-v2/**"
      - "studies/studies-in-platonic-political-philosophy/**"
      - "scripts/validate_foundational_architecture.py"
      - ".github/workflows/validate-foundational-architecture.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate YAML, paths, identities, and predecessor preservation
        run: python scripts/validate_foundational_architecture.py
