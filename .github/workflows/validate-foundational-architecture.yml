name: Validate Foundational Architecture

on:
  push:
    branches:
      - main
    paths:
      - "governance/**"
      - "problems/**"
      - "protocols/**"
      - "migrations/foundational-problems-v2/**"
      - "studies/studies-in-platonic-political-philosophy/**"
      - "scripts/validate_foundational_architecture.py"
      - ".github/workflows/validate-foundational-architecture.yml"
  pull_request:
    paths:
      - "governance/**"
      - "problems/**"
      - "protocols/**"
      - "migrations/foundational-problems-v2/**"
      - "studies/studies-in-platonic-political-philosophy/**"
      - "scripts/validate_foundational_architecture.py"
      - ".github/workflows/validate-foundational-architecture.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate foundational architecture
        id: foundational_validation
        shell: bash
        run: |
          set +e
          python scripts/validate_foundational_architecture.py > validation-output.txt 2>&1
          status=$?
          cat validation-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload validator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundational-architecture-validation-output
          path: validation-output.txt
          if-no-files-found: error
          retention-days: 30
