name: Apply Inquiry 0001 consistency updates

on:
  push:
    branches:
      - validate/inquiry-0001
    paths:
      - tools/apply_inquiry0001_consistency_updates.py
      - .github/workflows/apply-inquiry0001-consistency-updates.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/inquiry-0001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply forward consistency updates
        run: python tools/apply_inquiry0001_consistency_updates.py
      - name: Commit synchronized operational records and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.yaml migrations/lean-operational-interface.yaml tests/test_findings_registry.py tests/test_pr21_talmon_completion.py tests/test_corpus_registry.py tests/test_corpus_wit_103_registration.py tools/apply_inquiry0001_consistency_updates.py .github/workflows/apply-inquiry0001-consistency-updates.yml
          git commit -m "Synchronize findings 1.17.0 interface and current SRC-103 witness expectations"
          git push origin HEAD:validate/inquiry-0001
