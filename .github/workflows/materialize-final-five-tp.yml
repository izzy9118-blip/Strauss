name: Materialize Final Five Theologico-Political Studies

on:
  push:
    branches:
      - production/complete-final-five-tp-studies
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: production/complete-final-five-tp-studies
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.6 PyYAML

      - name: Run guarded final-five materializer
        shell: bash
        run: |
          python scripts/materialize_final_five_tp.py > /tmp/final5-materializer.log 2>&1 || { cat /tmp/final5-materializer.log; exit 1; }

      - name: Upload materializer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final5-materializer-diagnostics
          path: /tmp/final5-materializer.log

      - name: Validate generated repository state
        shell: bash
        run: |
          {
            python adapter.py --validate
            python problem_bundles.py --validate
            python corpus_registry.py --validate
            python findings_registry.py --validate
            python -m unittest discover -s tests -p 'test_*.py'
          } > /tmp/final5-validation.log 2>&1 || { cat /tmp/final5-validation.log; exit 1; }

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final5-validation-diagnostics
          path: /tmp/final5-validation.log

      - name: Remove temporary materializer artifacts
        run: |
          rm -f scripts/.final5_materializer.py.gz.b64
          rm -f scripts/materialize_final_five_tp.py
          rm -f history/production-triggers/final-five-retry.trigger
          rm -f .github/workflows/materialize-final-five-tp.yml

      - name: Commit generated final-five integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Integrate final five Theologico-Political studies"
          git push origin HEAD:production/complete-final-five-tp-studies
