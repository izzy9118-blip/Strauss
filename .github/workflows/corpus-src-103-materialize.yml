name: Materialize CORPUS-SRC-103 Witness

on:
  push:
    branches:
      - corpus-src-103-reviewed-witness
    paths:
      - ".github/workflows/corpus-src-103-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corpus-src-103-reviewed-witness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruamel.yaml==0.18.10
      - name: Materialize
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode history/staging/register-src103.py.gz.b64 | gzip --decompress > /tmp/register_src103_witness.py
          sed -i 's#ROOT = Path(__file__).resolve().parents\[1\]#ROOT = Path.cwd()#g' /tmp/register_src103_witness.py
          python /tmp/register_src103_witness.py
          rm -f .github/workflows/trigger-corpus-src-103.yml
          rm -f .github/workflows/corpus-src-103-materialize.yml
          rm -f history/staging/register-src103.py.gz.b64
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python adapter.py --validate
          python problem_bundles.py --validate
          python corpus_registry.py --validate
          python findings_registry.py --validate
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register reviewed witness for CORPUS-SRC-103"
          git push origin HEAD:corpus-src-103-reviewed-witness
