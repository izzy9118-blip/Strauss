name: Materialize SRC107 Integration

on:
  push:
    branches:
      - production/corpus-src-107-sequential-reconstruction

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: production/corpus-src-107-sequential-reconstruction
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install round-trip YAML dependency
        run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.6
      - name: Materialize bounded integration
        run: python scripts/materialize_src107_integration.py
      - name: Commit materialized state
        run: |
          if git diff --quiet; then
            echo "No materialization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/index.yaml corpus_registry.py findings/index.yaml findings_registry.py manifest.yaml audits/operational-completeness.yaml migrations/lean-operational-interface.yaml history/production-plans/2026-07-27-ten-step-completion-process.yaml history/production-plans/2026-07-27-theologico-political-reviewed-witness-priority.yaml tests/
          git commit -m "Materialize CORPUS-SRC-107 study integration"
          git push origin HEAD:production/corpus-src-107-sequential-reconstruction
