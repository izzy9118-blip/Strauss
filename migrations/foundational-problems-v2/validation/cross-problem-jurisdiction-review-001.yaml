  - pair_id: TP-AVJ
    problems: [theologico-political, athens-vs-jerusalem]
    status: OPEN_HIGH_PRIORITY_NO_MERGER
    primary_allocation: >
      The Theologico-Political Problem owns the strict conflict over ultimate authority,
      revelation, command, sacred law, interpretation, and sovereignty. Athens vs.
      Jerusalem owns the concrete comprehensive ways of life, highest human types,
      beginnings, and ends.
    risk: >
      Both reciprocal records currently use DEPENDS_ON, creating a circular structural
      dependency. This may reflect genuine co-implication, but it is not the adopted
      brother-problem designation and must not silently become a merger.
    required_resolution: >
      Preserve both jurisdictions and test whether the relation should remain mutual
      dependence or be revised to INTERSECTS after independent Biblical, Platonic,
      Maimonidean, and Strauss witness reconstruction.
  - pair_id: TP-WVG
    problems: [theologico-political, wise-vs-vulgar]
    status: BOUNDARY_PASS
    primary_allocation: >
      The Theologico-Political Problem owns substantive divine and philosophic authority.
      The Wise vs. The Vulgar owns recognition of prophets, philosophers, theologians,
      jurists, sovereigns, interpreters, and counterfeits.
  - pair_id: TP-AVM
    problems: [theologico-political, ancients-vs-moderns]
    status: OPEN_MEDIUM_PRIORITY
    primary_allocation: >
      The Theologico-Political Problem owns the permanent authority conflict. Ancients
      vs. Moderns owns modern critique, neutralization, rationalization, historicization,
      secularization, and attempted supersession.
    required_resolution: >
      Independent modern and historicist witnesses must determine whether a given claim
      is a proposed resolution of the permanent problem or a transformation governed by modernity.

  - pair_id: AVJ-WVG
    problems: [athens-vs-jerusalem, wise-vs-vulgar]
    status: BOUNDARY_PASS
    primary_allocation: >
      Athens vs. Jerusalem owns the comprehensive ways and highest types. The Wise vs.
      The Vulgar owns recognition, mediation, education, and capture of their bearers.
  - pair_id: AVJ-AVM
    problems: [athens-vs-jerusalem, ancients-vs-moderns]
    status: OPEN_MEDIUM_PRIORITY
    primary_allocation: >
      Athens vs. Jerusalem owns the permanent comprehensive confrontation. Ancients vs.
      Moderns owns modern transformations and attempted supersessions of the alternatives.
    required_resolution: >
      Source-specific studies must distinguish historical mediation, rationalization,
      secularization, and political restoration from genuine preservation of either orientation.
  - pair_id: WVG-AVM
    problems: [wise-vs-vulgar, ancients-vs-moderns]
    status: BOUNDARY_PASS
    primary_allocation: >
      The Wise vs. The Vulgar owns the permanent recognition and capture problem.
      Ancients vs. Moderns owns modern claimant forms such as expertise, bureaucracy,
