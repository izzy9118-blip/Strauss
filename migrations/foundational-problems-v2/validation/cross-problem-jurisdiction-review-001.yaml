  - pair_id: TVP-WVG
    problems: [theory-vs-practice, wise-vs-vulgar]
    status: BOUNDARY_PASS
    primary_allocation: >
      Theory vs. Practice owns the chain from understanding to action. The Wise vs. The
      Vulgar owns who is recognized as superior and how capture is prevented.
  - pair_id: TVP-AVM
    problems: [theory-vs-practice, ancients-vs-moderns]
    status: BOUNDARY_PASS
    primary_allocation: >
      Theory vs. Practice owns the permanent action problem. Ancients vs. Moderns owns
