authority:
  architecture: governance/foundational-problem-architecture.yaml
  registry: problems/registry.yaml
  migration: migrations/foundational-problems-v2/migration.yaml
  governing_rule: >
    The seven foundational problems remain distinct but connected. Repetition is
    permitted only where it states a boundary, a local application, a source-specific
    finding, or a controlled relation. A complete governing doctrine and a shared
    interpretive method may not be duplicated across problem constitutions.

