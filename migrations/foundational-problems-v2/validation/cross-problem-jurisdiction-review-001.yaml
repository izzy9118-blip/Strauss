    Absence of a visible run is not a passing result. Structural production may
    continue, but certification and activation remain prohibited.

duplication_classes:
  allowed:
    BOUNDARY_RESTATEMENT: >
      A concise statement of another problem's jurisdiction used to mark a limit.
    LOCAL_APPLICATION: >
      Application of a shared protocol to a problem-specific claimant, source, or question.
    CONTROLLED_RELATION_SUMMARY: >
      A relation record identifying dependence, intersection, supplied findings, and routing.
    SOURCE_SPECIFIC_FINDING: >
      A finding derived from a registered source and stored in a subordinate synthesis.
  prohibited:
    GOVERNING_DOCTRINE_DUPLICATION: >
      The same constitutive doctrine is owned and independently governed by more than one problem.
    SHARED_PROTOCOL_DUPLICATION: >
      A general interpretive method is copied into local constitutions as autonomous doctrine.
    SILENT_JURISDICTION_TRANSFER: >
      A problem begins governing a neighboring doctrine without a controlled relation and revision record.
    DUPLICATE_CERTIFICATION: >
      Repetition, cross-reference, or source overlap is treated as additional proof or certification.

