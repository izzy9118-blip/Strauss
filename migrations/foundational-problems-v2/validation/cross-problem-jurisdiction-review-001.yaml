    open_item: >
      SUPPLIES_FINDING_TO and INTERSECTS are used reciprocally. The substantive boundary
      is clear, but directional relation semantics require later formal review.
  - pair_id: TVP-AVJ
    problems: [theory-vs-practice, athens-vs-jerusalem]
    status: BOUNDARY_PASS_DIRECTIONAL_TYPE_REVIEW_OPEN
    primary_allocation: >
      Athens vs. Jerusalem owns comprehensive ends and ways of life. Theory vs. Practice
