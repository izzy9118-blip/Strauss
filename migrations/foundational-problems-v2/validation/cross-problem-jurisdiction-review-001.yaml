pairwise_review:
  - pair_id: NVP-PVP
    problems: [nomos-vs-physis, philosophy-vs-poetry]
    status: BOUNDARY_PASS
    primary_allocation: >
      Nomos vs. Physis owns nature, convention, and natural standards. Philosophy vs.
      Poetry owns the rival poetic and philosophic forms of wisdom arising from that challenge.
  - pair_id: NVP-TVP
    problems: [nomos-vs-physis, theory-vs-practice]
    status: BOUNDARY_PASS
    primary_allocation: >
      Nomos vs. Physis owns the standard and lawful-just distinction. Theory vs.
      Practice owns application, prudence, institutions, execution, and correction.
  - pair_id: NVP-TP
    problems: [nomos-vs-physis, theologico-political]
    status: BOUNDARY_PASS
    primary_allocation: >
      Nomos vs. Physis owns natural and positive-law distinctions. The Theologico-
      Political Problem owns ultimate authority among reason, revelation, command,
      sacred law, interpretation, and sovereignty.
  - pair_id: NVP-AVJ
    problems: [nomos-vs-physis, athens-vs-jerusalem]
    status: BOUNDARY_PASS
    primary_allocation: >
      Nomos vs. Physis owns nature and convention as a permanent distinction. Athens
      vs. Jerusalem owns nature and creation within comprehensive rival ways of life.
  - pair_id: NVP-WVG
    problems: [nomos-vs-physis, wise-vs-vulgar]
    status: BOUNDARY_PASS_DIRECTIONAL_TYPE_REVIEW_OPEN
    primary_allocation: >
      Nomos vs. Physis owns the content and burden of a natural standard. The Wise vs.
      The Vulgar owns recognition and capture of claimants who assert knowledge of it.
    open_item: >
      The reciprocal records use SUPPLIES_FINDING_TO and INTERSECTS rather than an
      explicit inverse pair. This does not create doctrinal duplication but should be
      reviewed when relation-direction rules are formally specified.
  - pair_id: NVP-AVM
    problems: [nomos-vs-physis, ancients-vs-moderns]
    status: BOUNDARY_PASS
    primary_allocation: >
      Nomos vs. Physis owns the permanent standard. Ancients vs. Moderns owns the
      historical transformation of nature, right, rights, history, and value creation.

  - pair_id: PVP-TVP
    problems: [philosophy-vs-poetry, theory-vs-practice]
    status: BOUNDARY_PASS
    primary_allocation: >
      Philosophy vs. Poetry owns the poetic accusation concerning prudence, souls,
      education, and political consequence. Theory vs. Practice owns the general
      movement from understanding to responsible action.
  - pair_id: PVP-TP
    problems: [philosophy-vs-poetry, theologico-political]
    status: BROTHER_PROBLEM_BOUNDARY_PASS
    primary_allocation: >
      Philosophy vs. Poetry owns rival human forms of wisdom and poetic representation.
      The Theologico-Political Problem owns genuine revelation, divine command, sacred
      law, interpretation, and ultimate authority.
    safeguard: >
      Co-foundational brotherhood requires coactivation where appropriate but does not
      authorize merger, revelation-poetry reduction, or duplicate governing doctrine.
  - pair_id: PVP-AVJ
    problems: [philosophy-vs-poetry, athens-vs-jerusalem]
    status: BOUNDARY_PASS
    primary_allocation: >
      Philosophy vs. Poetry owns poetic, dramatic, and philosophic forms of disclosure.
      Athens vs. Jerusalem owns the comprehensive orientations of autonomous
      understanding and obedient love.
  - pair_id: PVP-WVG
    problems: [philosophy-vs-poetry, wise-vs-vulgar]
    status: BOUNDARY_PASS
    primary_allocation: >
      Philosophy vs. Poetry owns the substantive rival claims. The Wise vs. The Vulgar
      owns claimant recognition, rank, differentiated education, and capture.
  - pair_id: PVP-AVM
    problems: [philosophy-vs-poetry, ancients-vs-moderns]
    status: BOUNDARY_PASS
    primary_allocation: >
      Philosophy vs. Poetry owns the permanent quarrel. Ancients vs. Moderns owns its
      transformation into aesthetics, culture, ideology, self-expression, and modern writing.

  - pair_id: TVP-TP
    problems: [theory-vs-practice, theologico-political]
    status: BOUNDARY_PASS_DIRECTIONAL_TYPE_REVIEW_OPEN
    primary_allocation: >
      The Theologico-Political Problem owns the unresolved authority conflict. Theory
