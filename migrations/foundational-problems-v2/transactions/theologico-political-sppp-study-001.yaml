preserved_limits:
  - The active predecessor remains untouched and authoritative pending certified migration.
  - The exact historical predecessor copy remains unchanged.
  - SPPP-STUDY-001 is provisional and not certified.
  - The collection's missing intended introduction and Gorgias essay remain missing.
  - Pangle's Introduction remains secondary; Cropsey's Foreword remains editorial provenance.
  - Poetry is not revelation and civic theology is not revelation.
  - Critique of civic religion is not proof against revelation.
  - Philosophy's inability to refute revelation is not proof of a particular revelation.
  - Independent primary-text studies may correct or contradict the collection reconstruction.
  - No successor activation or certification is authorized.

