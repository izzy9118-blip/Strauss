completion_audit:
  path: audits/operational-completeness.yaml
  version: 1.7.0
  rule: >
    Structural, bundle, corpus, findings, source-status, and witness validation must never
    be reported as doctrinal, source-specific, migration, successor, or repository completion.

production_process:
  path: history/production-plans/2026-07-27-ten-step-completion-process.yaml
  state: IN_PROGRESS
  current_step: 8
  final_repin_step: 10
  final_repin_status: BLOCKED_UNTIL_SUBSTANTIVE_COMPLETION

mapping_rules:
  - No source record is deleted, moved, or edited merely to satisfy the lean interface.
  - Existing migration, predecessor, certification, and activation states remain governing.
  - Forward revision preserves predecessor blob identity and states the substantive change.
  - Interface validity and semantic completion are distinct states.
  - Contract reconstruction does not complete source-specific application.
  - Source entity, reviewed edition, local file, OCR layer, page image, source-status record, study, synthesis, and migration ledger may not be collapsed.
  - Title-page and copyright-page evidence govern a conflicting local filename.
  - Page images govern wording where OCR is uncertain or conflicts.
  - A reviewed Strauss witness does not replace independent Aristophanes, Plato, Xenophon, or historical-Socrates witnesses.
  - A registered source identity without a reviewed witness does not establish source-level findings.
  - Registry inclusion does not admit or distribute source text.
  - Registry inclusion does not promote a proposition beyond its record-local evidence status.
  - Multiple records derived from one source do not constitute independent corroboration.

mappings:
  problems:
    target_role: permanent_questions_and_complete_read_only_operational_bundles
    source:
      registry: problems/registry.yaml
      successor_directories: problems/*/
      active_predecessors:
        - problems/theologico-political.yaml
        - problems/wise-and-vulgar.yaml
    interface:
      manifest_section: problems
      loader: problem_bundles.py
      validation_command: python problem_bundles.py --validate
    transformation: REFERENCE_WITH_STATUS_PRESERVATION_AND_READ_ONLY_BUNDLE_LOADING
    completion: SUBSTANTIVE_BUNDLES_RUNTIME_LOADED_SOURCE_APPLICATION_AND_MIGRATION_INCOMPLETE
    limit: >
      Bundle loading does not finish independent witnesses, proposition-level migration,
      doctrinal certification, predecessor transition, or successor activation.

  hermeneutics:
    target_role: interpretive_reading_disciplines
    source:
      - protocols/source-status.yaml
      - protocols/evidence-classification.yaml
      - protocols/inference-discipline.yaml
      - protocols/uncertainty-preservation.yaml
      - protocols/speech-and-deed.yaml
      - protocols/irony.yaml
      - protocols/comedy.yaml
      - protocols/audience-and-rhetoric.yaml
      - protocols/claimant-to-wisdom.yaml
    interface:
      - {path: hermeneutics/literary-concealment.yaml, contract_version: STRAUSS-HERMENEUTIC-LC-1}
      - {path: hermeneutics/whole-and-part.yaml, contract_version: STRAUSS-HERMENEUTIC-WP-1}
      - {path: hermeneutics/speaker-and-author.yaml, contract_version: STRAUSS-HERMENEUTIC-SA-1}
      - {path: hermeneutics/audience.yaml, contract_version: STRAUSS-HERMENEUTIC-AUD-1}
      - {path: hermeneutics/contradiction.yaml, contract_version: STRAUSS-HERMENEUTIC-CON-1}
      - {path: hermeneutics/historical-and-philosophical-understanding.yaml, contract_version: STRAUSS-HERMENEUTIC-HPU-1}
    transformation: SUBSTANTIVE_FORWARD_REVISION_OF_CONSOLIDATED_LAYER
    completion: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE

  method:
    target_role: inquiry_sequence
    source:
      - protocols/source-status.yaml
      - protocols/evidence-classification.yaml
      - protocols/inference-discipline.yaml
      - protocols/uncertainty-preservation.yaml
      - governance/foundational-problem-architecture.yaml
    interface:
      - {path: method/recover-question.yaml, contract_version: STRAUSS-METHOD-RQ-1}
      - {path: method/reconstruct-alternatives.yaml, contract_version: STRAUSS-METHOD-RA-1}
      - {path: method/textual-order.yaml, contract_version: STRAUSS-METHOD-TO-1}
      - {path: method/preserve-problem.yaml, contract_version: STRAUSS-METHOD-PP-1}
    transformation: SUBSTANTIVE_FORWARD_REVISION_OF_CONSOLIDATED_LAYER
    completion: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE

  speech:
    target_role: ministerial_expression_and_output_discipline
    interface: speech/speech-mechanism.yaml
    contract_version: STRAUSS-SPEECH-CONTRACT-1
    transformation: SUBSTANTIVE_FORWARD_REVISION_OF_CONSOLIDATED_LAYER
    completion: PARTIALLY_RECONSTRUCTED

  corpus:
    target_role: typed_source_identity_status_study_provenance_witness_and_gap_registry
    source:
      - studies/**/*.yaml
      - problems/*/witnesses.yaml
      - problems/theologico-political.yaml
      - history/foundational-problems/theologico-political/STR-PROBLEM-002-v1.1-active-predecessor.yaml
      - history/foundational-problems/wise-vs-vulgar/WVG-v0.2-reconstruction-accepted.yaml
    interface:
      registry: corpus/index.yaml
      registry_version: 1.3.0
      loader: corpus_registry.py
      validation_command: python corpus_registry.py --validate
    transformation: SUBSTANTIVE_FORWARD_REVISION_WITH_ITEM_LEVEL_SOURCE_STATUS_ADDITIONS
    completion: SUBSTANTIVELY_RECONSTRUCTED_CURRENT_STATE_EXHAUSTIVE_OPEN_CORPUS
    reviewed_witnesses:
      count: 3
      source_ids:
        - CORPUS-SRC-001
        - CORPUS-SRC-002
        - CORPUS-SRC-003
    theologico_political_item_level_statuses:
      active_predecessor_source_count: 19
      registered_count: 2
      remaining_count: 17
      reviewed_witness_count_for_registered_items: 0
      independent_sequential_study_count_for_registered_items: 0
      records:
        - {source_id: CORPUS-SRC-101, status_id: CORPUS-STATUS-101, path: studies/theologico-political/progress-or-return/source-status.yaml}
        - {source_id: CORPUS-SRC-102, status_id: CORPUS-STATUS-102, path: studies/theologico-political/preface-to-spinozas-critique-of-religion/source-status.yaml}
    present_function:
      - register source entities separately from reviewed witnesses and studies
      - account for every YAML record in the current studies tree
      - validate reviewed-witness fingerprints against source-status records
      - generically validate registered Theologico-Political item-level identities, aliases, predecessor sequences, missing witnesses, incomplete studies, and noncertification
      - preserve explicit corpus gaps and missing-evidence states
    limit: >
      Current-state exhaustiveness and item-level identity registration do not create a
      complete corpus, admit source text, complete independent witnesses, certify findings,
      or authorize migration and activation.

  findings:
    target_role: typed_finding_set_provenance_jurisdiction_derivation_migration_and_gap_registry
    interface:
      registry: findings/index.yaml
      registry_version: 1.0.0
      loader: findings_registry.py
      validation_command: python findings_registry.py --validate
    transformation: SUBSTANTIVE_FORWARD_REVISION_FROM_REFERENCE_INDEX
    completion: SUBSTANTIVELY_RECONSTRUCTED_CURRENT_STATE_EXHAUSTIVE_OPEN_FINDINGS_STORE
    limit: >
      Findings registration does not normalize every proposition, establish independent
      corroboration, certify doctrine or migration, displace predecessors, or activate successors.

  runtime:
    target_role: deterministic_loaders_contract_validators_and_candidate_report_builder
    interface:
      - adapter.py
      - problem_bundles.py
      - corpus_registry.py
      - findings_registry.py
      - tests/test_adapter.py
      - tests/test_hermeneutics.py
      - tests/test_methods.py
      - tests/test_problem_bundles.py
      - tests/test_corpus_registry.py
      - tests/test_findings_registry.py
      - .github/workflows/validate-lean-interface.yml
    transformation: NEW_OPERATIONAL_LAYER
    completion: PARTIALLY_RECONSTRUCTED
    limit: >
      Runtime validation does not perform source interpretation, source-text admission,
      proposition promotion, doctrinal certification, migration execution, successor
      activation, predecessor displacement, or authoritative Assembly admission.

path_conflicts:
  - requested_path: problems/theologico-political.yaml
    existing_role: ACTIVE_PREDECESSOR
    resolution: PRESERVE_EXISTING_PATH_AND_LOAD_SUCCESSOR_BUNDLE_FROM_MANIFEST
    successor_path: problems/theologico-political/problem.yaml
    prohibition: DO_NOT_OVERWRITE_OR_REPURPOSE_WITHOUT_CERTIFIED_MIGRATION

non_effects:
  - No successor problem is certified or activated.
  - No active predecessor is displaced.
  - No accepted migration source is superseded.
  - No source-specific finding is promoted.
  - No source text is admitted or distributed.
  - A registered source identity is not a reviewed witness or independent reconstruction.
  - The filename year does not override bibliographic evidence.
  - OCR does not override page images.
  - Reviewed Strauss witnesses do not replace independent ancient witnesses.
  - No Assembly authority is conferred; Sanctum validation remains separate.

validation_states:
  structural_interface_valid_when:
    - manifest paths and declared YAML records resolve
    - manifest, audit, mapping, and registry versions agree
    - adapter validates manifest and speech contract
    - problem_bundles validates all seven complete bundles
    - corpus_registry validates source identities, witnesses, source-status records, studies, predecessor sources, paths, counts, fingerprints, aliases, missing-witness conditions, and gaps
    - findings_registry validates finding sets, exact record coverage, bindings, indexes, and gaps
    - all structural and behavioral tests pass
    - GitHub Actions passes on the implementing commit
  semantic_completion_requires:
    - item-level source-status and independent study records for registered writings
    - source-specific method and hermeneutic applications
    - edition comparison where wording or pagination requires it
    - expanded independent classical, biblical, medieval, and modern witnesses
    - actual candidate-report validation against the full contract stack
  doctrinal_certification_requires:
    - separate source-grounded and migration-specific certification records
    - preserved dissent, contradiction, and uncertainty
    - no self-certification by repository, runtime, minister, or artificial intelligence
  successor_activation_requires:
    - predecessor preservation and complete classified migration coverage
    - reference and schema validation
    - explicit authorized certification
    - no activation merely from interface or witness readiness

completed_production_units:
  - speech, hermeneutic, and method operational contracts
  - complete read-only foundational problem bundles
  - typed current-state corpus and findings registries
  - reviewed Socrates and Aristophanes witness and source-status registration
  - first two bounded Theologico-Political item-level source identities
  - generic item-level Theologico-Political source-status validator and tests

next_production_units:
  - create item-level source-status record for How to Study Spinoza's Theologico-Political Treatise
  - continue through the remaining sixteen predecessor writings
  - identify and register reviewed witnesses for item-level source reconstruction
  - create source-specific method and hermeneutic application fixtures
  - expand independent witness reconstruction
  - validate actual candidate ministerial reports

repinning_rule: >
  Do not repin Sanctum as a completed Strauss interface while semantic completion remains
  INCOMPLETE. A separately authorized interim pin may follow successful structural and
  behavioral validation only if it preserves every declared incompleteness and does not
  imply doctrinal certification, migration completion, or unrestricted runtime readiness.
