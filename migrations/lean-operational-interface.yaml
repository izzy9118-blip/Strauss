    source: [protocols/source-status.yaml, protocols/evidence-classification.yaml, protocols/inference-discipline.yaml, protocols/uncertainty-preservation.yaml, protocols/speech-and-deed.yaml, protocols/irony.yaml, protocols/comedy.yaml, protocols/audience-and-rhetoric.yaml, protocols/claimant-to-wisdom.yaml]
