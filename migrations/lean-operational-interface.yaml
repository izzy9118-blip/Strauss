mapping_rules:
  - No source record is deleted, moved, or edited merely to satisfy the lean interface.
  - Existing migration, predecessor, certification, and activation states remain governing.
  - Forward revision preserves predecessor blob identity and states the substantive change.
  - Interface validity, identity completeness, witness completeness, study completion, independent corroboration, and semantic completion are distinct states.
  - Contract reconstruction does not complete source-specific application.
  - Source entity, reviewed edition, local file, OCR layer, page image, source-status record, study, synthesis, and migration ledger may not be collapsed.
  - A source-specific study does not constitute independent corroboration of sources represented within it.
  - Registry inclusion does not admit source text or promote propositions beyond record-local status.
  - Multiple records derived from one source do not constitute independent corroboration.
  - Active predecessors remain authoritative until an authorized certified transition.

mappings:
  problems:
    target_role: permanent_questions_and_complete_read_only_operational_bundles
    source:
      registry: problems/registry.yaml
      successor_directories: problems/*/
      active_predecessors: [problems/theologico-political.yaml, problems/wise-and-vulgar.yaml]
    interface:
      manifest_section: problems
      loader: problem_bundles.py
      validation_command: python problem_bundles.py --validate
    transformation: REFERENCE_WITH_STATUS_PRESERVATION_AND_READ_ONLY_BUNDLE_LOADING
    completion: SUBSTANTIVE_BUNDLES_RUNTIME_LOADED_SOURCE_APPLICATION_AND_MIGRATION_INCOMPLETE
