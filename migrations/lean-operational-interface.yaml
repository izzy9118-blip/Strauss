schema_version: 1.0
record_type: architecture_mapping

identity:
  id: STRAUSS-LEAN-MAP-001
  title: Existing Strauss Repository to Lean Operational Interface
  version: 0.5.0

status:
  lifecycle: IMPLEMENTED_ADDITIVE_MAPPING
  structural_interface: IMPLEMENTED
  semantic_completion: INCOMPLETE
  certification: NOT_CERTIFIED
  destructive_actions_authorized: false

revision_history:
  predecessor_version: 0.4.0
  predecessor_blob_sha: 7f5d1ce6363f00da8c444c91647771c42b6ae411
  reason: >
    Register all seven foundational problems as complete read-only operational bundles
    containing constitution, inquiry profile, witness registry, relations, and synthesis
    records. Preserve source-specific application, incomplete witnesses, migration
    certification, doctrine, activation, corpus, and findings as incomplete.

source_state:
  repository: izzy9118-blip/Strauss
  governing_commit_before_mapping: c3493bd721efa53e813e7bff4e79f3968517996c
  preserved_roots:
    - governance/
    - problems/
    - protocols/
    - studies/
    - migrations/foundational-problems-v2/
    - history/
    - scripts/

completion_audit:
  path: audits/operational-completeness.yaml
  version: 1.3.0
  rule: >
    Every lean operational object must expose whether it is substantively reconstructed,
    partially reconstructed, mapped to richer records, a structural placeholder, or
    unimplemented. Structural and bundle validation must never be reported as doctrinal,
    source-specific, migration, or repository completion.

mapping_rules:
  - No source record is deleted, moved, or edited merely to satisfy the lean interface.
  - The lean interface references current canonical or provisional records by path.
  - Existing migration and certification states remain governing for the records they describe.
  - A later physical flattening requires a new migration record, path validation, predecessor preservation, and explicit certification.
  - Duplicate doctrine is prohibited; interface records point to governing sources instead of copying complete problem constitutions.
  - Interface validity and semantic completeness are distinct states.
  - Forward revision must preserve predecessor blob identity and explain the substantive change.
  - Contract reconstruction does not complete source-specific application.
  - Bundle loading does not certify a problem, synthesis, witness, claimant, predecessor displacement, or successor activation.
  - Legitimate historical record-layout variants may be normalized for loading without silently rewriting source files.

mappings:
  problems:
    target_role: permanent_questions_and_complete_read_only_operational_bundles
    source:
      registry: problems/registry.yaml
      successor_directories: problems/*/
      bundle_members:
        - problem.yaml
        - inquiry-profile.yaml
        - witnesses.yaml
        - relations.yaml
        - synthesis/*.yaml
      active_predecessors:
        - problems/theologico-political.yaml
        - problems/wise-and-vulgar.yaml
      accepted_migration_sources:
        - history/foundational-problems/wise-vs-vulgar/WVG-v0.2-reconstruction-accepted.yaml
    interface:
      manifest_section: problems
      loader: problem_bundles.py
      validation_command: python problem_bundles.py --validate
    transformation: REFERENCE_WITH_STATUS_PRESERVATION_AND_READ_ONLY_BUNDLE_LOADING
    completion: SUBSTANTIVE_BUNDLES_RUNTIME_LOADED_SOURCE_APPLICATION_AND_MIGRATION_INCOMPLETE
    present_function:
      - load one or all seven canonical problem bundles in official order
      - validate problem, profile, witness, and relation identities
      - validate six controlled neighboring relations and jurisdictional boundaries per problem
      - preserve reciprocal brother-problem designation and non-absorption
      - expose all registered synthesis records without promoting them
      - preserve active predecessors and accepted migration sources in declarations
    limit: >
      The bundle loader makes complete governing structures available together. It does
      not finish independent witness studies, proposition-level migration, source-specific
      application, doctrinal certification, or successor activation.

  hermeneutics:
    target_role: interpretive_reading_disciplines
    source:
      - protocols/source-status.yaml
      - protocols/evidence-classification.yaml
      - protocols/inference-discipline.yaml
      - protocols/uncertainty-preservation.yaml
      - protocols/speech-and-deed.yaml
      - protocols/irony.yaml
      - protocols/comedy.yaml
      - protocols/audience-and-rhetoric.yaml
      - protocols/claimant-to-wisdom.yaml
    interface:
      - path: hermeneutics/literary-concealment.yaml
        contract_version: STRAUSS-HERMENEUTIC-LC-1
      - path: hermeneutics/whole-and-part.yaml
        contract_version: STRAUSS-HERMENEUTIC-WP-1
      - path: hermeneutics/speaker-and-author.yaml
        contract_version: STRAUSS-HERMENEUTIC-SA-1
      - path: hermeneutics/audience.yaml
        contract_version: STRAUSS-HERMENEUTIC-AUD-1
      - path: hermeneutics/contradiction.yaml
        contract_version: STRAUSS-HERMENEUTIC-CON-1
      - path: hermeneutics/historical-and-philosophical-understanding.yaml
        contract_version: STRAUSS-HERMENEUTIC-HPU-1
    transformation: SUBSTANTIVE_FORWARD_REVISION_OF_CONSOLIDATED_LAYER
    completion: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE
    limit: >
      The six contracts govern inputs, evidence, application sequence, valid outputs,
      prohibitions, uncertainty, termination, speech integration, and behavioral tests.
      They do not complete interpretation of every registered source or work.

  method:
    target_role: inquiry_sequence
    source:
      - protocols/source-status.yaml
      - protocols/evidence-classification.yaml
      - protocols/inference-discipline.yaml
      - protocols/uncertainty-preservation.yaml
      - governance/foundational-problem-architecture.yaml
      - hermeneutics/whole-and-part.yaml
      - hermeneutics/speaker-and-author.yaml
      - hermeneutics/historical-and-philosophical-understanding.yaml
    interface:
      - path: method/recover-question.yaml
        contract_version: STRAUSS-METHOD-RQ-1
      - path: method/reconstruct-alternatives.yaml
        contract_version: STRAUSS-METHOD-RA-1
      - path: method/textual-order.yaml
        contract_version: STRAUSS-METHOD-TO-1
      - path: method/preserve-problem.yaml
        contract_version: STRAUSS-METHOD-PP-1
    transformation: SUBSTANTIVE_FORWARD_REVISION_OF_CONSOLIDATED_LAYER
    completion: SUBSTANTIVELY_RECONSTRUCTED_SOURCE_APPLICATION_INCOMPLETE
    limit: >
      The four contracts govern recovery of the governing question, independent
      reconstruction of alternatives, ordered reading, and preservation of permanent
      problems. They do not execute interpretation or complete source-specific records.

  speech:
    target_role: ministerial_expression_and_output_discipline
    source:
      - protocols/source-status.yaml
      - protocols/audience-and-rhetoric.yaml
      - protocols/speech-and-deed.yaml
      - protocols/evidence-classification.yaml
      - protocols/inference-discipline.yaml
      - protocols/uncertainty-preservation.yaml
      - protocols/irony.yaml
      - protocols/comedy.yaml
    interface: speech/speech-mechanism.yaml
    transformation: SUBSTANTIVE_FORWARD_REVISION_OF_CONSOLIDATED_LAYER
    completion: PARTIALLY_RECONSTRUCTED
    contract_version: STRAUSS-SPEECH-CONTRACT-1
    limit: >
      The contract governs typed inputs, evidence, audience, speech and deed,
      concealment, irony, comedy, uncertainty, output, failure, and termination. It does
      not automatically interpret sources or generate a completed natural-language answer.

  corpus:
    target_role: source_discovery_and_status_index
    source:
      - studies/
      - history/
      - problem witness registries
    interface: corpus/index.yaml
    transformation: REFERENCE_ONLY
    completion: MAPPED_TO_RICHER_RECORDS

  findings:
    target_role: completed_and_provisional_inquiry_results
    source:
      - studies/
      - problems/*/synthesis/
      - migrations/foundational-problems-v2/transactions/
    interface: findings/index.yaml
    transformation: REFERENCE_ONLY
    completion: MAPPED_TO_RICHER_RECORDS

  runtime:
    target_role: deterministic_loaders_contract_validators_and_candidate_report_builder
    source:
      - scripts/validate_foundational_architecture.py
      - .github/workflows/validate-foundational-architecture.yml
    interface:
      - adapter.py
      - problem_bundles.py
      - tests/test_adapter.py
      - tests/test_hermeneutics.py
      - tests/test_methods.py
      - tests/test_problem_bundles.py
      - .github/workflows/validate-lean-interface.yml
    transformation: NEW_OPERATIONAL_LAYER
    completion: PARTIALLY_RECONSTRUCTED
    limit: >
      The runtime validates and loads speech, hermeneutic, method, and complete problem
      bundle contracts and structures candidate reports. It does not perform source
      interpretation, doctrinal certification, successor activation, or Assembly admission.

path_conflicts:
  - requested_path: problems/theologico-political.yaml
    existing_role: ACTIVE_PREDECESSOR
    resolution: PRESERVE_EXISTING_PATH_AND_LOAD_SUCCESSOR_BUNDLE_FROM_MANIFEST
    successor_path: problems/theologico-political/problem.yaml
    prohibition: DO_NOT_OVERWRITE_OR_REPURPOSE_WITHOUT_CERTIFIED_MIGRATION

non_effects:
  - No successor problem is certified or activated by this mapping.
  - No active predecessor is displaced.
  - No accepted migration source is superseded.
  - No source-specific finding is promoted beyond its recorded evidence status.
  - No synthesis is promoted to doctrine by being included in a bundle.
  - No Assembly authority is conferred; Sanctum validation remains separate.
  - Passing tests does not certify semantic completion or doctrine.
  - Substantive hermeneutic and method contracts do not certify their source-specific applications.
  - Complete bundle loading does not mean complete witness reconstruction or migration.

validation_states:
  structural_interface_valid_when:
    - manifest paths resolve
    - all declared YAML records parse
    - adapter validates manifest and speech contract
    - problem_bundles validates all seven complete bundle declarations and records
    - speech, hermeneutic, method, and problem-bundle tests pass
    - GitHub Actions passes on the implementing commit
  semantic_completion_requires:
    - replace reference-only corpus and findings indexes with typed exhaustive registries
    - expand source-specific and independent-witness reconstructions
    - complete recorded proposition-level migrations and their validation
    - validate actual candidate reports against method, hermeneutic, speech, problem, and Sanctum boundaries
  doctrinal_certification_requires:
    - separate source-grounded and migration-specific certification records
    - preservation of dissent, contradiction, and uncertainty
    - no self-certification by repository, adapter, minister, or artificial intelligence
  successor_activation_requires:
    - predecessor preservation
    - complete classified migration coverage
    - reference and schema validation
    - explicit authorized certification
    - no activation merely from bundle readiness

completed_production_units:
  - validated lean interface skeleton
  - operational completeness audit v1.0.0 through v1.3.0
  - substantive speech-mechanism contract
  - semantic speech-request validation and candidate report structure
  - speech behavioral tests
  - all six substantive hermeneutic contracts
  - hermeneutic contract behavioral tests
  - all four substantive inquiry method contracts
  - method contract behavioral tests
  - complete read-only foundational problem bundle loader
  - problem-bundle behavioral and preservation tests

next_production_units:
  - complete the typed corpus registry
  - complete the typed findings registry
  - expand independent source-specific witness reconstruction
  - create source-specific method and hermeneutic application fixtures
  - validate actual candidate ministerial reports

repinning_rule: >
  Sanctum may pin a new Strauss interface commit after structural and behavioral
  validation passes. The pin must preserve the interface's declared incompleteness and
  must not describe a validated interface as doctrinally certified or complete.
