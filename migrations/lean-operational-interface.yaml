        source: CORPUS-SRC-109
        derivation: FINDSET-008_TO_FINDSET-111
      - path: problems/athens-vs-jerusalem/synthesis/jerusalem-and-athens.yaml
        source: CORPUS-SRC-109
        derivation: FINDSET-008_TO_FINDSET-112
    limit: >
      Problem-local integration does not finish independent witnesses, proposition-level
      migration, doctrinal certification, predecessor transition, or successor activation.

  hermeneutics:
