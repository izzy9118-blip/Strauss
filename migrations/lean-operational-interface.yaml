    prohibition: DO_NOT_OVERWRITE_OR_REPURPOSE_WITHOUT_CERTIFIED_MIGRATION

non_effects:
  - No successor problem is certified or activated.
  - No active predecessor is displaced and no accepted migration source is superseded.
  - No source-specific finding is promoted beyond its record-local status.
  - No source text is admitted or distributed.
  - One source study is not independent corroboration or repository completion.
  - No Assembly authority is conferred; Sanctum validation remains separate.

validation_states:
  structural_interface_valid_when:
    - manifest paths and declared YAML records resolve
    - manifest, audit, mapping, corpus, findings, and process versions and counts agree
    - adapter validates manifest and speech contract
    - problem_bundles validates all seven complete bundles and twelve synthesis records
    - corpus_registry validates identities, witnesses, statuses, studies, predecessor equality, paths, counts, fingerprints, locators, and gaps
    - findings_registry validates twenty-five finding sets, exact record coverage, derivations, bindings, indexes, and gaps
    - all structural and behavioral tests pass
    - GitHub Actions passes on the implementing commit
  semantic_completion_requires:
    - reviewed witnesses and independent studies for remaining writings
    - original-edition comparison where wording or pagination requires it
    - expanded independent classical, biblical, medieval, and modern witnesses
    - source-specific method and hermeneutic application across the corpus
    - actual candidate-report validation against the full contract stack
  doctrinal_certification_requires:
    - separate source-grounded and migration-specific certification records
    - preserved dissent, contradiction, and uncertainty
    - no self-certification by repository, runtime, minister, or artificial intelligence
  successor_activation_requires:
    - predecessor preservation and complete classified migration coverage
    - reference and schema validation
    - explicit authorized certification
    - no activation merely from interface, witness, or study readiness

completed_production_units:
  - speech, hermeneutic, and method operational contracts
  - complete read-only foundational problem bundles
  - typed current-state corpus and findings registries
  - complete 19-of-19 Theologico-Political source-identity range
  - CORPUS-WIT-109 reviewed item witness
  - JA-STUDY-001 complete provisional source-specific reconstruction and two local synthesis bridges

next_production_units:
  - validate and merge this bounded integration
  - register and reconstruct the Cohen essay and Talmon review already locatable in SPPP
  - acquire and reconstruct the remaining sixteen item witnesses
  - expand independent witness reconstruction
  - validate actual candidate ministerial reports

repinning_rule: >
  Do not repin Sanctum as a completed Strauss interface while semantic completion remains
  INCOMPLETE. Passing validation establishes only the integrity of this bounded revision.
