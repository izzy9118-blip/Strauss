schema_version: 1.0
record_type: typed_corpus_registry

identity:
  id: STRAUSS-CORPUS-INDEX-001
  title: Strauss Repository Typed Corpus Registry
  version: 1.3.0

status:
  lifecycle: ACTIVE_OPERATIONAL_REGISTRY
  registry_scope: EXHAUSTIVE_FOR_CURRENT_COMMITTED_SOURCE_AND_STUDY_STATE
  corpus_completion: INCOMPLETE_OPEN_CORPUS
  certification: NOT_CERTIFIED
  authority: DISCOVERY_PROVENANCE_AND_SOURCE_STATUS_ONLY

revision_history:
  predecessor_version: 1.2.0
  predecessor_blob_sha: 16ad8a1491fe01bc338af7f1fb9471488b551521
  transformation: SUBSTANTIVE_FORWARD_REVISION
  reason: >
    Register the second item-level source-status record for the active nineteen-source
    Theologico-Political predecessor basis. The record establishes only the source identity,
    canonical alias, date, predecessor sequence, derivative contribution statement,
    missing-witness condition, and required next actions for Preface to Spinoza's Critique
    of Religion. It does not admit source text, complete an independent reading, promote the
    predecessor synthesis, certify doctrine or migration, activate a successor, or displace
    an active predecessor.

purpose: >
  Provide deterministic discovery, source identity, documentary status, provenance,
  problem binding, study binding, witness condition, and gap records without moving
  source records, distributing source texts, certifying doctrine, or treating a registered
  corpus as complete merely because every current record is indexed.

governing_protocols:
  source_status: protocols/source-status.yaml
  evidence_classification: protocols/evidence-classification.yaml
  inference_discipline: protocols/inference-discipline.yaml
  uncertainty_preservation: protocols/uncertainty-preservation.yaml
  textual_order: method/textual-order.yaml
  independent_reconstruction: method/reconstruct-alternatives.yaml

scope_rule: >
  This registry is exhaustive for source and study identities presently committed or
  explicitly enumerated by a governing repository record. It is not exhaustive of all
  works by Strauss, all editions or translations, all classical and biblical witnesses,
  or all sources required to complete the seven foundational problems.

identifier_rules:
  source_entity_prefix: CORPUS-SRC
  reviewed_witness_prefix: CORPUS-WIT
  study_record_prefix: CORPUS-STUDY
  source_status_prefix: CORPUS-STATUS
  gap_prefix: CORPUS-GAP
  identity_rule: >
    A source entity identifies a work or collection. A reviewed witness identifies a
    particular edition, translation, file, or textual presentation. A study record
    identifies repository analysis. These identities may not be collapsed.

