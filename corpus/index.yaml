validation_rules:
  - source, witness, status, study, and gap identifiers must be unique
  - every registered path must resolve within the repository
  - every study must bind to a registered source entity
  - all nineteen predecessor source titles and dates must match the active predecessor record
  - aliases and registered scopes must remain attached to the correct source identity
  - the active Theologico-Political predecessor must match its preserved copy
  - every canonical problem must have one registered witness registry
  - reviewed-container fingerprints must match source-status records where byte fingerprints exist
  - platform-reference witnesses must preserve missing byte custody, SHA256, file size, and edition comparison without fabricated substitutes
  - reviewed item witnesses must match their item source-status locator and witness records
  - missing, qualified platform-reference, and completed-study states must remain distinct
  - CORPUS-SRC-105, CORPUS-SRC-109, and CORPUS-SRC-111 alone record complete provisional independent item studies in this sequence
  - CORPUS-SRC-102 records a qualified reviewed witness but no independent sequential study
  - counts in coverage must match registry contents and the studies tree
  - source inclusion may not change certification, migration, or activation status
  - complete current-state indexing may not be described as a complete corpus

