scope_rule: This registry is exhaustive for source and study identities presently committed or explicitly enumerated by a
  governing repository record. It is not exhaustive of all works by Strauss, all editions or translations, all classical and
  biblical witnesses, or all sources required to complete the seven foundational problems.
