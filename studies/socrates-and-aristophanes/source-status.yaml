independent_witness_rule: >
  Strauss's reconstruction governs claims about Strauss's argument. It does not replace
  the independent surviving works, textual traditions, editions, translations, or
  documentary limits of Aristophanes, Plato, Xenophon, or other witnesses. Later
  comparisons must reconstruct those witnesses independently before ranking or synthesis.

evidence_rules:
  - rule_id: SA-SR-001
    rule: Distinguish Strauss's explicit statement from supported inference and unresolved question.
  - rule_id: SA-SR-002
    rule: Distinguish Strauss's account of Aristophanes from Aristophanes' own dramatic deed.
  - rule_id: SA-SR-003
    rule: Distinguish the young Socrates, mature Socrates, historical Socrates, Aristophanic Socrates, Platonic Socrates, and Xenophontic Socrates.
  - rule_id: SA-SR-004
    rule: Distinguish a character's speech, chorus judgment, dramatic victory, poetic action, and authorial teaching.
  - rule_id: SA-SR-005
    rule: Compare explicit doctrine with dramatic or textual deed; irony is not mechanical inversion.
  - rule_id: SA-SR-006
    rule: Treat comedy as potentially substantive evidence without treating ridicule or laughter as refutation or certification.
  - rule_id: SA-SR-007
    rule: Preserve the distinction between poetic theology, civic gods, prophecy, revelation, and divine law.
  - rule_id: SA-SR-008
    rule: Preserve the brother-problem relation between Philosophy vs. Poetry and The Theologico-Political Problem without absorption.
  - rule_id: SA-SR-009
    rule: OCR text must be checked against page images where wording or names affect a finding.

