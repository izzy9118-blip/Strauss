source_classes:
  strauss_argument:
    class: AUTHOR_PUBLISHED_PRIMARY_STRAUSS_SOURCE
    permitted_use:
      - reconstruct Strauss's explicit argument and compositional deed
      - identify Strauss's ordering, distinctions, questions, and conclusions
      - support source-specific findings with reproducible page or unit locators
    prohibited_use:
      - replace Aristophanes' surviving plays as independent poetic witnesses
      - replace Plato or Xenophon as independent Socratic witnesses
      - convert Strauss's interpretation into direct historical evidence about Socrates
  aristophanes_material:
    class: STRAUSS_MEDIATED_PRESENTATION_REQUIRING_INDEPENDENT_PRIMARY_RECONSTRUCTION
  socrates_material:
