source_handling_rules:
  - Strauss's essays govern claims about Strauss's argument.
  - Pangle's introduction is secondary and provisional.
  - Cropsey's foreword governs editorial provenance only.
  - Collection order may be examined as structural evidence but must not be treated
    as demonstrated complete authorial design.
  - Item-level original publication history remains separately verifiable and must
    not be inferred from inclusion in the collection.
  - The source must not be treated as a completed Platonic corpus.
  - Plato, Xenophon, Thucydides, the Bible, Maimonides, Machiavelli, Nietzsche,
    Hobbes, Locke, Talmon, Macpherson, and Cohen remain independent witnesses or
    subjects requiring source-specific reconstruction.
  - Structural correspondence, omission, chapter count, and sequence must remain
    distinct from demonstrated authorial intention.

