source_classes:
  strauss_essays:
    class: QUALIFIED_PRIMARY_STRAUSS_SOURCES
    rule: >
      Each Strauss essay, note, review, preface, or introductory essay remains a
      primary witness for Strauss's argument subject to its original date, occasion,
      audience, publication condition, and independent sequence.
  cropsey_foreword:
    class: EDITORIAL_CONTEXT
    permitted_use:
      - publication provenance
      - collection history
      - bibliographic orientation
    prohibited_use:
      - supplying Strauss's missing doctrine
      - governing the meaning of Strauss's essays
  pangle_introduction:
    class: SECONDARY_EDITORIAL_AND_INTERPRETIVE_CONTEXT
    permitted_use:
      - provisional orientation
      - bibliographic guidance
      - questions for testing against primary essays
    prohibited_use:
      - substituting for Strauss's intended introduction
      - deciding Strauss's final doctrine
      - deciding the truth of Plato, revelation, or the foundational problems

