evidence_rules:
  - rule_id: SPPP-SR-001
    rule: Distinguish Strauss's explicit statement from supported inference and unresolved question.
  - rule_id: SPPP-SR-002
    rule: Distinguish an essay's original occasion from its later placement in the collection.
  - rule_id: SPPP-SR-003
    rule: Distinguish a speaker, character, narrator, quoted source, or reviewed author from Strauss.
  - rule_id: SPPP-SR-004
    rule: Distinguish political efficacy, legal authority, historical causation, and philosophical or theological truth.
  - rule_id: SPPP-SR-005
    rule: Distinguish civic gods and poetic theology from genuine revelation and divine law.
  - rule_id: SPPP-SR-006
    rule: Distinguish legal or practical presumption from demonstration.
  - rule_id: SPPP-SR-007
    rule: Distinguish structural evidence from demonstrated deliberate authorial intention.
  - rule_id: SPPP-SR-008
    rule: Preserve source-composition uncertainty and assign intention to the correct documentary layer.

