governing_protocol_integration:
  protocol: speech-and-deed
  status: COMPLETE_STUDY_CONTRIBUTION_READY_FOR_SHARED_PROTOCOL_RECORD
  findings:
    - speaker, audience, occasion, speech, action, outcome, and source status must remain distinct
    - structural evidence must remain distinct from demonstrated intention
    - irony does not authorize mechanical reversal
    - omission is evidence only where presence is reasonably expected
    - report is not certification
    - preserved vocabulary may conceal transformed doctrinal referents
    - composite and incomplete works require documentary-layer control
  required_next_record: shared protocol revision or successor transaction

safeguards:
  - no silent revision of predecessor problem objects
  - no certification from completion of a single Strauss-source study
  - no activation of pending problem successors
  - no merger of the seven problem jurisdictions
  - no treatment of Pangle's Introduction as Strauss's missing introduction
  - no treatment of the posthumous order as a fully demonstrated hidden treatise
  - no replacement of independent classical, biblical, medieval, or modern witnesses by Strauss's interpretations
  - no conversion of political utility into truth
  - no conversion of philosophy's nonrefutation of revelation into proof of revelation
  - no wisdom certification by office, title, success, suffering, secrecy, scholarship, or self-description

recommended_transactions:
  - sequence: 1
    transaction: Register SPPP-STUDY-001 in Philosophy vs. Poetry witness registry.
  - sequence: 2
    transaction: Register SPPP-STUDY-001 in Theologico-Political witness registry and reconcile relevant nineteen-source entries.
  - sequence: 3
    transaction: Use this study as the first common documentary basis for the five pending foundational-problem successor objects.
  - sequence: 4
    transaction: Create or revise the shared speech-and-deed protocol from the collection-level synthesis.
  - sequence: 5
    transaction: Validate paths, identifiers, YAML, and cross-problem references before any certification request.

