  edition: University of Chicago Press, 1983
  source_class: QUALIFIED_PRIMARY_STRAUSS_COLLECTION
  source_limit: >
    Strauss's essays are primary evidence for Strauss's arguments. The collection is
    posthumous, its title and arrangement were chosen by Strauss, and the projected
    authorial introduction and projected essay on Plato's Gorgias were not completed.
    Pangle's introduction is secondary and Cropsey's foreword is editorial provenance.

independence_rule: >
  This record reconstructs Strauss's arguments in this collection. It does not replace
  independent reconstruction of Plato, Xenophon, Thucydides, the Bible, Maimonides,
  Machiavelli, Nietzsche, Hobbes, Locke, Talmon, Macpherson, Cohen, or the historical
  Socrates, and it does not convert Strauss's interpretation into the final meaning of
  those witnesses.

