source_limits:
  - The reviewed witness is the 1997 SUNY collected text, not a separately reviewed copy of the 1981 L'Homme publication or Strauss's 1957 typed lecture manuscript.
  - The notes beginning on printed page 375 are explicitly identified by the editor as entirely editorial and therefore may not be treated as Strauss's notes.
  - The editor states that the 1997 version reproduces the previously published text while preserving two textual difficulties discussed in editorial note 16; this study does not independently compare the 1981 text or the typed manuscript.
  - Strauss's Hebrew, biblical, Platonic, Aristotelian, Herodotean, Hegelian, and other represented claims remain independently unreconstructed unless separately registered.
  - Strauss's reconstruction of Genesis is not independent corroboration of the biblical text, its authorship, its historical origin, or any theological doctrine.
  - The study does not decide the truth of revelation, the existence or nonexistence of an omnipotent God, the possibility of miracles, or the truth of philosophy.

