source_limits:
  - The source identity covers only the last paragraph, not the complete Restatement or On Tyranny debate.
  - Green's notes supply transmission history and interpretive suggestions; they are a separate editorial layer and are not Strauss's argument.
  - Green's statement that the paragraph is the closest thing to a metaphysical confession of faith and his suggestion of theological implications may not be attributed to Strauss.
  - The registered paragraph does not use the phrase universal state; any such predecessor language must remain qualified unless supported from outside this bounded scope.
