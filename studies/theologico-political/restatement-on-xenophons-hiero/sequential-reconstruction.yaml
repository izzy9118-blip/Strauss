method_application:
  governing_question: What ultimate issue does Strauss say lies beneath the dispute with Kojeve about tyranny and wisdom, and how does the classical idea of philosophy differ from Kojeve’s historical ontology?
  reconstruction_rule: Read only the registered last paragraph as Strauss's argument, then separately record Green’s notes as provenance and editorial interpretation.
sequential_reading:
  - unit: HIERO-LAST-RU-001
    printed_pages: 471
    findings:
      - {id: HIERO-LAST-DF-001, classification: documented_finding, proposition: 'Strauss says the most he hopes to have shown against Kojeve is that Xenophon’s thesis on tyranny and wisdom is compatible with and required by the idea of philosophy; he immediately calls this very little because philosophy itself still requires legitimation.'}
      - {id: HIERO-LAST-DF-002, classification: documented_finding, proposition: 'Classical philosophy is defined as the quest for the eternal order or eternal cause or causes of all things and therefore presupposes an unchangeable order within which History occurs without altering that order.'}
      - {id: HIERO-LAST-DF-003, classification: documented_finding, proposition: 'The classical presupposition makes every realm of freedom dependent within the realm of necessity; Strauss explicitly says this presupposition is not self-evident.'}
  - unit: HIERO-LAST-RU-002
    printed_pages: 471-472
    findings:
      - {id: HIERO-LAST-DF-004, classification: documented_finding, proposition: 'Kojeve’s opposed presupposition is that Being creates itself in History, that the highest being is Society and History, or that eternity is the totality of finite historical time.'}
      - {id: HIERO-LAST-DF-005, classification: documented_finding, proposition: 'On the classical basis, the social and political conditions under which philosophy exists must be radically distinguished from the sources of philosophic insight.'}
      - {id: HIERO-LAST-DF-006, classification: documented_finding, proposition: 'On Kojeve’s basis, social change or fate affects Being and therefore affects truth, so unqualified attachment to human concerns becomes a source of philosophic understanding.'}
      - {id: HIERO-LAST-DF-007, classification: documented_finding, proposition: 'The opposed human postures are absolute citizenship of the earth under Kojeve and classical detachment from human concerns in which man is not absolutely at home on earth but is a citizen of the whole.'}
      - {id: HIERO-LAST-DF-008, classification: documented_finding, proposition: 'Strauss says the conflict of presuppositions has barely been mentioned but has governed the discussion; the turn from Being to Tyranny arose because evasion of tyranny also forced evasion of Being.'}
  - unit: HIERO-LAST-RU-003
    printed_pages: 472-473
    function: Preserve editorial transmission and interpretation without absorption into Strauss's argument.
    findings:
      - {id: HIERO-LAST-DF-009, classification: documentary_finding, proposition: 'Green reports that the paragraph appeared in the 1954 French edition, was absent from the 1963 complete English edition, was retranslated from French in the 1991 edition, and is printed in the 1997 collection from an original English typescript supplied through Laurence Berns.'}
      - {id: HIERO-LAST-DF-010, classification: documentary_limit, proposition: 'Green’s metaphysical-confession and theological-implication claims are editorial interpretations and are not Strauss statements.'}
permanent_findings:
  - {id: HIERO-LAST-PF-001, classification: documented_finding, proposition: 'The last paragraph identifies the deepest dispute with Kojeve as the legitimation of classical philosophy’s presupposition of eternal unchanging order against historical self-creation of Being.'}
  - {id: HIERO-LAST-PF-002, classification: documented_finding, proposition: 'The classical position distinguishes political conditions of philosophy from sources of philosophic truth; the historicist position threatens that distinction by making social-historical change constitutive of Being and truth.'}
  - {id: HIERO-LAST-PF-003, classification: documented_finding, proposition: 'The practical contrast is between attachment to human-historical concerns and philosophic detachment toward the whole.'}
  - {id: HIERO-LAST-PF-004, classification: documentary_limit, proposition: 'The registered paragraph does not itself formulate a doctrine of a universal state or theological implications.'}
problem_jurisdiction:
  theologico_political:
    role: PRIMARY_AS_REGISTERED_SEQUENCE_WITH_INDIRECT_METAPHYSICAL_CONTRIBUTION
    receives: [legitimation of philosophy, eternal order versus historical creation, distinction between conditions and sources of truth]
    non_absorption: The paragraph does not discuss revelation or theology; theological implications in the notes are Green’s.
  ancients_vs_moderns:
    role: CONTROLLED_SECONDARY_JURISDICTION
    receives: [classical philosophy versus Kojeve, eternal order versus historicism, citizen of the whole versus citizen of the earth]
    non_absorption: The paragraph does not stand for the whole ancient-modern dispute.
  theory_vs_practice:
    role: CONTROLLED_SECONDARY_JURISDICTION
    receives: [tyranny as practical-political issue, conditions of philosophy versus sources of insight, attachment to human concerns versus detachment]
    non_absorption: Political conditions are not identified with sources of philosophic truth on the classical account.
comparison_with_active_predecessor:
  predecessor: problems/theologico-political.yaml
  predecessor_statement: Deepens the problem through the dispute over tyranny, wisdom, the universal state, eternity, history, and whether truth is discovered or historically created.
  state: PROVISIONAL_RETEST_STRONG_CONFIRMATION_WITH_REGISTERED_SCOPE_QUALIFICATION_NO_PROMOTION
  confirmations:
    - The paragraph directly joins tyranny and wisdom to the legitimation of philosophy and explicitly opposes eternal order to Being created in History.
    - It directly asks whether social-historical change affects truth or whether truth comes from sources distinguishable from political conditions.
  qualifications:
    - The registered last paragraph does not use the phrase universal state; that part of the predecessor formulation requires evidence from outside this bounded scope.
    - Green’s theological reading is editorial and may not be counted as Strauss evidence.
  predecessor_effect: NONE
