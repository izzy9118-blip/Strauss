  statement: Distinguishes the political dignity and necessity of Jewish statehood from redemption, messianic fulfillment, or proof of providence.
  retest_result: >
    The study strongly confirms political dignity and moral force: Zionism is connected with restoration of inner freedom,
    heritage, loyalty to fate, and simple dignity after the limits of emancipation. It also confirms that Zionism remains
    explicitly problematic rather than an unqualified fulfillment. The study materially qualifies the predecessor because
    this letter does not explicitly discuss redemption, messianic fulfillment, or providence, and it states political
    dignity and moral force more clearly than a systematic doctrine of political necessity.
  preservation_rule: >
    Partial confirmation and material qualification do not silently revise, migrate, certify, activate, or displace the active predecessor.
