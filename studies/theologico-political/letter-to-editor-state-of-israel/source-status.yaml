required_distinctions:
  - political dignity and moral force from theological redemption or providential proof
  - nobility of effort from exclusive success calculation
  - heritage from lethargic traditionalism
  - formal equality from inner freedom
  - institutional label from meaning in historical circumstances
  - political Zionism's acknowledged problematic character from rejection of its moral achievement
  - source-local conservative criteria from a complete general doctrine of conservatism
  - reviewed 1997 collected reprint from separately reviewed 1957 National Review printing
prohibitions:
  - Do not claim that this letter explicitly separates Zionism from redemption, messianic fulfillment, or providence; those terms are absent from its argument.
  - Do not convert the favorable judgment of Israel into doctrinal certification of Zionism or the state of Israel.
  - Do not convert the repeated rhetorical definition of a conservative into a complete repository doctrine of conservatism.
  - Do not treat Strauss's observations about Israel, labor, marriage, constitutional life, or Herzl as independent historical corroboration.
  - Do not infer Athens-versus-Jerusalem merely from the Bible, West, or East language.
  - Do not treat source-specific reconstruction as independent corroboration.
  - Do not certify doctrine, migration, successor activation, predecessor displacement, or repository completion.
