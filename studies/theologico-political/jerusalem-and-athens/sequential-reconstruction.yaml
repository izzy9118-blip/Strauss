source_limits:
  - The reviewed witness is the 1983 collected reprint, not a separately reviewed copy of the 1967 printing.
  - The collection is posthumous; Strauss selected its title and order but did not complete its intended introduction.
  - Joseph Cropsey's Foreword supplies publication provenance only.
  - Thomas L. Pangle's Introduction is secondary and provisional and does not govern Strauss's essay.
  - The collection-level SPPP studies and the active predecessor are derivative analytical records, not independent witnesses to this essay.
  - The registered Part V scope may not substitute for reconstruction of the complete essay.

