  - Cropsey's editorial provenance and Pangle's secondary introduction from Strauss's essay
  - reviewed witness from sequential reconstruction and both from independent corroboration
  - Athens vs Jerusalem jurisdiction from the broader Theologico-Political problem
  - poetic theology from revelation and divine law

