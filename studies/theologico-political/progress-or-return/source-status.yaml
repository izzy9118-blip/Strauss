predecessor_contribution_record:
  evidence_status: PROVISIONALLY_RETESTED_BY_INDEPENDENT_SEQUENTIAL_RECONSTRUCTION
  statement: >
    Establishes progress and return as rival orientations and presents the unresolved conflict between the biblical and philosophic accounts of the good life as a living foundation of Western civilization.
  retest_result: >
    The study confirms progress and return as rival orientations and confirms Jerusalem and Athens as the two fundamental
    Western sources whose unresolved tension constitutes Western life. It qualifies return as return to two conflicting
    roots rather than one homogeneous tradition and records the stronger final argument that revelation and philosophy
    cannot refute one another, that human reason cannot settle their conflict, and that philosophy itself is described
    as resting on an act of faith within this confrontation.
  preservation_rule: >
    Provisional confirmation and qualification do not certify, migrate, activate, displace, or silently rewrite the active predecessor.
