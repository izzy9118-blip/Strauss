source_limits:
  - The reviewed witness is the 1997 SUNY collected text, not a separately reviewed copy of the 1979 or 1981 posthumous publications or an original 1952 lecture transcript independent of this editorial witness.
  - Printed page 132 contains the end of Strauss's discussion and the beginning of editorial notes; those layers are kept distinct.
  - Biblical, Platonic, Aristotelian, Nietzschean, Spinozist, Christian, Jewish, Islamic, and modern scientific or historical claims remain independently unreconstructed unless separately registered.
  - Strauss's descriptions of biblical and Greek alternatives are source-level reconstructions and not independent corroboration of either tradition.
  - The study does not decide whether revelation is true, whether philosophy is true, whether historical progress is impossible, or whether one of Jerusalem and Athens is ultimately superior.
  - Strauss's final claim that philosophy itself rests on an act of faith is reconstructed as his source-level argument here and is not silently generalized into a repository doctrine about all philosophy.

