source_limits:
  - Dean Goldwin, Jacob Klein, Leo Strauss, and questioners are distinct speakers; only Strauss's statements are Strauss evidence.
  - A recorded tape break occurs in the question period and must remain a documentary discontinuity.
  - Strauss explicitly says his life is relevant as a starting point and possible explanation of pitfalls; autobiography therefore may not be treated as a doctrinal confession.
  - Claims about Cohen, Husserl, Barth, Rosenzweig, Heidegger, Lessing, Spinoza, Maimonides, Avicenna, Plato, Aristotle, Aquinas, Kant, Rousseau, and Nietzsche remain Strauss's source-level representations unless independently reconstructed.
method_application:
  governing_question: How does Strauss narrate the genesis of his theologico-political inquiry, his recovery of exotericism and classical philosophy, and his difference with Klein concerning the city and morality?
  reconstruction_rule: Preserve speaker identity and chronology while reconstructing Strauss's own account, then compare it with the predecessor without treating autobiography as final doctrine.
