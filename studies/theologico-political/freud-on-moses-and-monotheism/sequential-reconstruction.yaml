source_limits:
  - The reviewed witness is the 1997 posthumously published transcription, not an authorially reviewed lecture manuscript.
  - The collection editor states that Strauss apparently used prepared notes that do not survive, that an unknown transcriber made the transcription from a tape recording, and that Strauss appears not to have reviewed or formally approved the transcribed version.
  - The collection editor acknowledges making certain additions and corrections to spoken verb tenses in one paragraph; the published body is therefore not treated as a mechanically exact transcript of Strauss's spoken words.
  - The notes beginning on printed page 306 are entirely the work of Kenneth Hart Green and are not used as Strauss evidence except to establish documentary provenance and editorial condition.
  - The collection Sources section supplies no earlier publication citation for the item; absence of a citation is not proof that no earlier publication or textual state existed.
  - Freud's historical, psychoanalytic, ethnological, and biographical claims are reconstructed only as Strauss represents and criticizes them unless independently reviewed elsewhere.
  - Biblical, prophetic, Platonic, Nietzschean, Freudian, Egyptian, Jewish, Christian, and ethnological sources represented in the lecture remain independently unreconstructed here.
  - This study does not decide the truth of revelation, the existence of God, the validity of psychoanalysis, or the truth of Freud's reconstruction of Moses.

