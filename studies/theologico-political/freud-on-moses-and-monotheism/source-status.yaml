required_distinctions:
  - Strauss's lecture body from Green's editor-authored notes
  - primary Strauss content from unknown-transcriber mediation
  - published transcript from authorially reviewed or formally approved wording
  - Green's limited emendations from the transcriber's unemended wording
  - interpretation of religious teaching from causal explanation of its genesis
  - causal explanation from rational refutation
  - historical possibility from demonstrated historical fact
  - agnosticism from atheistic certainty
  - possible rationality of ancient reverence from proof of revelation
  - hypothetical scientific premises from a wholesale rejection of science
  - Theologico-Political primary jurisdiction from Ancients-versus-Moderns controlled secondary jurisdiction
prohibitions:
  - Do not treat the reviewed transcript as authorially approved verbatim wording.
  - Do not attribute Green's notes, documentary conjectures, or acknowledged emendations to Strauss.
  - Do not treat the absence of an earlier publication citation in the collection Sources section as proof that no earlier textual state existed.
  - Do not treat Freud's historical or psychoanalytic claims as independently verified because Strauss reconstructs them.
  - Do not treat Strauss's alternative historical possibilities as certified historical facts.
  - Do not convert the possibility of Presence, Call, mystery, or religious interpretation into proof of God or revelation.
  - Do not infer that all science is irrational or false from the source's critique of science's ungrounded value choice and hypothetical premises.
  - Do not expand the study into Wise-versus-Vulgar or Athens-versus-Jerusalem merely because communication, Jews, Moses, Bible, or Greek materials appear.
  - Do not treat source-specific reconstruction as independent corroboration.
  - Do not certify doctrine, migration, successor activation, predecessor displacement, or repository completion.
