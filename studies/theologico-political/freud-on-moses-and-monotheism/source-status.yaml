verified_documentary_facts:
  - The reviewed 1997 SUNY collected witness occupies printed pages 285-309 and one-based PDF pages 304-328.
  - The lecture body runs through printed page 306; the Notes begin on printed page 306 and continue through page 309.
  - The reviewed container has SHA-256 43e98521c28a9ef8ede1eb7a6507d8ee78d605d0a531624d5dd20075220bda66 and file size 39287307 bytes.
  - The collection editor states that the lecture was delivered at Hillel House, University of Chicago, apparently in the spring quarter of 1958, while the precise date is unknown to him.
  - The editor states that Strauss apparently used previously prepared notes that do not survive and that an unknown transcriber made a transcription from a tape recording.
  - The editor states that the published version is based on that transcription and that it appears Strauss did not review or formally approve the lecture in its transcribed version.
  - The editor states that the notes to the lecture are entirely his own work.
  - In note 4 the editor reports making certain additions and corrections to contradictory spoken verb tenses in one paragraph and reproduces three unemended passages so readers can judge the intervention.
  - The editor reports that no tape or transcript of the discussion period following the lecture survives.
  - The collection Sources section supplies no earlier publication citation for this item and acknowledges publication with permission of Joseph Cropsey and the Estate of Leo Strauss.
  - FREUD-MOSES-STUDY-001 reconstructs the lecture body sequentially before comparing it with the active predecessor and keeps the editor's documentary note layer separate.
predecessor_contribution_record:
  evidence_status: PROVISIONALLY_RETESTED_BY_INDEPENDENT_SEQUENTIAL_RECONSTRUCTION
  statement: Examines psychological and historical explanation as a proposed substitute for revelation and tests whether causal explanation constitutes refutation.
  retest_result: >
    The study confirms that Strauss tests Freud's historical and psychological explanation against the prior question of
    truth and argues that causal explanation does not itself refute revelation. It qualifies the predecessor by showing that
    the critique also turns on responsible historical evidence, interpretation of the biblical whole, the possible
    rationality of ancient reverence and law, the hypothetical and evaluatively incomplete status of science, and philosophy
    as a nonderivative human possibility. The closing appeal to Nietzsche's last man supplies a controlled secondary
    Ancients-versus-Moderns jurisdiction.
  preservation_rule: >
    Provisional confirmation and qualification do not certify, migrate, activate, displace, or silently rewrite the active predecessor.
