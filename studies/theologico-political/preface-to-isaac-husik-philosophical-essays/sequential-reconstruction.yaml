source_limits:
  - The reviewed witness is the 1997 SUNY collected text, not a separately reviewed copy of the 1952 Basil Blackwell printing.
  - The collection identifies the preface as a Leo Strauss writing, but the closing statement on printed page 264 speaks in the plural as the editors of the 1952 Husik volume; that collective editorial layer is not silently collapsed into single-author speech.
  - The notes on printed pages 264-266 are documentary apparatus. Later bracketed cross-references marked Ed. belong to the 1997 collected-edition editorial layer.
  - Husik's philosophical positions are reconstructed as represented in this preface and are not independent corroboration of Husik's works, medieval Jewish philosophy, Judaism, Greek philosophy, or modern jurisprudence.
  - The study does not decide whether Jewish philosophy is possible, whether orthodoxy is true, whether radical historicism is false in every form, or whether Husik's jurisprudence supplies an adequate theory of justice.
  - The study preserves the tension between historical objectivity and philosophical presupposition rather than turning it into a repository-wide doctrine about all historiography.

