predecessor_contribution_record:
  evidence_status: PROVISIONALLY_RETESTED_BY_INDEPENDENT_SEQUENTIAL_RECONSTRUCTION
  statement: Distinguishes the living confrontation between philosophy and revealed law from an antiquarian history of medieval Jewish philosophy.
  retest_result: >
    The study confirms that Husik treats medieval Jewish philosophy as historically antiquarian in its immediate modern
    function while grounding it in the opposition between universal free inquiry and revealed Law. It qualifies the
    predecessor by showing that the historical inquiry becomes philosophically live again when the possibility of objective
    history, radical historicism, orthodoxy, and Husik's own demand for a modern philosophy of Judaism are tested. The
    jurisprudential conclusion further preserves the boundary between rational justice and possible moral faith.
  preservation_rule: >
    Provisional confirmation and qualification do not certify, migrate, activate, displace, or silently rewrite the active predecessor.
