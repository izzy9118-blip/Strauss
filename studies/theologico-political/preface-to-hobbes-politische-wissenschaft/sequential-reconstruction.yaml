source_limits:
  - The reviewed witness reproduces Donald J. Maletz's English translation of Strauss's 1965 German preface; the 1965 German text and the 1979-80 Interpretation printing have not been separately reviewed.
  - The 1997 collection reproduces Strauss's new comments through printed page 454 and then ends with the sentence introducing what Strauss had said thirteen years earlier; the three remaining paragraphs of the 1965 preface are not reproduced in the body of this collected item.
  - Editorial note 8 identifies those omitted three paragraphs as a German translation of the Preface to the American Edition of The Political Philosophy of Hobbes (1952), xv-xvi; this study does not treat the omitted paragraphs as if their wording had been reviewed here.
  - The notes on printed pages 454-456 were not provided by Strauss; the collection states that they are based on Donald J. Maletz's notes, with bracketed additions by the present editor.
  - Hobbes, Spinoza, Kant, Carl Schmitt, Julius Ebbinghaus, Gerhard Kruger, Jacob Klein, and represented texts remain independently unreconstructed unless separately registered.
  - Strauss's retrospective self-report is primary evidence for his stated intellectual development but not independent proof of the doctrines or historical roles of the thinkers he names.

