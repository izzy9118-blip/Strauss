verified_documentary_facts:
  - The reviewed 1997 SUNY collected witness occupies printed pages 453-456 and one-based PDF pages 472-475.
  - Strauss's preface text reproduced in the collection occupies printed pages 453-454; translator/editorial notes begin on printed page 454 and continue through page 456.
  - The reviewed container has SHA-256 43e98521c28a9ef8ede1eb7a6507d8ee78d605d0a531624d5dd20075220bda66 and file size 39287307 bytes.
  - Editorial note 1 states that Strauss added the preface to the 1965 first publication of the German original of his Hobbes book and that its first English translation appeared in Interpretation 8, no. 1 (1979-80), pages 1-3, translated by Donald J. Maletz; that translation is reproduced in the 1997 collection.
  - Editorial note 8 states that the remaining three paragraphs of the 1965 preface are a German translation of the Preface to the American Edition of The Political Philosophy of Hobbes (1952), xv-xvi; those paragraphs are not reproduced in the reviewed item body.
  - HOBBES-PREFACE-STUDY-001 reconstructs the reviewed item sequentially in six bounded reading units before comparison with the active predecessor.
predecessor_contribution_record:
  evidence_status: PARTIALLY_RETESTED_WITH_DOCUMENTARY_LIMIT
  statement: >
    Names the theologico-political problem as a continuing theme of Strauss's investigations and examines sovereign peace as political neutralization rather than philosophic resolution.
  retest_result: >
    The study directly confirms Strauss's explicit statement that the theologico-political problem has remained the theme
    of his investigations and reconstructs its connection to Spinoza, biblical criticism, revived theology, Hobbes, true
    politics, and the ancient-modern dispute. The sovereign-peace formulation cannot be independently retested because
    the reviewed 1997 body omits the final three paragraphs to which editorial note 8 points.
  preservation_rule: >
    The untestable portion remains a predecessor claim rather than a promoted source finding. Provisional confirmation of
    the continuity claim does not certify, migrate, activate, displace, or silently rewrite the active predecessor.
