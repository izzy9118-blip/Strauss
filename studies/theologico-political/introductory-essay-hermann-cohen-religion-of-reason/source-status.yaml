required_distinctions:
  - Strauss's essay from Hermann Cohen's book
  - Cohen's position from Strauss's reconstruction and judgment
  - rationalized revelation from traditional historical and miraculous revelation
  - reviewed 1983 collected reprint from the 1972 English-translation printing
  - witness registration from sequential study and both from independent corroboration
  - collection-level synthesis from item-level reconstruction
  - reconciliation project from demonstrated resolution
  - Theologico-Political jurisdiction from Athens-versus-Jerusalem and Ancients-versus-Moderns

prohibitions:
  - Do not identify Cohen's claims with Strauss's doctrine.
  - Do not treat common vocabulary as proof that traditional revelation and autonomous reason are reconciled.
  - Do not let Pangle's Introduction govern Strauss's item argument.
  - Do not infer original-edition wording where the 1972 printing has not been compared.
  - Do not count collection-level and item-level records as independent corroboration.
  - Do not certify doctrine, migration, successor activation, or predecessor displacement.

