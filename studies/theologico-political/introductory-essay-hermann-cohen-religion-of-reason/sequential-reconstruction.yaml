independence_rule: >
  Reconstruct Strauss's essay from beginning to end without treating the active predecessor,
  Pangle's Introduction, the collection-level SPPP synthesis, or Cohen's own claims as
  governing Strauss's judgment. Comparison follows only after the item reconstruction.

activated_problems:
  - canonical_key: theologico-political
    reason: >
      The essay tests a modern rational reconciliation of revelation, reason, divine law,
      moral autonomy, messianism, and Jewish fidelity.
  - canonical_key: athens-vs-jerusalem
    reason: >
      Cohen seeks harmony between Judaism and autonomous culture while preserving Judaism
      as the source of the religion of reason.
  - canonical_key: ancients-vs-moderns
    reason: >
      Kantian ethics, modern liberal culture, historical progress, Reform, Zionism, and the
      modern state reorganize inherited Jewish law and theology.

