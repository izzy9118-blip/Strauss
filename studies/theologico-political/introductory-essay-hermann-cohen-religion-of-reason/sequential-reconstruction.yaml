source_limits:
  - The reviewed witness is the 1983 collected reprint, not a separately reviewed copy of the 1972 Frederick Ungar printing.
  - The collection is posthumous; Strauss selected its title and order but did not complete its intended introduction.
  - Joseph Cropsey's Foreword supplies publication provenance only.
  - Thomas L. Pangle's Introduction is secondary and provisional and does not govern Strauss's essay.
  - The collection-level Studies in Platonic Political Philosophy records and the active predecessor are derivative analytical records, not independent witnesses to this essay.
  - Strauss's reconstruction of Hermann Cohen is not a substitute for independent reconstruction of Cohen's Religion of Reason, Ethics, or System of Philosophy.

