source_limits:
  - The reviewed witness is a qualified platform-reference witness; its exact bytes, digest, file size, and one-based PDF-page offset are unavailable to the repository.
  - The reviewed text is the 1997 editorial composite, not a separately reviewed 1965 Schocken printing or 1968 Liberalism Ancient and Modern reprint.
  - Kenneth Hart Green's editorial introduction, notes, selection, and assumptions provide secondary documentary context and do not govern Strauss's argument.
  - Thomas L. Pangle's Introduction to Studies in Platonic Political Philosophy is secondary and explicitly provisional; it did not govern this reconstruction.
  - Spinoza, Cohen, Rosenzweig, Buber, Heidegger, Nietzsche, Zionist writers, Jewish orthodoxy, and the represented historical events remain independently unreconstructed unless separately registered.
  - Sequential reconstruction establishes a source-local account of Strauss's argument; it does not establish the truth or falsity of revelation, miracle, orthodoxy, atheism, Zionism, liberal democracy, or any represented doctrine.

