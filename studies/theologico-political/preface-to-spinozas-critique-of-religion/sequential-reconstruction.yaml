      The final formula concerning literal reading is explicit, but its complete application to
      Spinoza requires the separate sequential reconstruction of the relevant Spinozist texts.

prohibitions:
  - Do not let the active predecessor or Pangle govern the source reconstruction.
  - Do not treat the predecessor statement as a quotation from Strauss.
  - Do not identify historical or political defeat with rational refutation.
  - Do not infer the actuality of revelation from reason's inability to exclude it.
  - Do not infer that a miracle occurred from the possibility of miracle.
  - Do not treat political dignity, statehood, survival, catastrophe, persecution, or moral seriousness as theoretical proof.
  - Do not identify the 1997 editorial composite with separately reviewed 1965 or 1968 textual states.
  - Do not treat a platform object identifier as a digest or reviewability as repository custody.
  - Do not treat attention to persecution and audience as mechanical reversal or unrestricted deception.
  - Do not identify Strauss's reconstruction of another thinker with that thinker's independently established doctrine.
  - Do not certify doctrine, migration, successor activation, predecessor displacement, or repository completion.

