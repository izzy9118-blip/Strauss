predecessor_contribution_record:
  evidence_status: PREDECESSOR_SYNTHESIS_CLAIM_RETESTED_AND_PROVISIONALLY_QUALIFIED_BY_SPINOZA_PREFACE_STUDY_001
  statement: >
    Reconsiders the alleged rational defeat of orthodoxy and asks whether reason can
    exclude miracle or revelation without a demonstrated exhaustive account of the whole.
  statement_status: PREDECESSOR_SYNTHESIS_PARAPHRASE_NOT_SOURCE_QUOTATION
  study_result: >
    SPINOZA-PREFACE-STUDY-001 confirms that the Preface distinguishes orthodoxy's
    historical or political defeat from rational refutation and argues that excluding
    revelation would require a comprehensive account of the whole not supplied by
    Spinoza. It qualifies the predecessor by distinguishing possibility from actuality,
    orthodoxy claiming knowledge from orthodoxy resting on belief, an ambiguous victory
    for orthodoxy in general from a victory for Jewish orthodoxy, and modern rationalism
    from the reopened possibility of premodern rationalism.
  preservation_rule: >
    Retesting does not certify, supersede, activate, migrate, or displace the active predecessor.

