source_limits:
  - The reviewed witness is the 1997 SUNY collected reprint, not a separately reviewed 1952 Free Press printing.
  - Printed page 428 contains the conclusion of Strauss's argumentative body and the beginning of the notes; the notes continue through printed page 429.
  - Farabi, Maimonides, Halevi, Averroes, Avicenna, Plato, Aristotle, Thomas Aquinas, Jewish law, Islamic law, Christian scholasticism, and the represented historical traditions remain independently unreconstructed unless separately registered.
  - Strauss's reconstruction of the falasifa and medieval religious communities is not independent corroboration of their doctrines, institutions, or historical development.
  - Exoteric writing is established here as a source-level possibility and practice under specified political conditions; it is not a license to assume concealed teaching in every philosophic text.
  - This study does not certify philosophy as true, religion as false, or a stable social identity of philosophers as wise persons.

