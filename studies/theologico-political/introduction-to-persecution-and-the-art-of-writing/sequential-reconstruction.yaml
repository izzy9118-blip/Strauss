method_application:
  governing_question: >
    What political and social conditions make a sociology of philosophy necessary, and what evidence permits a reader
    to distinguish a philosopher's serious teaching from the public or exoteric form in which philosophy becomes visible
    to a community that may deny philosophy legitimacy?
  recovered_source_question: >
    How must medieval Islamic and Jewish philosophy be interpreted once their relation to revealed Law, political order,
    persecution, differentiated audiences, and the private status of philosophy is reconstructed rather than assimilated
    to Christian scholasticism or to a modern assumption of harmony between thought and society?
  reconstruction_rule: >
    Read printed pages 417-428 in order before comparing with the active predecessor. Treat notes beginning on printed
    page 428 as documentary apparatus. Distinguish Strauss's explicit methodological claims, his reconstruction of Farabi
    and the falasifa, his historical comparisons, and unresolved questions. Do not infer exotericism solely from doctrinal
    disagreement, rarity, or a prior expectation of concealment.
  exoteric_evidence_rule: >
    Source-local evidence includes differentiated treatment of the same subject across differently exposed works,
    significant silence where a commentator would be expected to report a doctrine, explicit remarks on danger and
    audience, declared conformity with accepted opinions, and the political function Strauss assigns to exoteric teaching.
  sociology_of_philosophy_rule: >
    The object is the fundamental relation of thought as such to society as such, especially the recurring danger that
    accompanies philosophy when society does not recognize the right to philosophize; differences among historical
    societies matter insofar as they alter the forms of that relation.

