    - Spinoza's Treatise and the represented biblical, medieval, classical, Christian, and Jewish sources remain independently incomplete unless separately registered.
    - The essay raises but does not finally settle the extent of accommodation in the Ethics or the question of a strictly atheistic beginning in Spinoza.
