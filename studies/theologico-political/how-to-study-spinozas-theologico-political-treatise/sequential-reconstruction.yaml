source_limits:
  - The reviewed witness is the 1997 SUNY collected reprint, not a separately reviewed copy of the 1948 journal printing.
  - The notes on printed pages 224-233 are documentary apparatus and are distinguished from the argumentative body, although printed page 224 contains both the end of the argument and the beginning of the notes.
  - Spinoza, Maimonides, Farabi, ibn Ezra, Plato, Descartes, Bacon, Hobbes, Christianity, Judaism, the Bible, and the represented historical traditions remain independently unreconstructed unless separately registered.
  - Strauss's reconstruction of Spinoza is not independent corroboration of Spinoza's doctrine.
  - Exoteric interpretation is not a license for mechanical inversion: contradictions, audience, explicit accommodation, ordering, and necessary implication must be demonstrated in the source before a hidden teaching is inferred.
  - This reconstruction does not establish the truth or falsity of revelation, prophecy, miracle, atheism, Christianity, Judaism, or Spinoza's philosophy.

