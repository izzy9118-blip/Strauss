method_application:
  governing_question: >
    How must a serious reader reconstruct Spinoza's Theologico-Political Treatise if the conflict
    between philosophy and revelation remains a live question, and what does Spinoza's own manner
    of reading, addressing audiences, using contradiction, and adapting public speech reveal about
    the Treatise's argument and its relation to the freedom of philosophy?
  recovered_source_question: >
    What procedure permits the reader to understand Spinoza as he understood himself before
    explaining him historically, and how does that procedure alter the apparent relation among
    biblical criticism, Christianity, theology, philosophy, political freedom, and Spinoza's
    deliberate public presentation?
  reconstruction_rule: >
    Reconstruct the essay in textual order. Distinguish Strauss's methodological propositions,
    Strauss's reconstruction of Spinoza, reported positions, documentary observations, supported
    inferences, and unresolved questions. Do not use the active predecessor as a premise.
  comparison_rule: >
    Compare the completed source reconstruction with the active predecessor only after the source
    has been reconstructed in order. Agreement or qualification does not certify, migrate, activate,
    or displace any problem record.

