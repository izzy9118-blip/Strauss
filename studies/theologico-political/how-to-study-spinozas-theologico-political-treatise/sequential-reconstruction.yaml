permanent_source_level_findings:
- id: SPINOZA-TREATISE-PF-001
  proposition: Exact interpretation of what an author said and understood must precede historical, psychological,
    or causal explanation.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-002
  proposition: Within interpretation, explicit meaning must be established before irony, lying, deliberate silence,
    or hidden teaching can be demonstrated.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-003
  proposition: The author’s subject, intention, questions, hierarchy of topics, audience, and manner of writing govern
    the collection and arrangement of statements.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-004
  proposition: Spinoza’s rules for the hieroglyphic Bible cannot simply be transferred to his own intelligible philosophic
    writings.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-005
  proposition: Historical and biographical information is subordinate and may supply a clue only within a framework
    authentically supplied by Spinoza or after direct interpretation proves insufficient.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-006
  proposition: Mature philosophic books are primarily addressed to posterity, and deliberate silence about relevant
    material belongs to interpretation proper.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-007
  proposition: The Treatise addresses potential philosophers among Christians through predominantly Jewish material
    and must be read as a practical and rhetorical whole.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-008
  proposition: Contradictions concerning revelation, theology, Christ, Christianity, and biblical intelligibility
    are interpretive evidence rather than automatically mistakes.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-009
  proposition: Spinoza’s accommodated speech to the vulgar provides a controlled basis for distinguishing public or
    provisional statements from his more serious view.
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-010
  proposition: The Jewish subject matter and asymmetrical treatment of the Testaments support the inference that a
    cautious attack on Christian authority belongs to the work’s political action.
  classification: supported_inference
- id: SPINOZA-TREATISE-PF-011
  proposition: 'Detached historical study is a later concern: the Treatise’s practical proposal and obvious reasoning
    must be understood completely before a hidden teaching is sought.'
  classification: documented_finding
- id: SPINOZA-TREATISE-PF-012
  proposition: The essay models exoteric reading as disciplined fidelity to surface, structure, audience, contradiction,
    omission, and order; it does not authorize mechanical reversal or certify Spinoza’s complete doctrine.
  classification: supported_inference
speech_and_deed_analysis:
  explicit_speech: The essay explicitly prescribes interpretation before explanation and derives rules for reading
    Spinoza from Spinoza’s own hermeneutic distinctions.
  textual_deed: It applies those rules to the Treatise, reconstructing its audience, contradictions, accommodations,
    omissions, order, Jewish subject matter, Christian target, practical proposal, and possible hidden teaching.
  relation: METHOD_STATED_AND_PERFORMED_IN_ORDER
  finding: 'The deed confirms that exoteric reading is not free invention: it is a late, evidence-bound result of
    exact surface interpretation.'
problem_jurisdiction:
  theologico_political:
    role: PRIMARY
    receives:
    - philosophy and revelation
    - theology and freedom to philosophize
    - sovereign authority and public defensibility
    - the Jewish subject matter and Christian political target
    non_absorption: The reason-revelation conflict does not absorb the distinct hermeneutic problem of audience and
      communication.
  wise_vs_vulgar:
    role: CONTROLLED_SECONDARY
    receives:
    - potential philosophers, actual philosophers, and the vulgar
    - ad captum vulgi accommodation
    - contradiction, omission, and differentiated communication
    non_absorption: Audience differentiation does not establish wisdom, elitism, deception, or a mechanical reversal
      rule.
  ancients_vs_moderns:
    role: CONTROLLED_SECONDARY
    receives:
    - Spinoza’s modern rationalism and historicist reception
    - Maimonides, ibn Ezra, Farabi, Plato, Descartes, and Bacon as comparative controls
    - mature works addressed to posterity
    non_absorption: Comparative genealogy does not independently establish any thinker’s doctrine.
  athens_vs_jerusalem:
    role: CONTROLLED_INTERSECTION
    receives:
    - biblical intelligibility
    - revelation, prophecy, law, and philosophy
    non_absorption: The essay studies Spinoza’s interpretation and does not independently adjudicate Bible or philosophy.
  philosophy_vs_poetry:
    role: BOUNDARY_REFERENCE_ONLY
    non_absorption: Accommodation and concealment may not be recoded as poetry without source evidence.
  nomos_vs_physis:
    role: CONTROLLED_INTERSECTION
    receives:
    - sovereign authority, freedom, and public order
  theory_vs_practice:
    role: CONTROLLED_INTERSECTION
    receives:
    - the practical proposal and obvious reasoning prior to hidden teaching
comparison_with_active_predecessor:
  predecessor: problems/theologico-political.yaml
  preserved_copy: history/foundational-problems/theologico-political/STR-PROBLEM-002-v1.1-active-predecessor.yaml
  state: PROVISIONAL_RETEST_COMPLETE_NO_PROMOTION
  predecessor_statement: Interpretation must precede historical or psychological explanation and the Treatise must
    be read through Scripture, prophecy, freedom to philosophize, sovereign authority, and differentiated audiences.
  statement_status: PREDECESSOR_SYNTHESIS_PARAPHRASE_NOT_SOURCE_QUOTATION
  confirmations:
  - Interpretation explicitly precedes explanation.
  - Audience differentiation is central to the Treatise’s difficulty.
  - Freedom to philosophize and sovereign authority belong to the work’s practical action.
  - Scripture and prophecy are interpreted within a controlled account of biblical intelligibility and accommodation.
  qualifications:
