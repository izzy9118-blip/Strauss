method_application:
  governing_question: How must Spinoza’s Theologico-Political Treatise be interpreted before it is historically or
    psychologically explained, and how do audience, contradiction, accommodation, omission, structure, and practical
    purpose disclose its serious teaching?
  recovered_source_question: What rules of reading follow from Spinoza’s own distinctions, and how do those rules
    reveal the Treatise as an intelligible philosophic book addressed to potential philosophers through a cautious
    political intervention?
  reconstruction_rule: Read the complete item in order. Begin with explicit argument and textual action; distinguish
    Strauss’s documented claims from structural evidence and supported inference; seek hidden teaching only after
    the practical proposal and obvious reasoning are understood.
  locator_rule: Reading units use directly verified printed and one-based PDF spans in the fingerprinted 1997 witness.
  comparison_rule: Compare with the active predecessor only after independent sequential reconstruction and preserve
    every qualification, uncertainty, and non-effect.
speaker_and_documentary_layers:
  strauss_1948:
    role: authorial interpreter of Spinoza
    rule: Strauss’s explicit methodological claims and reconstruction belong to the essay, subject to the pending
      original-edition comparison.
  spinoza_as_reconstructed:
    role: object of Strauss’s interpretation
    rule: Strauss’s account is not identical with independently established Spinozist doctrine.
  biblical_and_comparative_sources:
    role: evidence and comparison represented within the essay
    rule: Each requires independent source review before corroborative or doctrinal use.
  editor_1997:
    role: publication provenance and cross-reference apparatus
    rule: Editorial aids do not decide Strauss’s argument.
  active_predecessor:
    role: prior nineteen-source synthesis
    rule: Comparison target, never premise or source quotation.
sequential_reading:
- unit: SPINOZA-TREATISE-RU-001
  printed_pages:
    start: 181
    end: 184
  function: Establish the live issue and the priority of interpretation over explanation.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-001
    proposition: The Treatise is reopened because the conflict between philosophy and revelation has again become
      central, while contemporary discussion proceeds on a lower level than earlier discussion.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-002
    proposition: Interpretation seeks what a speaker said and how he understood it; explanation seeks implications
      of which the speaker was unaware.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-003
    proposition: Interpretation must precede explanation, and explicit meaning must precede proof of irony, lying,
      or deliberate concealment.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-004
    proposition: The degree of interpretive exactness must answer to the author’s demonstrated habits of writing and
      reading.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-001-01
    proposition: Spinoza’s chapter on biblical interpretation is used as initial evidence for how a careful reader
      and writer expects books to be read.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-001-01
    proposition: A method that begins with unconscious causes or historical situation before exact interpretation
      risks explaining an imagined text.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-002
  printed_pages:
    start: 184
    end: 190
  function: Distinguish Spinoza’s rules for the Bible from the reading appropriate to intelligible philosophic books.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-005
    proposition: Spinoza’s formula that the Bible must be understood exclusively through itself overstates his actual
      procedure, which also uses language, tradition, external information, and nonbiblical ordering principles.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-006
    proposition: Strauss’s first questions concern the author’s subject, intention, governing questions, and hierarchy
      of topics rather than an ungoverned collection of statements.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-007
    proposition: Spinoza treats the Bible as substantially hieroglyphic, whereas he treats his own philosophic books
      as intelligible and therefore in principle self-explanatory through their subject matter and intention.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-008
    proposition: For intelligible books, external historical information is subordinate and must not replace the author-supplied
      framework.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-002-01
    proposition: The contrast between hieroglyphic and intelligible books controls the transfer from Spinoza’s biblical
      hermeneutics to the study of Spinoza.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-002-01
    proposition: 'Strauss’s criticism is immanent: he draws the reading rule for Spinoza from distinctions and examples
      supplied by Spinoza himself.'
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-003
  printed_pages:
    start: 190
    end: 196
  function: Limit historicism and define the legitimate reconstruction of background.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-009
    proposition: The rise of modern historical consciousness does not license reading a mature philosophic work primarily
      as an expression of its time.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-010
    proposition: Necessary background must follow signposts supplied by Spinoza and remain integrated into an explicit
      Spinozist framework.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-011
    proposition: Mature philosophic books are primarily addressed to posterity; letters to particular contemporaries
      have a different documentary weight.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-012
    proposition: Understanding a deliberate silence about something relevant belongs to interpretation proper because
      suppression is an action.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-003-01
    proposition: The interpreter may reconstruct terminology and background that Spinoza could reasonably assume but
      could not preserve exhaustively for posterity.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-003-01
    proposition: Judgment on Spinoza may exceed his indications only after his teaching has been interpreted as he
      presented it.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-004
  printed_pages:
    start: 196
    end: 201
  function: Recover the Treatise’s differentiated audience and the function of its Jewish subject matter.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-013
    proposition: The Treatise is addressed neither to the vulgar nor to actual philosophers but especially to potential
      philosophers obstructed by the belief that reason must serve theology.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-014
    proposition: Its Christian addressees are approached through a predominantly Jewish subject matter.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-015
    proposition: Chapters III through V must be read as parts of the Treatise’s complete argument rather than isolated
      historical essays.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-016
    proposition: The historical “time” invoked by the Treatise is an opportunity for freedom, not a neutral chronology
      detached from the work’s practical aim.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-004-01
    proposition: Audience is not extraneous biography; Spinoza names the addressees and thereby supplies a clue to
      the work’s difficulty.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-004-01
    proposition: The Jewish material performs a political and rhetorical function within an intervention directed
      toward Christian readers.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-005
  printed_pages:
    start: 201
    end: 206
  function: Inventory contradictions concerning revelation, theology, Christ, and biblical intelligibility.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-017
    proposition: Spinoza alternately appears to concede and deny suprarational revelation and the certainty or autonomy
      of theology.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-018
    proposition: Statements about Christ and Christianity cannot all be combined without qualification.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-019
    proposition: The Bible is described both as accessible in its moral teaching and as unintelligible in much of
      its subject matter.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-020
    proposition: These tensions require interpretation before they are dismissed as error, development, or unconscious
      inconsistency.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-005-01
    proposition: The contradictions cluster around questions most exposed to theological and political danger.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-005-01
    proposition: The work’s explicit pedagogic and political purpose makes contradiction potentially functional rather
      than merely accidental.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-006
  printed_pages:
    start: 206
    end: 211
  function: Reconstruct accommodation to the vulgar and the rule for finding the serious view.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-021
    proposition: 'Spinoza repeatedly speaks ad captum vulgi: in accordance with the capacity and opinions of the vulgar.'
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-022
    proposition: Accommodation can reproduce premises Spinoza rejects in order to persuade readers who begin from
      those premises.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-023
    proposition: Where opposed statements cannot both be serious, the view furthest from the vulgar position is generally
      the stronger candidate for Spinoza’s serious view.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-024
    proposition: This rule is evidentiary and contextual, not a license to reverse every explicit statement mechanically.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-006-01
    proposition: Spinoza’s own discussion of accommodated speech supplies the vocabulary for reading his accommodations.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-006-01
    proposition: The relevant audience distinction is potential philosopher versus vulgar, not simply private versus
      public writing.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-007
  printed_pages:
    start: 211
    end: 216
  function: Place Spinoza within a tradition of philosophic communication.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-025
    proposition: Strauss relates Spinoza’s manner of writing to Maimonides, ibn Ezra, Farabi, Plato, Descartes, and
      Bacon without treating those relations as independent proof of doctrine.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-026
    proposition: The traditional terminology of philosophy can calm readers by allowing them initially to believe
      they remain within a familiar world.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-027
    proposition: Contradictions, omissions, and altered emphases can direct attentive readers toward a teaching not
      stated with equal openness everywhere.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-028
    proposition: The possibility that the same communicative problem extends to the Ethics is raised but not completed
      within this essay.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-007-01
    proposition: The comparative references serve as interpretive controls for kinds of writing and reading, not as
      substitutes for sequential study of the Treatise.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-007-01
    proposition: The essay preserves a difference between an author’s public defensibility and the legal permissibility
      of a proposition.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-008
  printed_pages:
    start: 216
    end: 220
  function: Clarify the political use of Jewish and Christian materials.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-029
    proposition: Spinoza’s attack proceeds cautiously through the Old Testament while the deeper political target
      includes Christian theological authority.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-030
    proposition: His relative silence about the Gospels cannot be explained solely by insufficient Greek, because
      the shape of the New Testament discussion remains selective.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-031
    proposition: 'The return to the literal Bible can serve opposed purposes: exposing inherited theology and reopening
      the force of the text against theological mediation.'
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-032
    proposition: Freedom to philosophize is defended through an argument addressed to a historically situated regime
      and public.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-008-01
    proposition: The asymmetry between treatment of Old and New Testaments is part of the textual deed of the Treatise.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-008-01
    proposition: Caution does not by itself prove a hidden doctrine; it identifies a problem requiring comparison
      of explicit claims, omissions, and audience.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-009
  printed_pages:
    start: 220
    end: 224
  function: Order the practical proposal, obvious reasoning, historical study, and hidden teaching.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-033
    proposition: Detached historical investigation is a cura posterior, a later concern subordinate to first understanding
      the practical proposal and argument of the Treatise.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-034
    proposition: The practical proposal concerning freedom and sovereign authority must be understood in the order
      in which the Treatise presents it.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-035
    proposition: The obvious reasoning must be completely understood before an interpreter attempts to bring a hidden
      teaching to light.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-036
    proposition: Exoteric interpretation therefore begins with, rather than bypasses, the surface and the work’s manifest
      action.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-009-01
    proposition: The conclusion returns to the essay’s opening priority of interpretation over explanation.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-009-01
    proposition: Hidden teaching is a late result of demonstrated contradictions, omissions, audience, and structure,
      not an opening assumption.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
    the Bible, Christianity, Judaism, or the compared philosophers remain independently unverified.
- unit: SPINOZA-TREATISE-RU-010
  printed_pages:
    start: 224
    end: 233
  function: Preserve the note apparatus as documentary support and delimit what the essay establishes.
  documented_findings:
  - id: SPINOZA-TREATISE-DF-037
    proposition: The numbered notes document the Treatise passages and comparative texts on which the reconstruction
      rests.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-038
    proposition: Editor-supplied cross-references in the 1997 collection assist relocation but are not part of Strauss’s
      1948 argumentative body.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-039
    proposition: The essay establishes a method for studying the Treatise and a provisional reconstruction of its
      communicative structure, not an independently corroborated account of Spinoza’s complete doctrine.
    classification: documented_finding
  - id: SPINOZA-TREATISE-DF-040
    proposition: Comparison with the original 1948 journal printing remains necessary before textual identity across
      editions can be asserted.
    classification: documented_finding
  structural_evidence:
  - id: SPINOZA-TREATISE-SE-010-01
    proposition: The note apparatus continues through printed page 233 after the argumentative conclusion on printed
      page 224.
    classification: structural_evidence
  supported_inferences:
  - id: SPINOZA-TREATISE-SI-010-01
    proposition: The 1997 collected reprint is complete and fingerprinted, but edition comparison remains a separate
      task.
    classification: supported_inference
  uncertainty: The unit reconstructs Strauss’s argument from the reviewed 1997 collected witness; claims about Spinoza,
