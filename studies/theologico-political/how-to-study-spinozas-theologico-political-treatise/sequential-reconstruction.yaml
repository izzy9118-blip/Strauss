uncertainties:
  - id: SPINOZA-TREATISE-U-001
    statement: The study is edition-specific to the 1997 collected witness and remains revisable after comparison with the original 1948 journal printing.
  - id: SPINOZA-TREATISE-U-002
    statement: Strauss's characterization of Spinoza and the cited philosophical and theological traditions requires independent primary-text reconstruction for corroboration.
  - id: SPINOZA-TREATISE-U-003
    statement: The rule privileging the statement most opposed to the vulgar view is source-specific and must not be generalized into an unrestricted hermeneutic law detached from documented accommodation and contradiction.
  - id: SPINOZA-TREATISE-U-004
    statement: The essay does not establish whether revelation is true, whether miracles occur, or whether Spinoza's ultimate doctrine is atheistic.

prohibitions:
  - Do not let the active predecessor, Green's editorial framing, or later repository syntheses govern the source reconstruction.
  - Do not treat interpretation and explanation as interchangeable.
  - Do not allow historical context to replace an author-supplied interpretive framework.
  - Do not treat contradiction alone as proof of deliberate concealment.
  - Do not mechanically reverse frequent or orthodox statements.
  - Do not identify a statement's rarity with its truth or seriousness without source-local relational evidence.
  - Do not infer a stable class of wise persons merely from differentiated audiences.
  - Do not identify Strauss's reconstruction of Spinoza, Maimonides, Plato, or any other thinker with independently established doctrine.
  - Do not identify the 1997 collected reprint with a separately reviewed 1948 journal printing.
  - Do not certify doctrine, migration, successor activation, predecessor displacement, or repository completion.

