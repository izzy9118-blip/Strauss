  qualifications:
    - The source's most sustained contribution is methodological and hermeneutic; sovereign authority is not independently reconstructed here as an equal central theme.
    - Historical context is admitted only in a subordinate role governed by authorial signposts, except where the text itself establishes deliberate adaptation to time and audience.
    - Exoteric interpretation requires a prior complete understanding of the practical proposals and obvious reasoning; the source does not authorize reading every contradiction as a simple inversion.
