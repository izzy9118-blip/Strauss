source_limits:
- The reviewed witness is the 1997 SUNY collected reprint, not a separately reviewed 1948 journal printing.
- The original 1948 journal comparison remains pending.
- The complete container bytes are fingerprinted, but the copyrighted source text is not distributed by this record.
- Green’s editorial cross-references and collection framing are secondary and do not govern Strauss’s 1948 argument.
- Pangle’s Introduction to Studies in Platonic Political Philosophy did not govern this reconstruction.
- Spinoza, the Bible, Christianity, Judaism, Maimonides, ibn Ezra, Farabi, Plato, Descartes, Bacon, and the represented
  historical claims remain independently unreconstructed unless separately registered.
- This source-local reconstruction does not certify esotericism, revelation, secularism, freedom, sovereignty, or
  any doctrine.
