uncertainties:
  - The 1978 Interpretation printing has not been separately compared with the 1997 collected witness.
  - The reason the written prologue was not spoken is supplied by later editorial discussion and is not established by Strauss's body text alone.
prohibitions:
  - Do not use this source as evidence for Strauss's orthodoxy, unbelief, Zionism, or medieval-philosophy development.
  - Do not convert the praise of classical return into a certified final doctrinal allegiance.
  - Do not convert the publicity anecdote into proof of esoteric writing.
  - Do not certify doctrine, migration, successor activation, predecessor displacement, or repository completion.
