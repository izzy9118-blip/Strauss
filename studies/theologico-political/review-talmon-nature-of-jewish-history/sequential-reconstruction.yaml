source_limits:
  - The reviewed witness is the 1983 collected reprint, not a separately reviewed copy of the 1957 Journal of Modern History printing.
  - Talmon's book is identified bibliographically but is not available as a reviewed witness in this study.
  - The review is one page and cannot establish Talmon's complete argument beyond Strauss's report.
  - The collection is posthumous; Strauss selected its title and order but did not complete its intended introduction.
  - Joseph Cropsey's Foreword supplies publication provenance only.
  - Thomas L. Pangle's Introduction is secondary and provisional and does not govern Strauss's review.
  - The active predecessor and collection-level studies are derivative analytical records, not independent witnesses to this review.

