  complete one-page review has been reconstructed.

activated_problems:
  - canonical_key: theologico-political
    reason: >
      The review distinguishes the historian's inability to establish divine election from
      the necessity of understanding a people whose historical life is constituted by belief
      in election, revelation, sacred history, and right acting.
  - canonical_key: athens-vs-jerusalem
    reason: >
      Jewish particularity, universal significance, right acting, election, priestly vocation,
      and the relation between the State of Israel and the Jewish people are central.

