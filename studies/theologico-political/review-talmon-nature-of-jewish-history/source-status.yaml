predecessor_contribution_record:
  evidence_status: PREDECESSOR_SYNTHESIS_CLAIM_RETESTED_AND_PROVISIONALLY_QUALIFIED_BY_TALMON_STUDY_001
  statement: >
    Rejects an easy philosophy of Jewish historical progress and presents the Jewish problem
    as an especially manifest form of the human social and political problem.
  study_result: >
    TALMON-STUDY-001 confirms that the review resists economic and psychological reduction,
    preserves the political insufficiency of statehood, and connects Jewish election to a
    universal Western political problem. It does not explicitly reject a philosophy of historical
    progress, and it does not reduce Jewish particularity to a generic human social problem.
  preservation_rule: >
    The predecessor statement remains historically preserved and active but is not promoted as
    a source-level finding. Retesting does not certify, migrate, activate, supersede, or displace it.
