predecessor_contribution_record:
  evidence_status: PROVISIONALLY_RETESTED_BY_INDEPENDENT_SEQUENTIAL_RECONSTRUCTION
  statement: Reconstructs emancipation, assimilation, Jewish persistence, political and cultural Zionism, Torah, and the limits of merely political solutions.
  retest_result: >
    The study confirms that individual assimilation, liberal emancipation, political Zionism, and cultural Zionism do not
    exhaust the Jewish question. It qualifies the predecessor by showing that the source rejects the expectation of any
    final social solution, calls religious Zionism the clearest consistent solution while acknowledging its inaccessibility
    to unbelievers, grounds fidelity in a non-base inherited past rather than ancestry alone, brings positivist science and
    religious mystery only within hailing distance, and sharpens the final alternative into Torah or unbelief while demanding
    examination of unbelief itself.
  preservation_rule: >
    Provisional confirmation and qualification do not certify, migrate, activate, displace, or silently rewrite the active predecessor.
