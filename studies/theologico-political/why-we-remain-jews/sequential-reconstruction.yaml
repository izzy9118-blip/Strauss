source_limits:
  - The reviewed witness is the 1997 posthumously published lecture transcription with question-and-answer material, not an authorially reviewed manuscript.
  - Green reports that prepared notes apparently used by Strauss do not survive; Werner Dannhauser and James Lane transcribed the lecture from tape and report that Strauss neither reviewed nor formally approved the transcription.
  - Green states that the published version is based almost entirely on that transcription, with slight grammatical changes and significant changes noted; his notes are entirely his own work.
  - Cropsey's opening introduction and post-lecture Jerusalem-and-Athens interpretation are separate speaker layers and are not Strauss evidence.
  - Questioners in the discussion are separate speakers; only responses explicitly assigned to Strauss are used as Strauss evidence.
  - The Aleinu translation inserted on printed pages 327-328 is explicitly editorial and was not read by Strauss during the lecture; it is excluded from Strauss proposition evidence.
  - Several clarifying phrases in the published text were added by Green and are preserved as editorial interventions rather than silently treated as exact spoken wording.
  - Historical claims concerning Spain, liberalism, communism, Nazism, Zionism, Crusades, Nietzsche, Christian-Jewish relations, Cohen, Scholem, and other represented materials remain source-local unless independently reconstructed.
  - The study does not decide the truth of Torah, revelation, creation, final redemption, Zionism, or unbelief.

