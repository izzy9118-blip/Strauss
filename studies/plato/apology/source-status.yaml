source_hierarchy:
  primary_work:
    authority: PRIMARY_PLATONIC_WITNESS_IN_TRANSLATION
    scope: >
      The body of Plato's Apology as represented by the registered Jowett translation.
  translator:
    authority: TRANSLATION_MEDIATOR
    limit: >
      English wording, capitalization, theological diction, punctuation, paragraphing,
      and supplied alternatives may reflect Jowett's nineteenth-century choices.
  project_gutenberg_metadata:
    authority: REPOSITORY_AND_EDITION_METADATA
    limit: Does not govern Plato's teaching.
  jowett_introduction:
    authority: SECONDARY_EDITORIAL_AND_INTERPRETIVE_CONTEXT
    status: EXCLUDED_FROM_PRIMARY_RECONSTRUCTION
    limit: >
      The introduction may orient questions but cannot govern Plato's dramatic deed,
      Socrates' speech, or the independent reconstruction.
  web_search_or_catalog_description:
    authority: DISCOVERY_ONLY
    limit: Not evidence for the dialogue's teaching.

known_limits:
  - the registered English text is not the Greek original
  - the Project Gutenberg HTML does not provide a verified Stephanus-section map in this record
  - translation choices concerning god, gods, divine sign, spirit, demigod, piety, virtue, and soul require later Greek comparison
  - Socrates is a dramatic and reported speaker within Plato's work, not automatically Plato's final doctrine
  - the work's relation to the historical trial and historical Socrates remains disputed
  - Jowett's introduction is not part of the primary reading corpus
  - no claim from this translation may be forced to confirm Strauss's interpretation

required_citation_form:
  work_level: Plato, Apology, Benjamin Jowett translation, Project Gutenberg eBook 1656
  provisional_location_method: Project Gutenberg HTML body line range and internal argumentative sequence
  future_location_method: Stephanus section plus verified Greek-English edition reference

reading_integrity:
  primary_body_reviewed_sequentially: true
  introduction_excluded_from_primary_findings: true
  body_range_reviewed: Project Gutenberg HTML lines 115-317
  translation_limit_carried_forward: true
  direct_quote_policy: >
    Quote sparingly and record translation identity. Substantive findings should be
    paraphrased and later checked against a verified Greek edition where wording bears weight.

problem_activation:
  philosophy_vs_poetry:
    activated: true
    reasons:
      - Aristophanes and the old accusers shape the public image of Socrates
      - poets are examined as claimants to wisdom and inspiration
      - rhetoric, audience, education, imitation, and public representation govern the trial
      - Plato's dramatic deed must be distinguished from Socrates' explicit defence
  theologico_political:
    activated: true
    reasons:
      - impiety and the city's gods form a legal charge
      - Socrates presents the Delphic oracle, divine command, divine sign, and obedience to god
      - philosophy and political law assert competing practical commands
      - divine authority, civic oaths, justice, piety, and death are joined
  brother_problem_rule: >
    The poetic formation of the accusation and Socrates' account of divine authority
    require coactivation without identifying poetry with revelation or the city's gods
    with genuine divine disclosure.

migration_and_non_absorption_safeguards:
  - no revision or replacement of the completed Socrates and Aristophanes study
  - no presumption that Plato confirms Strauss
  - no merger of Philosophy vs. Poetry and The Theologico-Political Problem
  - no conversion of Socratic speech into Plato's final doctrine without dramatic analysis
  - no identification of Delphic, daimonic, civic, poetic, and revelatory authority without argument
  - no certification of historical accuracy from Platonic representation alone
  - no certification or activation of a foundational successor from this source record

termination:
  source_registration_state: COMPLETE_FOR_JOWETT_PROJECT_GUTENBERG_WITNESS
  further_required_source_work:
    - verify a Greek edition and sectional alignment
    - compare material translation terms where they bear interpretive weight
    - register any later translation used for correction or dissent
  certification: NOT_CERTIFIED
