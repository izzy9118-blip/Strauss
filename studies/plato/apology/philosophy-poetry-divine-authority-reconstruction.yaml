independence_rule: >
  Plato is reconstructed here without treating Strauss, Aristophanes, Xenophon,
  Jowett, Pangle, the historical Socrates, or the completed Socrates and
  Aristophanes synthesis as governing Plato's meaning. Comparison begins only after
  this independent record is complete.

activated_problems:
  - canonical_key: philosophy-vs-poetry
    reason: >
      The oldest public accusation is poetically mediated; Aristophanes is named;
      poets are examined as claimants to wisdom; rhetoric and audience govern the trial.
  - canonical_key: theologico-political
    reason: >
      Socrates is tried for impiety and corruption, invokes oracle, god, divine
      command and sign, and refuses a political prohibition on philosophic inquiry.

