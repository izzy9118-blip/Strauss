schema_version: 1.0
record_type: inquiry_method_contract

identity:
  key: reconstruct-alternatives
  title: Reconstruct Serious Alternatives
  version: 1.1.0
  contract_version: STRAUSS-METHOD-RA-1

status:
  lifecycle: OPERATIONAL_CONTRACT
  semantic_completion: SUBSTANTIVELY_RECONSTRUCTED
  source_specific_application: INCOMPLETE
  certification: NOT_CERTIFIED

revision_history:
  predecessor_version: 1.0.0
  predecessor_blob_sha: 7bdd9f3bef98e48fc744448bb5320a7913f3ecda
  transformation: SUBSTANTIVE_FORWARD_REVISION
  reason: >
    Replace the initial independence rule with a typed claimant, burden, evidence,
    asymmetry, comparison-gate, nonvictory, and termination contract.

source_records:
  - protocols/source-status.yaml
  - protocols/evidence-classification.yaml
  - protocols/inference-discipline.yaml
  - protocols/uncertainty-preservation.yaml
  - protocols/claimant-to-wisdom.yaml
  - hermeneutics/speaker-and-author.yaml
  - hermeneutics/whole-and-part.yaml
  - hermeneutics/historical-and-philosophical-understanding.yaml

objective: >
  Reconstruct each serious claimant, authority, way of life, explanatory account, or
  practical alternative in its strongest available source-supported form before
  comparison, criticism, synthesis, ranking, or rejection.

governing_rule: >
  Comparison is forbidden until each alternative has an independent record identifying
  its primary sources, self-understanding, strongest claim, demonstrated deed,
  evidentiary limits, internal tensions, and burden on rivals.

input_contract:
  required_fields:
    - inquiry_ref
    - governing_question
    - alternatives
    - source_registry
    - independence_status
    - comparison_purpose
    - asymmetries
    - missing_witnesses
  alternative_required_fields:
    - alternative_id
    - claimant_or_position
    - alternative_class
    - primary_sources
    - secondary_sources
    - self_description
    - strongest_claim
    - governing_end_or_good
    - demonstrated_deeds
    - consequences
    - internal_distinctions
    - internal_tensions
    - burden_on_rivals
    - evidence_status
    - documentary_limits
    - unresolved_questions
  alternative_classes:
    - philosophic
    - poetic
    - revelatory
    - theological
    - legal
    - political
    - historical
    - scientific
    - practical
    - conventional
    - natural
    - ancient
    - modern
    - composite_or_disputed

independence_gate:
  requirements:
    - primary sources identified where available
    - source status and documentary layer classified
    - local terminology and historical horizon reconstructed
    - speaker and author relation recorded
    - strongest claim stated without rival vocabulary governing it
    - demonstrated deed and consequence distinguished from title or self-description
    - serious internal tension preserved
    - missing evidence and source asymmetry explicit
  blocked_if:
    - a witness is reconstructed primarily through its rival
    - Strauss or a later interpreter silently replaces the primary witness
    - one translation or excerpt is treated as an exhaustive authorial corpus
    - title, office, success, suffering, persecution, influence, or obscurity certifies rank
    - the anticipated comparison determines the independent record

application_sequence:
  - step_id: RA-STEP-001
    operation: identify every serious alternative generated by the governing question and sources
  - step_id: RA-STEP-002
    operation: assign stable alternative identifiers and classes
  - step_id: RA-STEP-003
    operation: register primary, contemporaneous, later, and editorial sources separately
  - step_id: RA-STEP-004
    operation: reconstruct each alternative's own vocabulary, question, end, and self-description
  - step_id: RA-STEP-005
    operation: distinguish claimed authority from demonstrated deed, consequence, and limitation
  - step_id: RA-STEP-006
    operation: reconstruct strongest argument, not merely most vulnerable formulation
  - step_id: RA-STEP-007
    operation: preserve internal distinctions, contradictions, and unresolved questions
  - step_id: RA-STEP-008
    operation: state each alternative's burden on rivals and its own burden of proof
  - step_id: RA-STEP-009
    operation: record asymmetries of evidence, scope, genre, historical horizon, and documentary completeness
  - step_id: RA-STEP-010
    operation: certify only completion of the independent record, never truth or rank
  - step_id: RA-STEP-011
    operation: open comparison gate only for independently reconstructed alternatives
  - step_id: RA-STEP-012
    operation: compare exact claims, grounds, ends, and burdens rather than labels alone
  - step_id: RA-STEP-013
    operation: record convergence, divergence, incommensurability, reciprocal burden, and unresolved priority
  - step_id: RA-STEP-014
    operation: withhold victor where burdens remain unmet

burden_contract:
  required_for_each_alternative:
    - truth_or_knowledge_claim
    - authority_claim
    - account_of_human_good
    - account_of_education_or_guidance
    - account_of_political_consequence
    - response_to_strongest_rival
    - acknowledged_limit
  burden_statuses:
    - BURDEN_MET_WITHIN_REGISTERED_SCOPE
    - BURDEN_PARTIALLY_MET
    - BURDEN_UNMET
    - BURDEN_NOT_TESTABLE_WITH_AVAILABLE_EVIDENCE
    - RECIPROCAL_BURDEN_REMAINS

asymmetry_contract:
  dimensions:
    - surviving_source_quantity
    - source_directness
    - genre
    - translation_status
    - historical_distance
    - authorial_attribution
    - claimed_scope
    - practical_vs_theoretical_standard
    - revelatory_vs_autonomous_authority
    - public_vs_restricted_presentation
  rule: >
    Unequal evidence must be recorded rather than converted into a substantive victory.
    Silence, loss, or incomplete survival may limit comparison without favoring the
    better-preserved claimant automatically.

comparison_relations:
  - CLAIMS_DIRECTLY_CONFLICT
  - CLAIMS_PARTIALLY_OVERLAP
  - GROUNDS_CONVERGE
  - CONCLUSIONS_CONVERGE_GROUNDS_DIVERGE
  - ALTERNATIVES_INCOMMENSURABLE_WITHIN_SCOPE
  - ONE_ALTERNATIVE_SUPPLIES_BURDEN_TO_OTHER
  - MUTUAL_CRITIQUE_REMAINS_ACTIVE
  - HISTORICAL_TRANSFORMATION_DOCUMENTED
  - VOCABULARY_SIMILAR_DOCTRINE_IDENTITY_NOT_ESTABLISHED
  - COMPARISON_BLOCKED_BY_INCOMPLETE_RECONSTRUCTION
  - PRIORITY_UNRESOLVED

valid_outputs:
  - ALTERNATIVE_INDEPENDENTLY_RECONSTRUCTED
  - ALTERNATIVE_RECONSTRUCTION_BOUNDED
  - COMPARISON_GATE_OPEN
  - COMPARISON_GATE_BLOCKED
  - STRONGEST_CLAIM_RECORDED
  - DEMONSTRATED_DEED_QUALIFIES_SELF_DESCRIPTION
  - EVIDENCE_ASYMMETRY_RECORDED
  - RECIPROCAL_BURDENS_PRESERVED
  - LIMITED_CONVERGENCE
  - DOCUMENTED_DIVERGENCE
  - INCOMMENSURABILITY_PRESERVED
  - VICTOR_NOT_ESTABLISHED
  - MISSING_WITNESS_RECORDED

required_output_fields:
  - classification
  - governing_question
  - alternative_records
  - independence_assessment
  - source_asymmetries
  - strongest_claims
  - demonstrated_deeds
  - burdens
  - comparison_relations
  - convergence_and_divergence
  - missing_witnesses
  - confidence
  - what_is_not_established
  - remaining_uncertainty

failure_conditions:
  - forcing one witness to confirm another
  - reconstructing a claimant through a hostile source alone when primary sources survive
  - treating title, office, success, suffering, persecution, secrecy, or influence as certification
  - confusing poetic representation with revelation
  - confusing political settlement with philosophical resolution
  - treating better source preservation as superior truth
  - ranking before independent reconstruction
  - using a shared term as proof of identical doctrine
  - manufacturing synthesis where grounds diverge
  - manufacturing a victor where reciprocal burdens remain unmet

failure_recovery:
  hostile_source_dominance:
    action: suspend comparison and reconstruct the claimant from independent sources
  missing_primary_source:
    action: record mediated standing and limit conclusions
  evidence_asymmetry:
    action: preserve asymmetry and bound comparison
  incomplete_author_corpus:
    action: classify work-specific completion without generalizing to the author
  incompatible_standards:
    action: record incommensurability and the unresolved question of standard
  reciprocal_burdens_unmet:
    action: terminate with victor not established

termination_rule: >
  Reconstruction and comparison are complete only when every serious alternative has
  an independent source record, strongest claim, end, deed, consequence, internal
  tension, burden, limit, and uncertainty; asymmetries are explicit; comparison gates
  are recorded; and convergence, divergence, incommensurability, or unresolved priority
  is stated without manufactured victory.

behavioral_tests:
  - id: RA-TEST-001
    behavior: a witness cannot be reconstructed primarily through its rival when primary sources survive
  - id: RA-TEST-002
    behavior: title or office cannot certify claimant rank
  - id: RA-TEST-003
    behavior: strongest claim is reconstructed rather than a convenient weak formulation
  - id: RA-TEST-004
    behavior: self-description remains distinct from deed and consequence
  - id: RA-TEST-005
    behavior: source asymmetry cannot become substantive victory
  - id: RA-TEST-006
    behavior: comparison remains blocked until independent records are complete within scope
  - id: RA-TEST-007
    behavior: shared vocabulary does not establish identical doctrine
  - id: RA-TEST-008
    behavior: coinciding conclusions with divergent grounds are not laundered into synthesis
  - id: RA-TEST-009
    behavior: incommensurable standards may remain an affirmative result
  - id: RA-TEST-010
    behavior: reciprocal unmet burdens terminate with victor not established

speech_mechanism_integration:
  contract: speech/speech-mechanism.yaml
  rule: >
    Candidate reports must state rival alternatives in their strongest reconstructed
    form, identify comparison-gate status and evidence asymmetries, and preserve unmet
    reciprocal burdens rather than compressing them into a single verdict.

self_limitation: >
  This method governs fair reconstruction and comparison. It does not guarantee equal
  truth among alternatives, eliminate the possibility of ranking after burdens are met,
  or certify the repository as an impartial or wise final judge.
