depends_on:
  - speech-and-deed
  - inference-discipline
  - uncertainty-preservation

purpose: >
  Govern the interpretation of comic action as potentially substantive evidence
  concerning rank, motive, embodiment, dependence, audience, education, authority,
  and limitation.

governing_rule: >
  Comic elements may disclose philosophically relevant disproportion, pretension,
  motive, embodiment, dependence, or limitation and must not be excluded merely
  because they are humorous, low, embarrassing, or vulgar. Comic success, laughter,
  or exposure does not by itself establish the complete superiority of the comic
  speaker, author, audience, or interpreter.

permanent_interpretive_key: >
  Strauss's comedy corrects solemn scholarship. This directs attention to jokes,
  understatement, awkward detail, register, self-deprecation, and disproportion; it
  does not authorize automatic inversion or dismissal of explicit argument.

comic_signals:
  - joke
  - ridicule
  - understatement
  - exaggeration
  - embarrassment
  - anticlimax
  - bodily_detail
  - vulgar_expression
  - disproportion
  - self_deprecation
  - solemnity_disrupted_by_low_detail
  - title_or_office_exposed_by_action
  - public_victory_with_private_or_structural_defeat
  - laugher_or_poet_implicated_in_the_joke

possible_disclosures:
  - false_rank
  - intellectual_vanity
  - professional_pretension
  - spiritual_conceit
  - wounded_pride
  - bodily_dependence
  - political_helplessness
  - ignorance_of_audience
  - ignorance_of_ends
  - disparity_between_claim_and_capacity
  - false_neutrality
  - failed_education
  - dependence_of_the_high_on_the_low
  - hidden_cost_of_a_victorious_principle
  - limitation_of_the_exposer

required_examination:
  - identify who laughs and who is laughed at
  - distinguish immediate laughers from the work's wiser or later audiences
  - compare explicit statement with comic deed and outcome
  - identify the serious issue preserved inside the ridiculous presentation
  - test whether the comic author or interpreter is self-implicated
  - distinguish exposure of one defect from a complete judgment of the person or doctrine
  - preserve tragedy, suffering, justice, and unresolved alternatives where comedy does not exhaust them
  - classify the evidence and degree of inference

required_caution: >
  A comic exposure may establish a defect without resolving the serious question
  embodied by the ridiculous person. Comedy can be total within a dramatic form while
  remaining a partial mirror of life.

claimant_and_rank_safeguards:
  - ridicule does not certify the laugher
  - inability to answer a joke does not prove complete intellectual inferiority
  - comic defeat does not prove the defeated claim wholly false
  - comic victory may reveal the ugliness or contradiction of the victorious principle
  - solemn vocabulary and professional dignity do not prove seriousness or wisdom
  - low bodily detail may correct rank without reducing human life to appetite
  - the comic poet remains a claimant to wisdom and must be tested through speech and deed

valid_outputs:
  - DOCUMENTED_COMIC_ACTION
  - SUPPORTED_COMIC_DISCLOSURE
  - COMIC_DEFLATION_OF_RANK
  - COMIC_LIMIT_ESTABLISHED
  - COMIC_SELF_IMPLICATION
  - VICTORIOUS_PRINCIPLE_COMICALLY_QUALIFIED
  - SERIOUS_ISSUE_PRESERVED_WITHIN_COMEDY
  - COMIC_SIGNIFICANCE_UNRESOLVED

prohibited:
  - comedy treated as decoration
  - ridicule treated as refutation
  - comic inferiority treated as complete intellectual inferiority
  - solemnity treated as evidence of seriousness
  - laughter treated as proof of philosophic superiority
  - comic exposure treated as final resolution
  - every joke treated as coded doctrine
  - vulgarity treated as absence of philosophical relevance
  - comic success treated as a practical political program
  - the interpreter's amusement treated as evidence of superior rank

termination_rule: >
  A comic finding is complete only when the comic signal, speaker, audience, action,
  consequence, disclosed disproportion, preserved serious question, self-implication,
  and remaining uncertainty are recorded.

