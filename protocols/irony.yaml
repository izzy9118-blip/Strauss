depends_on:
  - speech-and-deed
  - inference-discipline
  - uncertainty-preservation

purpose: >
  Govern supported interpretation of disparities among explicit formulation,
  demonstrated activity, title, audience, arrangement, omission, consequence, and
  the complete textual or dramatic deed.

governing_rule: >
  Irony is a supported disparity, qualification, or pressure between explicit
  formulation and textual or dramatic deed. It must not be treated as automatic
  reversal, proof of concealed greatness, or authorization to invent a complete
  hidden doctrine.

required_comparison:
  - explicit_statement
  - speaker_or_claimant
  - claimed_title_or_rank
  - immediate_audience
  - wider_audience
  - occasion
  - dramatic_or_textual_action
  - structural_position
  - omission_or_silence
  - consequence
  - comparison_with_related_presentations
  - self_implication_of_author_or_interpreter

possible_functions:
  - qualification
  - limitation
  - protection
  - provocation
  - audience_differentiation
  - exposure_of_contradiction
  - pedagogical_testing
  - concealment
  - comic_deflation
  - simultaneous_literal_and_nonliteral_meaning
  - testing_of_claimed_rank
  - preservation_of_unresolved_alternatives

required_evidence:
  - a specific disparity or disproportion rather than generalized suspicion
  - correct identification of speaker, audience, occasion, and documentary layer
  - textual, dramatic, structural, or comparative support
  - an account of how deed qualifies speech
  - preservation of plausible literal meaning where the evidence permits it
  - classification of the inference and remaining uncertainty

claimant_and_rank_safeguards:
  - modest self-description does not prove concealed wisdom
  - confident self-description does not prove absence of wisdom
  - obscurity does not prove esotericism
  - persecution, ridicule, marginality, or misunderstanding does not establish rank
  - contradiction may indicate error, development, adaptation, tension, or irony
  - agreement with an ironic interpretation does not certify the interpreter
  - the author, laugher, or interpreter remains subject to the same speech-and-deed test

valid_outputs:
  - DOCUMENTED_IRONIC_TENSION
  - SUPPORTED_IRONIC_QUALIFICATION
  - SUPPORTED_IRONIC_LIMITATION
  - POSSIBLE_IRONIC_DIMENSION
  - CLAIMED_RANK_IRONICALLY_QUALIFIED
  - IRONIC_SELF_IMPLICATION
  - IRONY_NOT_ESTABLISHED

prohibited_inferences:
  - explicit statement therefore false
  - opposite statement therefore true
  - modesty therefore concealed greatness
  - obscurity therefore esoteric doctrine
  - contradiction therefore irony without further evidence
  - irony therefore unrestricted hidden teaching
  - irony therefore permission to disregard source status or context
  - ironic exposure therefore complete superiority of the exposer
  - audience differentiation therefore a second opposite doctrine

termination_rule: >
  An ironic finding is complete only when the supported disparity, its function,
  evidentiary basis, affected claim, audience, consequence, and unresolved alternatives
  are explicit. Where the evidence does not establish irony, preserve the literal claim
  and classify the ironic dimension as possible or not established.

