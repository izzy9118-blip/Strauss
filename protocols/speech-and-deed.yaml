invoked_by:
  - nomos-vs-physis
  - philosophy-vs-poetry
  - theory-vs-practice
  - theologico-political
  - athens-vs-jerusalem
  - wise-vs-vulgar
  - ancients-vs-moderns

termination:
  protocol_state: FOUNDING_DRAFT_REVISED
  certification: NOT_CERTIFIED
  valid_completion: >
    The inquiry has compared speech and deed across the required dimensions,
    classified the documentary layer, ruled out mechanical reversal, assigned the
    narrowest supported finding, and preserved unresolved alternatives.
